# `.github/workflows/tenant-baker-image.yml` — #334 Phase 2.
#
# Builds the `hippius-tenant-baker` container image (debian:trixie-
# slim + qemu-utils + cryptsetup + losetup + chroot + awscli +
# `scripts/tenant-image-bake.sh` + `binaries/tenant-baker/entrypoint.sh`)
# and pushes it to GitHub Container Registry. The image runs as a
# one-shot privileged k8s Job spawned by vali's
# `apps.tenant_bake.POST /v1/tenant-bakes` endpoint; the helm chart
# pins it by SHA-256 digest, so this workflow's job is to produce
# the digest reproducibly.
#
# The image is PRIVATE — same posture as vali. The baker pod runs
# in the `vali` namespace + pulls via the same GHCR ExternalSecret
# (`regcred` k8s Secret materialised by ExternalSecrets-operator).
#
# Trigger: push to main / v* tags, pull_request, workflow_dispatch
# — same shape as `vali-image.yml`. Path filter watches:
#   - `binaries/tenant-baker/**` (Dockerfile + entrypoint changes)
#   - `scripts/tenant-image-bake.sh` (the bake-logic source-of-truth
#     copied into the image at build time — the entrypoint
#     subprocesses it)
#   - this workflow file itself.
#
# Supply-chain discipline (§F): every GitHub Action is pinned by
# commit SHA; the image's base layers are digest-pinned in the
# Dockerfile; the pushed image is cosign-signed keyless (GitHub
# OIDC → Sigstore). Identical posture to `vali-image.yml`.

name: tenant-baker-image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Rebuild on every input the runtime image embeds — DERIVED, not
    # hand-listed: every in-tree crate the Dockerfile's `cargo build` lines
    # transitively compile (per `cargo metadata`) plus every host path it
    # COPYs out of the build context.
    # `scripts/dev/image-build-inputs-test.sh` recomputes both sets in CI and
    # fails if this list stops covering them.
    #
    # The hand-maintained version missed `binaries/agent-keepalive` (the §23
    # SNP liveness daemon), `vendor/sev`, and — worst — `scripts/dracut/**`
    # and `scripts/guest/**`, both of which the Dockerfile COPYs verbatim
    # into the baker image. Editing the golden dracut mount hook or the #908
    # keepalive shim rebuilt NOTHING; production bakes kept staging the old
    # copy, which is #908's failure mode in #908's own workflow.
    paths:
      - "binaries/tenant-baker/**"
      - "scripts/tenant-image-bake.sh"
      - "scripts/initramfs/**"
      - "scripts/dracut/**"
      - "scripts/guest/**"
      - "binaries/guest-release/**"
      - "binaries/vsock-ticket/**"
      - "binaries/agent-initramfs/**"
      - "binaries/agent-keepalive/**"
      - "binaries/agent-tenant-telemetry/**"
      - "hippius-types/**"
      - "hippius-guest/**"
      - "kbs-core/**"
      - "vendor/sev/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/tenant-baker-image.yml"
  pull_request:
    # Same derived set as `push` (the check asserts the two lists match).
    paths:
      - "binaries/tenant-baker/**"
      - "scripts/tenant-image-bake.sh"
      - "scripts/initramfs/**"
      - "scripts/dracut/**"
      - "scripts/guest/**"
      - "binaries/guest-release/**"
      - "binaries/vsock-ticket/**"
      - "binaries/agent-initramfs/**"
      - "binaries/agent-keepalive/**"
      - "binaries/agent-tenant-telemetry/**"
      - "hippius-types/**"
      - "hippius-guest/**"
      - "kbs-core/**"
      - "vendor/sev/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/tenant-baker-image.yml"
  workflow_dispatch:

# Minimal: read the repo, write packages (push to GHCR), and an
# OIDC token for cosign keyless signing. Nothing else.
permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/thenervelab/hippius-tenant-baker

jobs:
  tenant-baker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Match the existing vali / kbs / edge image workflows: push
      # to ghcr.io under thenervelab. The cluster's `ghcr-pull-
      # secret` (ExternalSecret-materialised) authenticates the
      # pull. registry.hippius.com migration is tracked separately
      # — needs HIPPIUS_REGISTRY_USERNAME/PASSWORD secrets +
      # a parallel cluster pull secret bootstrapped first.
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign (version pinned)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.0.6"

      - name: Image tags
        id: tags
        run: |
          set -euo pipefail
          tags="${IMAGE}:sha-${GITHUB_SHA::12}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tags="${tags},${IMAGE}:latest"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tags="${tags},${IMAGE}:${GITHUB_REF_NAME}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          # Context is the repo root — the Dockerfile copies
          # `scripts/tenant-image-bake.sh` AND
          # `binaries/tenant-baker/entrypoint.sh` from canonical
          # source paths, so the build context must include both.
          context: .
          file: binaries/tenant-baker/Dockerfile
          platforms: linux/amd64
          # Skip the push on pull_request — every PR run validates
          # the build but only main + tags ship a registry-pushed
          # image. Same posture as vali-image.yml's GitHub-hosted
          # runner (PRs from forks would hit `permission: packages:
          # write` denial if `push: true` here).
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          # Single-arch image, no provenance manifest — keeps the
          # pushed digest a plain image digest the Helm chart pins
          # directly.
          provenance: false

      - name: Sign the image (cosign keyless)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Report the pushed digest
        if: ${{ github.event_name != 'pull_request' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "### tenant-baker image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
