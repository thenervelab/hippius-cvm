# `.github/workflows/miner-agent-image.yml` — Phase 2B follow-up.
#
# Builds the `hippius-miner-agent` container image (cross-compiled
# `hippius-miner-agent` Rust binary + the libvirt / qemu / cryptsetup /
# e2fsprogs / util-linux runtime tooling it shells out to) and pushes
# it to the GitHub Container Registry. Replaces the legacy "scp the
# binary to miner-1" workflow with a cluster-driven `docker pull` so
# the validator-side ops never SSH the miner.
#
# Trigger: push to main / v* tags, pull_request, and workflow_dispatch
# — same shape as `vali-image.yml` / `kbs-image.yml` /
# `tenant-baker-image.yml`. Paths cover the agent crate + its workspace
# deps so a change in any of them re-publishes a fresh digest.
#
# Supply-chain discipline (§F): every GitHub Action pinned by commit
# SHA; the pushed image is cosign-signed keyless (GitHub OIDC →
# Sigstore).

name: miner-agent-image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # DERIVED, not hand-listed: the in-tree crates
    # `cargo build -p hippius-miner-agent --features snp` transitively
    # compiles, per `cargo metadata`.
    # `scripts/dev/image-build-inputs-test.sh` recomputes the closure in CI and
    # fails if this list stops covering it. The previous list had it backwards
    # in both directions: `hippius-guest` and `kbs-core` are NOT in the
    # agent's graph, while `binaries/image-provenance`,
    # `binaries/miner-uki-fetch` and `vendor/sev` (the `[patch.crates-io]`
    # in-tree SNP crate the launch-digest recompute links) ARE and were absent.
    paths:
      - "binaries/miner-agent/**"
      - "binaries/miner-uki-fetch/**"
      - "binaries/image-provenance/**"
      - "hippius-types/**"
      - "vendor/sev/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/miner-agent-image.yml"
  pull_request:
    # Same derived set as `push` (the check asserts the two lists match).
    paths:
      - "binaries/miner-agent/**"
      - "binaries/miner-uki-fetch/**"
      - "binaries/image-provenance/**"
      - "hippius-types/**"
      - "vendor/sev/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/miner-agent-image.yml"
  workflow_dispatch:

# Minimal: read the repo, write packages (push to GHCR), and an OIDC
# token for cosign keyless signing. Nothing else.
permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/thenervelab/hippius-miner-agent

jobs:
  miner-agent-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign (version pinned)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.0.6"

      - name: Image tags
        id: tags
        run: |
          set -euo pipefail
          tags="${IMAGE}:sha-${GITHUB_SHA::12}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tags="${tags},${IMAGE}:latest"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tags="${tags},${IMAGE}:${GITHUB_REF_NAME}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          # Context is the repo root — the Rust stage builds a
          # workspace member, so the whole workspace context is needed.
          context: .
          file: binaries/miner-agent/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Single-arch image, no provenance manifest — keeps the
          # pushed digest a plain image digest the operator can pin
          # by `@sha256:...` for `docker pull`.
          provenance: false

      - name: Sign the image (cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Report the pushed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "### miner-agent image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
