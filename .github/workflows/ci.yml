name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# `runs-on` reads the CI_RUNS_ON_{DEFAULT,BUILD,HEAVY} repo variables
# (Hippius runner labels). Unset → GitHub-hosted ubuntu-latest.
jobs:
  rust:
    runs-on: ${{ vars.CI_RUNS_ON_HEAVY || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      # The workspace links some very large test binaries (the vendored
      # Substrate pallets in particular). On a stock ubuntu-latest runner
      # the root filesystem fills mid-link and `ld` dies with SIGBUS —
      # `collect2: fatal error: ld terminated with signal 7 [Bus error]`
      # while linking `hippius-onchain-registry`. That reads like a
      # toolchain bug and is really a full disk, which is why it cost
      # several re-runs across #1055/#1056 before the pattern was legible.
      #
      # These preinstalled toolchains are worth ~20 GB and nothing in this
      # workspace uses them. `df` is printed either side so the next
      # occurrence is diagnosable from the log rather than by inference.
      - name: Reclaim runner disk
        run: |
          echo "before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          echo "after:"; df -h /
      # ubuntu-latest ships build-essential + pkg-config but NOT the
      # cryptsetup / clang stack the `cryptsetup-rs` + bindgen crates
      # need at build time. Mirror the `hippius-runner-k8s` image's
      # baked apt set so the cold build resolves identically.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libcryptsetup-dev clang libclang-dev
      - name: Install Rust toolchain (rust-toolchain.toml-pinned)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable-branch pin
      # The epoch-closer gate runs `node` and the kbs chart tests run `helm`;
      # only ubuntu-latest preinstalls them.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0
      # Tests compare st_dev of a tempdir against the files in it; on an
      # overlayfs /tmp (Hippius runner root) files report the upper layer's
      # device, not the overlay's. Keep temp files on a plain filesystem.
      - name: Temp dir on the runner work disk
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "$GITHUB_ENV"
      - name: Toolchain show
        run: rustup show
      # Cache `~/.cargo/registry`, `~/.cargo/git`, and `target/` keyed
      # by `Cargo.lock` + the workspace `Cargo.toml` files (Swatinem's
      # action handles the key derivation + invalidation correctly,
      # incl. saving only when the source-hash changed). Without this
      # every PR pays the full ~30 min cold-build cost for the
      # vendored Substrate pallets in `thenervelab/thebrain` (~9
      # transitive `pallet-*` crates) + the openssl-sys native build
      # the `sev` dep pulls in. With it, incremental PRs run in
      # ~5 min. Distinct `shared-key` so the `packer-f3` job below
      # gets its own cache (different feature flags / RUSTC_WRAPPER
      # would invalidate each other's keys otherwise).
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "ci-rust"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # `pallet-compute-scoring` is vendored into the thebrain runtime and
      # must compile into a wasm32 Substrate runtime, so it depends on
      # `hippius-types` with `default-features = false` — see that crate's
      # "no_std build (PR-I3)" preamble. NOTHING in CI ever built either
      # crate that way, so a module that reached for `String` without
      # `use alloc::string::String;` broke the wasm build INVISIBLY: a
      # host-target build resolves `String` from the std prelude and stays
      # green. That is exactly what happened to `kbs_vsock.rs`, and it was
      # found only when the chain team needed to vendor the pallet.
      # Build the pallet the way a runtime does, so the next such omission
      # fails here instead of at the chain-integration step.
      - name: wasm32 no_std build (the Substrate-runtime shape)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p hippius-types --no-default-features --target wasm32-unknown-unknown
          cargo build -p pallet-compute-scoring --no-default-features --target wasm32-unknown-unknown
      # PR-E1.5 §20 — fail the build if any print/log/format macro in
      # the initramfs agent could leak seed / key material to a log or
      # the serial console. Mirrors `tests/no_seed_logging.rs`.
      - name: no-seed-logging guard (§20)
        run: bash scripts/check-no-seed-logging.sh
      # P3 — trust-critical image provenance (OFFLINE half). The KBS's SNP
      # measurement binds the CVM shape, not the container image inside it,
      # so the deployment-side claim about which build is in that CVM has to
      # be checkable: every trust-critical chart declares its digest's build
      # provenance (workflow ref, commit sha, run URL, merged-or-not), and
      # `verify-gitops-signatures.yml` binds that declaration to the digest's
      # Sigstore signature. This step runs the hermetic policy tests + the
      # offline validation of the committed charts — no network, no cosign —
      # so the invariants live in a REQUIRED check.
      - name: image-provenance declarations (P3)
        run: bash scripts/dev/image-provenance-test.sh

      # A newcomer meets the docs before the code, so a link that goes
      # nowhere fails on a person instead of a compiler. This found
      # `scripts/run-ci-locally.sh` — promised twice in the README since
      # PR #176 and never written — and it runs on `release/**` pushes
      # too, which is the only thing that catches a link to a file the
      # deploy scrub creates on the publishable branch alone.
      - name: Documentation links resolve
        run: bash scripts/dev/docs-links-test.sh
      # Multi-OS bake dispatch: shellcheck the bake script + diff the
      # per-distro `--print-plan` decisions against the committed golden
      # (catches a drifted kernel package / family mapping before any
      # live bake). No root / network needed.
      - name: bake distro-dispatch golden
        run: |
          sudo apt-get install -y -q shellcheck
          bash -n scripts/tenant-image-bake.sh
          shellcheck -S error scripts/tenant-image-bake.sh scripts/dev/distro-plan-test.sh scripts/dev/disk-mode-test.sh scripts/dev/package-refresh-test.sh scripts/dev/tenant-rootfs-kernel-hold-test.sh scripts/dev/tenant-image-bake-kernel-hold-test.sh
          bash scripts/dev/distro-plan-test.sh
          # golden-bake PR1: the --disk-mode selector gate (legacy_luks
          # default intact; golden_verity_overlay accepted). Root-free.
          bash scripts/dev/disk-mode-test.sh
          # CDN I3: the cdn-node bake profile gate + its rootfs installer
          # (users, units, rendered configs, guard, firewall, no sshd).
          # Root-free; needs python3 (tomllib) only.
          shellcheck -S warning scripts/cdn-node/install-cdn-node.sh scripts/dev/cdn-node-profile-test.sh
          bash scripts/dev/cdn-node-profile-test.sh
          # cdn-node ephemeral root: the marker-gated discard of the golden
          # upper, data/ scrub + noexec, panic=10 and M0-only in the golden
          # overlay library; inert without the marker. Root-free.
          shellcheck -S warning -x scripts/dev/golden-ephemeral-test.sh
          bash scripts/dev/golden-ephemeral-test.sh
          # The initramfs shell is not bash: run the library under dash too.
          dash scripts/dev/golden-ephemeral-test.sh
          # F6: --package-refresh gate, stage-1 cache key, and the gated
          # upgrade in both chroot arms. Root-free.
          bash scripts/dev/package-refresh-test.sh
          # Kernel hold in both bake chroots: per-distro meta-package
          # installed AND held, every concrete kernel held, no swallowed
          # miss. Root-free (PATH-shimmed dpkg-query/apt-mark/apt-get).
          bash scripts/dev/tenant-rootfs-kernel-hold-test.sh
          bash scripts/dev/tenant-image-bake-kernel-hold-test.sh
          # Untrusted-miner (M0) guest hardening: the NoCloud pin
          # (fs_label null — no miner `cidata` disk), ds-identify
          # enabled, no guest agent on a miner-attachable virtio channel,
          # ssh-generator + serial-getty masked. Runs the bake's own
          # sections + exit-3 assertions root-free, then feeds the written
          # config to the REAL cloud-init NoCloud datasource against an
          # attacker cidata disk + SMBIOS serial (cloud-init installed
          # for its Python module only; the runner never boots with it).
          sudo apt-get install -y -q --no-install-recommends cloud-init
          shellcheck -S error scripts/dev/tenant-image-bake-m0-harden-test.sh
          bash scripts/dev/tenant-image-bake-m0-harden-test.sh
          # golden-bake PR3: the guest overlay boot library — GOLDEN-mode
          # detection (both-tokens fail-closed) + param validation.
          shellcheck -S error -s sh scripts/initramfs/hippius-golden-overlay.sh scripts/initramfs/hippius-golden-boot scripts/initramfs/hippius-golden-hook
          bash scripts/dev/golden-overlay-test.sh
          # golden overlay SELinux root-inode label (CS10/Fedora): the fresh
          # ext4 upper would give the merged "/" `unlabeled_t` → enforcing
          # guest denies confined domains `search /`. Assert the RHEL-gated
          # rootcontext= mount option is added (and Debian/Ubuntu unchanged).
          shellcheck -S error scripts/dev/golden-overlay-selinux-test.sh
          bash scripts/dev/golden-overlay-selinux-test.sh
          # GOLDEN anti-rollback: the stamp kept INSIDE the guest-keyed
          # volume, compared after unlock against the last CONFIRMED stamp
          # the KBS returns in its SIGNED release response. Without it a
          # miner can restore an OLD overlay while leaving the CURRENT
          # counter on the miner-writable state disk — the KBS CAS passes,
          # dm-integrity is satisfied (authentic old ciphertext) and the
          # tenant's disk is silently reverted. Several cases pin the
          # NON-ACCUMULATION property: comparing against the boot counter
          # instead would let repeated aborted boots widen the gap until the
          # disk is permanently unopenable. Root-free, temp-dir only.
          # busybox: section 26 also runs the #1347 data bind under the
          # shells the initramfs really uses (busybox ash, dash).
          sudo apt-get install -y -q --no-install-recommends busybox
          shellcheck -S error scripts/dev/golden-stamp-test.sh
          bash scripts/dev/golden-stamp-test.sh
          # Per-VM upper init: no-wipe 4K format + parallel journal-less
          # wipe before mkfs, and the interrupted-first-boot re-init that
          # fires ONLY for (init label, KBS expectation 0, no filesystem).
          shellcheck -S error scripts/dev/golden-upper-init-test.sh
          bash scripts/dev/golden-upper-init-test.sh
          # Customer-held keys (M1/M2): the upper's `hippius-keymode` LUKS2
          # token — written right after the first-boot format, read back
          # (mode + guardian fingerprint checked, share version passed on)
          # before any KBS/guardian contact; M0 reads and writes none.
          shellcheck -S error scripts/dev/golden-keymode-test.sh
          bash scripts/dev/golden-keymode-test.sh
          # Customer-held keys H5b: cloud-init user-data on the volume's
          # FIRST boot only — stable instance-id, later boots get an empty
          # user-data, undeterminable first-boot state ⇒ ignored, M0
          # unchanged. Drives the real release core with a fake release
          # binary. Then the REAL cloud-init (Ubuntu 24.04 golden base, in
          # a throwaway container) proves a later boot with that iid and an
          # empty user-data runs nothing and keeps the tenant's keys.
          shellcheck -S error scripts/dev/golden-userdata-test.sh
          bash scripts/dev/golden-userdata-test.sh
          shellcheck -S error scripts/dev/cloud-init-first-boot-only-check.sh scripts/dev/cloud-init-first-boot-only-guest.sh
          bash scripts/dev/cloud-init-first-boot-only-check.sh ubuntu:24.04
          # golden-bake PR4: the SHARED base per-instance scrub (no ssh
          # host keys / machine-id / cloud state / logs; swap fails closed).
          shellcheck -S error scripts/dev/golden-sanitize-test.sh
          bash scripts/dev/golden-sanitize-test.sh
          # initrd-only rebuild of an existing golden bake: every refusal
          # (source sha vs measurement.json, kernel mismatch, non-golden /
          # rhel / non-hippius base, stale scripts in the output, output
          # prefix nested or non-empty), the measurement shape and the
          # two-runs-same-bytes property, on fixtures with the root-only
          # chroot build swapped for a fixture builder.
          sudo apt-get install -y -q --no-install-recommends squashfs-tools
          shellcheck -S error scripts/tenant-initrd-rebuild.sh scripts/dev/tenant-initrd-rebuild-test.sh
          bash scripts/dev/tenant-initrd-rebuild-test.sh
          # Guest components release (docs/design/guest-component-rollout.md):
          # the release record parser, the initramfs boot step (no record =
          # no-op, unit links written even when the image does not mount,
          # fail-closed link writes, strict SELinux labels) under bash, dash
          # and busybox ash, and the release builder (reproducible, labelled
          # image, leaf-only cpio members, refusals). The builder needs a
          # STATIC busybox, extracted from the package without installing it
          # (busybox-static conflicts with the busybox installed above).
          sudo apt-get install -y -q --no-install-recommends squashfs-tools-ng cpio dash
          (cd "${RUNNER_TEMP}" && apt-get download busybox-static && dpkg-deb -x busybox-static_*.deb bbs)
          shellcheck -S error scripts/dev/guest-release-test.sh scripts/guest/build-guest-release.sh
          GUEST_RELEASE_TEST_STATIC_BUSYBOX="$(find "${RUNNER_TEMP}/bbs" -name busybox -type f | head -n1)" \
            bash scripts/dev/guest-release-test.sh
          # guest-initrd-build.sh: the release appended to fixture base sets
          # of both families, the output measurement vali_swap_vm_initrd
          # reads, reproducibility and every refusal.
          shellcheck -S error -x scripts/guest/guest-initrd-build.sh scripts/dev/guest-initrd-build-test.sh scripts/dev/guest-initrd-fixtures.sh scripts/dev/fake-aws.sh
          GUEST_RELEASE_TEST_STATIC_BUSYBOX="$(find "${RUNNER_TEMP}/bbs" -name busybox -type f | head -n1)" \
            bash scripts/dev/guest-initrd-build-test.sh
          # The same boot step for real (root): the release's static busybox
          # loop-mounts the built image under a noexec /run, the agents
          # execute, and the mount follows `mount --move` of /run.
          shellcheck -S error scripts/dev/guest-release-mount-test.sh
          sudo env PATH="${PATH}" \
            GUEST_RELEASE_TEST_STATIC_BUSYBOX="$(find "${RUNNER_TEMP}/bbs" -name busybox -type f | head -n1)" \
            bash scripts/dev/guest-release-mount-test.sh
          # golden dracut module (CS10/Fedora): the cmdline rootok hook
          # both-tokens fail-closed logic (root-free) + shellcheck the
          # module scripts. The full container boot-asset gate runs in the
          # dracut-module workflow.
          shellcheck -S error -s sh \
            scripts/dracut/95hippius-golden/parse-hippius-golden.sh \
            scripts/dracut/95hippius-golden/hippius-golden-mount.sh \
            scripts/dracut/95hippius-golden/hippius-net-teardown.sh
          bash -n scripts/dracut/95hippius-golden/module-setup.sh
          shellcheck -S error scripts/dev/golden-dracut-parse-test.sh
          bash scripts/dev/golden-dracut-parse-test.sh
          # Unquoted-heredoc command-substitution guard (a backtick in a
          # comment inside <<CHROOT_EOF EXECUTED mid-bake and dropped the
          # hippius initramfs hook — every guest hung at cryptroot).
          bash scripts/dev/bake-heredoc-guard.sh
          # Base-image fetch: the SSRF guard (audit RA-M1) must stay
          # fail-CLOSED — a non-public address ANYWHERE in the resolution
          # set aborts the whole fetch, never "skip the bad one and use a
          # good one", which is the DNS-rebinding no-op — while a
          # TRUNCATED transfer (curl exit 18, the class `--retry` does not
          # cover; it killed golden-fedora bake c08e520e 1.6 GB into a
          # 2 GB download) falls back across the OTHER validated public
          # addresses and never leaves a short file behind. Runs the bake
          # script's own resolver heredoc with faked DNS, and its transfer
          # loop against real curl + truncating loopback servers.
          shellcheck -S error scripts/dev/ssrf-fetch-test.sh
          bash scripts/dev/ssrf-fetch-test.sh
          # §23 SNP liveness keepalive: EXECUTES the bake's staging block
          # against a temp rootfs and the guest shim against a fixture
          # cmdline. Pins the binary path+mode, that the unit is installed
          # AND ENABLED (an installed-but-not-enabled unit is the "declared
          # but not wired" failure this repo has shipped three times), that
          # the cadence stays <= the CHART's uptimeLiveness.coverageSeconds
          # (a wider cadence leaves live time uncovered and the armed gate
          # credits it ZERO), and that a KBS-less / non-Hippius boot is
          # inert rather than fatal.
          shellcheck -S error -s sh scripts/guest/hippius-keepalive-start
          shellcheck -S error scripts/dev/keepalive-unit-test.sh
          bash scripts/dev/keepalive-unit-test.sh
      # SSH key-only on the four golden bases, with each distro's REAL sshd
      # and cloud-init in a throwaway container: cloud-init's own
      # `ssh_pwauth: true` writer reproduces password login (control), the
      # bake's 00-hippius-harden.conf turns it off (`sshd -T`), the bake's
      # own sshd -T check passes and cleans up, and the tenant can still
      # override it (earlier drop-in, or a Match block).
      - name: sshd key-only on every golden distro
        run: |
          shellcheck -S error scripts/dev/sshd-key-only-test.sh scripts/dev/sshd-key-only-guest.sh
          bash scripts/dev/sshd-key-only-test.sh
      # cloud-init writes no guest network config: with the bake's
      # `network: {config: disabled}` each golden distro's REAL cloud-init
      # stops at system_cfg and never generates the fallback config that
      # raced udev's eth0 -> enp1s0 rename on Fedora 43 (control: without
      # it, the fallback is generated). The DHCP profile that replaces it
      # is boot-checked by guest-network-without-cloud-init-boot.sh.
      - name: cloud-init network disabled on every golden distro
        run: |
          shellcheck -S error scripts/dev/cloud-init-network-disabled-test.sh scripts/dev/cloud-init-network-disabled-guest.sh scripts/dev/guest-network-without-cloud-init-boot.sh
          bash scripts/dev/cloud-init-network-disabled-test.sh
      # The initramfs DHCP client and the booted guest present the same
      # client-id (#289): Ubuntu's stock initramfs dhcpcd config (`duid ll`)
      # + the zz-hippius-dhcp-clientid hook, Debian's klibc ipconfig, each
      # followed by the guest's 01:<MAC>, against a real dnsmasq. Control:
      # without the hook, a second lease.
      - name: initramfs DHCP client-id matches the booted guest
        run: |
          shellcheck -S error scripts/dev/initramfs-dhcp-clientid-test.sh
          shellcheck -S error -s sh scripts/initramfs/hippius-dhcp-clientid-hook
          bash scripts/dev/initramfs-dhcp-clientid-test.sh
      # Multi-OS unlock: shellcheck the shared release core + both
      # family wrappers, and pin the security-load-bearing step order
      # (#296 header gate before any network; userdata before KEK).
      # The §23 epoch closer had NO tests, and it is the only thing that
      # submits miner rewards. Both of its gates are refusals — "the pallet is
      # gone" and "the fleet outgrew the per-call batch bound" — and a refusal
      # that quietly stops refusing is invisible until the day it mattered.
      # Runs the REAL close-epoch.mjs against a stubbed @polkadot/api; nothing
      # inside the script is mocked.
      # #908 shipped a bake that could not run: `tenant-image-bake.sh` reads
      # the keepalive shim from `${SCRIPT_DIR}/guest/`, the Dockerfile never
      # COPYed it, and BOTH the image build and the whole suite stayed green —
      # the first real bake died at step 3/6 with "keepalive shim missing"
      # after pulling a cloud image. Pin the RELATIONSHIP (bake script reads X
      # => Dockerfile ships X), because every test that exercises only the
      # declared half passes.
      - name: baker image ships every asset the bake reads
        run: |
          shellcheck -S error scripts/dev/baker-assets-test.sh
          bash scripts/dev/baker-assets-test.sh
      # Tenant-UKI input fetch: snapshot.debian.org answers 504
      # intermittently, and ONE unretried curl per input kept
      # `tenant-uki-build` red from 2026-09-10 on, across commits that
      # never touched the UKI — so the pinned KAT went unverified. Runs
      # the REAL fetch-inputs.sh against a PATH-shimmed curl: 5xx / 429 /
      # transport failures retried with backoff (5 attempts), a 404 fails
      # on the first attempt, a SHA-256 mismatch is never retried, every
      # call carries connect/transfer timeouts. Needs an empty /build
      # (the script's Docker mount path; created via passwordless sudo).
      - name: tenant-UKI input fetch retry
        run: |
          bash -n packer/tenant-uki/uki/scripts/fetch-inputs.sh
          shellcheck -S error packer/tenant-uki/uki/scripts/fetch-inputs.sh scripts/dev/uki-fetch-retry-test.sh
          bash scripts/dev/uki-fetch-retry-test.sh
      # The same defect one layer up the supply chain: `kbs-image.yml`'s
      # `paths:` filter never listed `kbs-transport/`, where the ENTIRE KBS
      # `/v1/admin` router lives. A change confined to that crate produced a
      # green CI run, a merged PR and NO NEW IMAGE — the fix silently never
      # shipped. Five other image workflows had the same hole (vendor/sev, the
      # four binaries vali shells out to on every launch, the golden dracut
      # module the baker COPYs verbatim, …).
      # Appending the missing entries fixes today and rots tomorrow, because a
      # hand-written list cannot track a dependency graph. So this DERIVES the
      # answer — workflow → its Dockerfile → the packages that Dockerfile
      # compiles → their transitive in-tree crates via `cargo metadata`, plus
      # every host path the Dockerfile COPYs — and fails when the filter stops
      # covering it. Runs in the `rust` job for the warm cargo cache.
      - name: image workflows rebuild on every real build input
        run: |
          shellcheck -S error scripts/dev/image-build-inputs-test.sh
          bash scripts/dev/image-build-inputs-test.sh
      # The operator staging script is executable code with a security
      # contract (wrap the user-data; digest the AT-REST bytes the KBS
      # will hash) and no test ran it — a digest taken over the wrong
      # bytes surfaces as a KBS DigestMismatch two systems away.
      - name: tenant-secrets staging contract
        run: |
          shellcheck -S error scripts/tenant-secrets-stage.sh scripts/dev/tenant-secrets-stage-test.sh
          bash scripts/dev/tenant-secrets-stage-test.sh
      - name: epoch-closer refusal gates
        run: |
          shellcheck -S error scripts/dev/epoch-close-guard-test.sh
          node --check deploy/epoch-closer/close-epoch.mjs
          bash scripts/dev/epoch-close-guard-test.sh
      - name: release-core step-order golden
        run: |
          bash -n scripts/initramfs/hippius-release-core.sh
          bash -n scripts/initramfs/hippius-luks-keyscript
          bash -n scripts/dracut/90hippius-luks/hippius-release-runner.sh
          shellcheck -S error -s sh \
            scripts/initramfs/hippius-release-core.sh \
            scripts/initramfs/hippius-luks-keyscript \
            scripts/dracut/90hippius-luks/hippius-release-runner.sh \
            scripts/dracut/90hippius-luks/hippius-net-teardown.sh
          bash scripts/dev/release-core-order-test.sh
      - name: build
        run: cargo build --workspace --locked

      # Seven `attest::tests` need a real AMD-signed Genoa VEK, including
      # the anti-forgery ones. A VEK is issued per-chip and carries that
      # chip's HWID, so it is NOT committed — this repository is meant to
      # be publishable and a committed VEK names one physical machine.
      #
      # The tests SKIP when the fixture is absent, which is right for
      # someone who cloned the repo and owns no Genoa hardware, and wrong
      # for us. So: in THIS repository the secret must exist, and its
      # absence fails the job instead of quietly deleting seven tests.
      # A fork has no secrets and is not held to that.
      - name: Materialise the Genoa VEK test fixture
        id: vek
        env:
          VEK_PEM: ${{ secrets.HIPPIUS_GENOA_VEK_PEM }}
        run: |
          set -euo pipefail
          if [ -z "${VEK_PEM}" ]; then
            if [ "${{ github.repository }}" = "thenervelab/hippius-compute-internal" ]; then
              echo "::error::HIPPIUS_GENOA_VEK_PEM is unset. Seven attest:: tests — including"
              echo "::error::forged_genoa_report_signature_denied — would SKIP, and a skipped"
              echo "::error::anti-forgery test is worse than no test. Restore the secret."
              exit 1
            fi
            echo "::notice::No Genoa VEK available (fork). The attest:: chain tests will skip."
            exit 0
          fi
          printenv VEK_PEM > "${RUNNER_TEMP}/genoa-vek.pem"
          chmod 0600 "${RUNNER_TEMP}/genoa-vek.pem"
          echo "HIPPIUS_VEK_FIXTURE=${RUNNER_TEMP}/genoa-vek.pem" >> "$GITHUB_ENV"

      - name: test
        run: cargo test --workspace --locked

      # `cargo test` hides a passing test's stderr, so a test that skipped
      # and a test that verified an AMD signature chain look identical in
      # the log above — both are a green dot. That is not good enough for
      # the anti-forgery tests: if this repository ever loses the VEK
      # secret, the seven attest:: tests would vanish silently and CI would
      # stay green.
      #
      # So assert it. `--nocapture` surfaces the skip messages, and their
      # presence here is a failure rather than a note.
      - name: The attest chain tests must have RUN, not skipped
        if: env.HIPPIUS_VEK_FIXTURE != ''
        run: |
          set -uo pipefail
          out="$(cargo test -p hippius-kbs-server --lib attest:: -- --nocapture 2>&1)"
          if printf '%s' "${out}" | grep -q 'SKIPPED — no Genoa VEK'; then
            echo "::error::A VEK fixture was provided, yet attest:: tests still skipped:"
            printf '%s\n' "${out}" | grep 'SKIPPED — no Genoa VEK'
            exit 1
          fi
          echo "attest:: chain tests ran against the supplied VEK — no skips."
      # The committed `test_vectors/allowlist/dev.cose` is the known-
      # answer for the §22 allowlist minter. Canonical-CBOR + EdDSA's
      # RFC 8032 §5.1.6 determinism makes the bytes reproducible; this
      # job re-mints from the same manifest + dev seed and diffs. Any
      # drift fails CI loudly — a §22 artifact whose bytes shift
      # silently under the runtime's signature check would otherwise
      # land unobserved.
      - name: §22 allowlist KAT
        run: |
          set -eu
          cargo run --locked -p hippius-kbs-allowlist-tool -- \
            --manifest test_vectors/allowlist/dev-manifest.toml \
            --seed packer/kbs-uki/keys/dev/provenance-root.dev.ed25519 \
            --out /tmp/dev.cose
          diff -q test_vectors/allowlist/dev.cose /tmp/dev.cose

  # SEV-SNP checks that cannot ride the cross-platform `rust` gate:
  #   - the real SEV-SNP launch digest — `sev::measurement` is
  #     Linux-only + needs openssl, so the `snp` feature of both
  #     `uki-measure` (PR-F3) and `miner-agent` (PR-MA-3) is
  #     non-default and the `rust` gate never builds it;
  #   - the dm-verity rootfs reproducibility shell test, which needs
  #     mksquashfs + veritysetup.
  packer-f3:
    runs-on: ${{ vars.CI_RUNS_ON_HEAVY || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      # ubuntu-latest needs the `--features snp` build's openssl-sys
      # native dep + the dm-verity test's mksquashfs / veritysetup.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev squashfs-tools cryptsetup-bin
      - name: Install Rust toolchain (rust-toolchain.toml-pinned)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable-branch pin
      # Tests compare st_dev of a tempdir against the files in it; on an
      # overlayfs /tmp (Hippius runner root) files report the upper layer's
      # device, not the overlay's. Keep temp files on a plain filesystem.
      - name: Temp dir on the runner work disk
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "$GITHUB_ENV"
      - name: Toolchain show
        run: rustup show
      # Separate cache key from the `rust` job — `--features snp`
      # builds the `sev` crate with openssl-sys natively linked, which
      # produces different rustc artifacts than the default-feature
      # tree. Sharing one key between the two jobs would invalidate
      # the cache on every alternating run. Both jobs are 30+ min
      # cold; with their own keys both go incremental.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "ci-packer-f3"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `--locked` is omitted on the two cargo steps below: enabling a
      # cargo feature forces a full dependency re-resolve, and the
      # pinned `thebrain` vendored dep `pallet-staking-reward-fn` has a
      # Cargo.toml (`repository` set as a string AND
      # `repository.workspace`) the current strict cargo rejects
      # mid-resolve — which is fatal under `--locked`. The lockfile is
      # still pinned: the "Cargo.lock unchanged" step below proves the
      # snp build neither needs nor performs any lock update.
      - name: uki-measure clippy --features snp
        run: cargo clippy -p hippius-uki-measure --features snp --all-targets -- -D warnings
      - name: uki-measure test --features snp
        run: cargo test -p hippius-uki-measure --features snp
      # PR-MA-3 — the miner-agent's pre-flight SEV-SNP launch digest.
      # `launch_digest_test` re-uses `test_vectors/snp/` and asserts
      # byte-equality with the PR-F3 allowlist measurement.
      - name: miner-agent clippy --features snp
        run: cargo clippy -p hippius-miner-agent --features snp --all-targets -- -D warnings
      - name: miner-agent test --features snp
        run: cargo test -p hippius-miner-agent --features snp
      # The C2 recompute vali pins from — and the proof that the vCPU
      # count moves the launch digest (`tests/vcpu_count.rs`).
      - name: launch-digest clippy --features snp
        run: cargo clippy -p hippius-launch-digest --features snp --all-targets -- -D warnings
      - name: launch-digest test --features snp
        run: cargo test -p hippius-launch-digest --features snp
      - name: Cargo.lock unchanged by the snp build
        run: git diff --exit-code -- Cargo.lock
      - name: dm-verity rootfs reproducibility
        run: bash packer/kbs-uki/uki/scripts/test-build-rootfs.sh

  # The miner-agent's net-policy rulesets, loaded into a real kernel. The
  # render tests pin the text (`binaries/miner-agent/tests/data/netpolicy/`);
  # this proves the kernel accepts that text, and that a second load over
  # the existing tables works (the agent reloads on drift and at start).
  # Each file runs in its own network namespace, never on the runner's.
  netpolicy-nft:
    runs-on: ${{ vars.CI_RUNS_ON_DEFAULT || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - name: Install nft
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nftables
          nft --version
      - name: Load each golden ruleset twice in a scratch netns
        run: |
          set -eu
          for f in binaries/miner-agent/tests/data/netpolicy/*.nft; do
            echo "== $f"
            sudo unshare --net sh -euc '
              nft -f "$1"
              nft -f "$1"
              nft -s -t list table inet hippius_guest
              nft -s -t list table bridge hippius_guest_br
            ' sh "$f"
          done

  sentinel:
    runs-on: ${{ vars.CI_RUNS_ON_DEFAULT || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install sentinel + dev deps
        working-directory: sentinel
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        working-directory: sentinel
        run: ruff check sentinel tests conftest.py
      - name: Pytest
        working-directory: sentinel
        run: pytest -v

  # The vali control-plane (Django) test gate. Until now vali had NO CI
  # test job — only `vali-image` (which just builds) — so regressions in
  # the §6/§23/§24/§25 launch + lifecycle logic shipped unguarded. This
  # runs the full pytest suite against `settings_test` (sqlite in-memory,
  # set via pyproject `[tool.pytest.ini_options]`). The validator-binary
  # integration tests skip gracefully when `target/release` is absent —
  # they do NOT need a Cargo build here (the `rust` job covers the binary).
  vali:
    runs-on: ${{ vars.CI_RUNS_ON_HEAVY || 'ubuntu-latest' }}
    # The §22 pin lock is a Postgres advisory lock; SQLite runs a stand-in.
    # The lock tests re-run against this service (`settings_test_pg`).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # The chart-render tests run `helm`; only ubuntu-latest preinstalls it.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0
      # vali shells out to two Rust binaries (`hippius-ticket-validator`:
      # ticket / heartbeat / stopped-ack / live-attestation verification;
      # `hippius-kbs-allowlist-tool`: allowlist pinning). Without them the
      # real-binary tests skip themselves and only the stubbed-subprocess
      # tests run — so a Rust/Python wire drift went unnoticed here. Build
      # both (debug: faster to compile, and the tests look in
      # `target/debug`), cached separately from the `rust` job.
      - name: Install system deps (Rust build)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev
      - name: Install Rust toolchain (rust-toolchain.toml-pinned)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable-branch pin
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "ci-vali-bins"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the binaries vali shells out to
        run: cargo build -p hippius-ticket-validator -p hippius-kbs-allowlist-tool -p hippius-order-ticket-mint
      - name: Install vali + dev deps
        working-directory: vali
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        working-directory: vali
        run: ruff check .
      - name: Pytest
        working-directory: vali
        env:
          VALI_TICKET_VALIDATOR_BIN: ${{ github.workspace }}/target/debug/hippius-ticket-validator
          # The real mint: customer-keys tests read the signed `key_mode`
          # back out of a real ticket (skipped when the binary is absent).
          VALI_ORDER_TICKET_MINT_BIN: ${{ github.workspace }}/target/debug/hippius-order-ticket-mint
        # `-rs` lists every skip, so a binary that stops being found shows
        # up in the log instead of silently shrinking the run.
        run: pytest -q -rs
      - name: Pytest (pin lock on Postgres)
        working-directory: vali
        env:
          VALI_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/vali
        run: >-
          pytest -q -rs --ds=vali.settings_test_pg
          apps/orchestration/tests/test_allowlist_pin_concurrency.py
          apps/orchestration/tests/test_allowlist_pin_busy.py
          apps/orchestration/tests/test_allowlist_pin.py
          apps/telemetry/tests/test_host_attestor_release.py
          apps/images/tests/test_rebake_queue_lock.py

  audit:
    # RA-M-NEW-1 — dependency-vulnerability gate. `cargo audit` fails the
    # build on any RustSec advisory NOT allow-listed in `.cargo/audit.toml`
    # (only VULNERABILITIES block; unmaintained/yanked are non-fatal
    # warnings). A new CVE anywhere in the dependency graph blocks merges.
    runs-on: ${{ vars.CI_RUNS_ON_BUILD || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev
      - name: Install Rust toolchain (rust-toolchain.toml-pinned)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable-branch pin
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "ci-audit"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version "^0.22"
      - name: cargo audit (RustSec advisory gate)
        # Reads .cargo/audit.toml for the documented `ignore` allow-list.
        run: cargo audit
