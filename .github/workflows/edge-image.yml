# `.github/workflows/edge-image.yml` — PR-K8, §K (#54).
#
# Builds the `hippius-edge-gateway` container image and pushes it to
# the GitHub Container Registry. The Edge runs as a non-confidential
# runc pod on the k3s cluster (deploy/gitops/apps/edge-gateway/); the
# chart pins the image by SHA-256 digest, so this workflow's job is
# simply to produce that digest reproducibly.
#
# Trigger:
#   - push to `main` / `v*` tags touching the build inputs — keeps the
#     `latest` / tag images current;
#   - pull_request touching the build inputs — builds only (validates the
#     Dockerfile); nothing is pushed or signed (see `PUBLISH` below);
#   - `workflow_dispatch` — manual rebuilds (publish only when run on main).
#
# Supply-chain discipline (§F): every GitHub Action is pinned by commit
# SHA; the image's own base layers are digest-pinned in the Dockerfile;
# the pushed image is cosign-signed keyless (GitHub OIDC → Sigstore),
# the same posture as `sbom.yml`.

name: edge-image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # DERIVED, not hand-listed: the in-tree crates
    # `cargo build -p hippius-edge-gateway` transitively compiles, per
    # `cargo metadata`. `scripts/dev/image-build-inputs-test.sh` recomputes the
    # closure in CI and fails if this list stops covering it.
    # `hippius-onchain-registry/**` — the chain-read path the gateway resolves
    # tenants through — was missing: a change confined to it merged green and
    # the Edge kept running the old code.
    paths:
      - "binaries/edge-gateway/**"
      - "hippius-onchain-registry/**"
      - "hippius-types/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/edge-image.yml"
  pull_request:
    # Same derived set as `push` (the check asserts the two lists match).
    paths:
      - "binaries/edge-gateway/**"
      - "hippius-onchain-registry/**"
      - "hippius-types/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/edge-image.yml"
  workflow_dispatch:

# Minimal: read the repo, write packages (push to GHCR), and an OIDC
# token for cosign keyless signing. Nothing else.
permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/thenervelab/hippius-edge-gateway
  # Publish = push to GHCR + cosign-sign. ONLY a build of reviewed code may
  # publish: a push to main, a `v*` tag, or a workflow_dispatch run ON main.
  # A pull_request (or a dispatch from any other branch) builds and discards:
  # a pushed + keyless-signed image of unreviewed code would carry the same
  # workflow identity as a main build (hippius-audits#12).
  # verify-gitops-signatures.yml only accepts `@refs/heads/main` /
  # `@refs/tags/v*` identities, so nothing else could be deployed anyway.
  PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

jobs:
  edge-image:
    runs-on: ${{ vars.CI_RUNS_ON_BUILD || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          # The BuildKit image from mirror.gcr.io, pinned (Docker Hub's anonymous
          # pull limit 429s shared runners; same digest as Hub's buildx-stable-1).
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign (version pinned)
        if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.0.6"

      - name: Image tags
        # `sha-<short>` is always produced — a stable, unambiguous tag.
        # `latest` only on the default branch; the git tag on `v*`.
        id: tags
        run: |
          set -euo pipefail
          tags="${IMAGE}:sha-${GITHUB_SHA::12}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tags="${tags},${IMAGE}:latest"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tags="${tags},${IMAGE}:${GITHUB_REF_NAME}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          # Context is the repo root — the crate is a workspace member.
          context: .
          file: binaries/edge-gateway/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          # Single-arch image, no provenance manifest — keeps the
          # pushed digest a plain image digest the Helm chart can pin
          # directly as `@sha256:...`.
          provenance: false

      - name: Sign the image (cosign keyless)
        if: env.PUBLISH == 'true'
        # Keyless: the ambient GitHub OIDC token (`id-token: write`) →
        # a short-lived Fulcio cert → a Rekor transparency-log entry.
        # Signs the immutable digest, never a tag.
        # Gated on PUBLISH (see `env:`): only main / tag builds are signed.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Report the pushed digest
        if: env.PUBLISH == 'true'
        # The chart pins `image@sha256:<digest>`; surface it here so the
        # value is one click away from the run.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "### edge-gateway image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
