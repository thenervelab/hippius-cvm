# `.github/workflows/sbom.yml` — PR-F6 feature 2.
#
# Generates a CycloneDX SBOM for each security-critical (§E/§F TCB)
# Rust binary, cosign-signs each SBOM keyless (GitHub OIDC → Sigstore
# Fulcio cert → Rekor transparency log — no key material to manage),
# uploads them as a workflow artifact, and on a `v*` tag also attaches
# them to the GitHub Release.
#
# Verification of a downstream-consumed SBOM: see `docs/sbom.md`.
#
# Supply-chain discipline (§F): every GitHub Action is pinned by commit
# SHA; `cargo-cyclonedx` + `cosign` are pinned by version.

name: sbom

on:
  push:
    branches: [main]
    tags: ["v*"]

# Top-level default is the most restrictive; each job widens only what
# it needs (see the per-job `permissions:` below).
permissions:
  contents: read

jobs:
  # ── Generate + keyless-sign the SBOMs ──────────────────────────────
  sbom:
    # mon-runner-k8s has had no registered runners since ~2026-08.
    runs-on: ${{ vars.CI_RUNS_ON_BUILD || 'ubuntu-latest' }}
    permissions:
      contents: read # cargo-cyclonedx only reads the repo
      id-token: write # OIDC token for cosign keyless signing — nothing else
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The Hippius runners ship neither rustup nor a C linker; dtolnay
      # installs the toolchain pinned by `rust-toolchain.toml`.
      - name: Install build-essential (cc links cargo-cyclonedx)
        run: command -v cc >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q build-essential; }
      - name: Install Rust toolchain (rust-toolchain.toml-pinned)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable-branch pin
      - name: Rust toolchain show
        run: rustup show

      - name: Install cargo-cyclonedx (version pinned)
        # Pinned to an exact crates.io version. crates.io is
        # immutable-by-version (a published version's bytes can never be
        # replaced), so `--version 0.5.9` is itself the integrity pin;
        # `--locked` additionally pins cargo-cyclonedx's own dependency
        # tree to its published Cargo.lock.
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Install cosign (version pinned)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.0.6"

      - name: Generate per-crate CycloneDX SBOMs
        # `cargo-cyclonedx` resolves the dependency graph via
        # `cargo metadata` (no compilation) and writes
        # `<crate>.cdx.json` next to each member's Cargo.toml.
        run: cargo cyclonedx --format json

      - name: Collect + cosign-sign the security-critical binary SBOMs
        run: |
          set -euo pipefail
          mkdir -p sbom

          # Sign one SBOM keyless: the ambient GitHub OIDC token
          # (`id-token: write`) → a short-lived Fulcio cert → a Rekor
          # transparency-log entry. The `.cosign.bundle` carries the
          # signature + cert + inclusion proof for offline verification.
          sign_sbom() {
            local name="$1" src="$2"
            if [ ! -f "$src" ]; then
              echo "::error::expected SBOM not generated: $src"
              exit 1
            fi
            cp "$src" "sbom/${name}.cdx.json"
            cosign sign-blob --yes \
              --bundle "sbom/${name}.cdx.json.cosign.bundle" \
              "sbom/${name}.cdx.json"
          }

          # The §E/§F trusted-computing-base binaries. `miner-uki-fetch`
          # (PR-F5) is not merged yet — add a line here when it lands.
          sign_sbom kbs-server               binaries/kbs-server/hippius-kbs-server.cdx.json
          sign_sbom hippius-agent-initramfs  binaries/agent-initramfs/hippius-agent-initramfs.cdx.json
          sign_sbom hippius-uki-measure      binaries/uki-measure/hippius-uki-measure.cdx.json
          sign_sbom hippius-image-provenance binaries/image-provenance/hippius-image-provenance.cdx.json

          ls -l sbom/

      - name: Upload SBOMs + cosign bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom/
          if-no-files-found: error

  # ── Attach the signed SBOMs to the GitHub Release (tags only) ──────
  release-attach:
    # mon-runner-k8s has had no registered runners since ~2026-08.
    runs-on: ${{ vars.CI_RUNS_ON_BUILD || 'ubuntu-latest' }}
    needs: sbom
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write # the ONLY job that writes — to attach release assets
    steps:
      - name: Download the signed SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-cyclonedx
          path: sbom

      - name: Install cosign (version pinned)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.0.6"

      - name: Verify the cosign bundles before publishing
        # Re-verify every SBOM against its bundle before it is attached
        # to the release — so a release asset is provably the one the
        # `sbom` job signed in THIS run, not something swapped in
        # between jobs. The identity is pinned EXACTLY to this tag ref
        # (`GITHUB_REF` = `refs/tags/<tag>` here): a bundle signed on
        # `main` or another tag is rejected. Verification needs no OIDC
        # token (this job has none).
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          identity="https://github.com/${REPO}/.github/workflows/sbom.yml@${GITHUB_REF}"
          # Fail closed + clearly if the artifact arrived empty, rather
          # than letting an unexpanded glob produce a confusing error.
          count=$(find sbom -maxdepth 1 -name '*.cdx.json' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::no SBOMs found to verify — the sbom job's artifact is missing or empty."
            exit 1
          fi
          echo "Verifying ${count} SBOM(s) were signed by: ${identity}"
          for sbom in sbom/*.cdx.json; do
            cosign verify-blob \
              --bundle "${sbom}.cosign.bundle" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$sbom"
          done

      - name: Attach SBOMs to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Create the release if the tag was pushed without one.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes
          fi
          gh release upload "$TAG" sbom/* --clobber
