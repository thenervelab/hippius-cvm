# `.github/workflows/secret-scan.yml` — PR-F6 feature 1.
#
# Runs `gitleaks` over the commit range of every pull request and fails
# the PR if any secret pattern matches. Scans the PR RANGE only (not the
# whole repo) so the cost is bounded and a finding points at the commit
# that introduced it. Ruleset + allowlist: `.gitleaks.toml`.
#
# Supply-chain discipline (§F): the `actions/checkout` action is pinned
# by commit SHA, and the `gitleaks` binary is pinned by version AND
# verified against a recorded SHA-256 before it is trusted to run.
#
# Config trust: the scan always uses the `.gitleaks.toml` from the BASE
# branch, so a PR cannot weaken the ruleset that scans it (see the scan
# step). Two residual properties rest on human review of `.gitleaks.toml`
# diffs, and are best backed by a `CODEOWNERS` entry on that file +
# required-review branch protection:
#   - the PR that first introduces `.gitleaks.toml` is necessarily
#     scanned by its own config (no base copy exists yet);
#   - a later PR that edits `.gitleaks.toml` is scanned by the still-
#     trusted base config, but the edit itself is allowlisted from the
#     scan (its rule regexes would self-flag), so a rule-weakening edit
#     is visible only in the diff.

name: secret-scan

on:
  pull_request:
  # The publishable branches advance by MERGE-FORWARD, not by pull
  # request, so `pull_request` alone never scanned them: at the time this
  # was written `secret-scan` had run on `release/opensource` exactly zero
  # times, on the branch a public repo is cut from. The publishability
  # gate already triggers here for the same reason.
  push:
    branches: ["release/**"]

# Minimal: the job only reads the checked-out repo to scan it.
permissions:
  contents: read

jobs:
  gitleaks:
    # Runs on the Hippius runners via the `CI_RUNS_ON_DEFAULT` repo variable,
    # like every other required check; unsetting the variable puts it back
    # on GitHub-hosted `ubuntu-latest` with no workflow change. History of
    # why a single runner pool must never be the only path: this job
    # was the LONE user of the self-hosted `mon-runner-k8s` scale set, and
    # on 2026-08-10 that runner stopped serving: `gitleaks` sat `queued`
    # indefinitely, `gh api …/actions/runners` reported zero registered
    # runners, and `gh run cancel` did not even take effect. Because
    # `gitleaks` is a REQUIRED check and `main` has `enforce_admins: true`,
    # that single dead runner blocked EVERY merge into the repository with
    # no bypass — not `--admin`, not auto-merge.
    #
    # Nothing about this job wants a self-hosted runner: it needs no
    # cluster access, no docker daemon, no pre-baked Rust toolchain, and
    # `permissions: contents: read` above. It downloads one
    # version-and-SHA-256-pinned binary and scans a commit range. Running
    # it on GitHub's runners removes a single point of failure that could
    # halt all merges, and costs nothing in scan fidelity — same binary,
    # same base-branch config, same range.
    runs-on: ${{ vars.CI_RUNS_ON_DEFAULT || 'ubuntu-latest' }}
    steps:
      - name: Checkout (full history — the PR-range scan needs it; the tree scan does not)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install gitleaks (version + SHA-256 pinned)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan the PR commit range
        # A push has no base/head pair to diff, and on a merge-forward the
        # range would be meaningless anyway. The whole-tree scan below is
        # what covers a push, and it is the stronger of the two.
        if: github.event_name == 'pull_request'
        env:
          # Passed via env (never interpolated directly into the script
          # body) so a crafted ref name cannot inject shell — both are
          # 40-hex SHAs, but the discipline is structural.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Scan with the .gitleaks.toml from the BASE branch, never the
          # PR's own tree: otherwise a PR could weaken the ruleset it is
          # scanned by (drop a rule, broaden the allowlist) in the very
          # commit range under scan. The PR that first introduces
          # .gitleaks.toml has no base copy — fall back to the PR tree's
          # only in that one bootstrap case.
          # The base commit MUST be present (fetch-depth: 0 guarantees
          # it). A missing base object is an unexpected CI fault, NOT a
          # bootstrap case — fail closed rather than silently dropping
          # to the PR-controlled config.
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::error::base commit ${BASE_SHA} is not present — cannot establish a trusted gitleaks config."
            exit 1
          fi
          # `git cat-file -e <commit>:<path>` cleanly distinguishes
          # "path genuinely absent at a valid base commit" (→ bootstrap
          # fallback) from any other failure (→ `set -e` aborts the
          # `git show` below). The PR config is used ONLY when the base
          # commit exists and the file is truly not in it.
          if git cat-file -e "${BASE_SHA}:.gitleaks.toml" 2>/dev/null; then
            config="$(mktemp)"
            git show "${BASE_SHA}:.gitleaks.toml" > "$config"
            echo "Using .gitleaks.toml from the base branch (${BASE_SHA})."
          else
            config=.gitleaks.toml
            echo "Base branch has no .gitleaks.toml — using the PR's (first introduction)."
          fi
          echo "Scanning ${BASE_SHA}..${HEAD_SHA}"
          # gitleaks exits non-zero if any rule matches → the step (and
          # so the PR) fails. `--redact` keeps the matched secret bytes
          # out of the CI log.
          ./gitleaks git . \
            --config "$config" \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --redact \
            --no-banner \
            --verbose

      # The range scan answers "did THIS PR add a secret". Nothing has
      # ever answered "is the tree clean", and those differ: a secret in
      # a commit outside any scanned range — a direct push, a range
      # boundary, a merge that skipped review — stays invisible forever.
      #
      # It also matters for publication specifically. A published repo is
      # a SQUASHED single commit that never passes through a pull request,
      # so the range scan would never have looked at it at all, while the
      # first thing a security-minded outsider does with a confidential-
      # computing project is run gitleaks over the whole checkout.
      #
      # This scan found 14 findings the range scan had never reported. All
      # were vendor-published example values in `sentinel/`'s redaction
      # tests — no credential — and they are now allowlisted BY VALUE in
      # `.gitleaks.toml`. The point is that nobody knew until it was run.
      - name: Scan the WHOLE tree, not just the PR range
        run: |
          set -euo pipefail
          ./gitleaks dir . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --verbose
