name: tenant-bake-e2e

# Nightly end-to-end BAKE test across the full multi-OS matrix. Runs the
# published baker image's `tenant-image-bake.sh` against each supported
# cloud image with a throwaway random KEK and asserts the encrypted
# artifacts (LUKS2 + dm-integrity header, kernel, initrd, measurement).
#
# This is the bake half of the chain only — it needs no SNP hardware, no
# Vault, no S3, no KBS. The attested-launch half is validated live on
# an SNP host (see docs/operator/byo-base-os-bake-runbook.md). The dracut
# module's kernel-module coverage has its own gate (dracut-module.yml);
# this workflow proves the chroot + package install + initramfs build +
# LUKS encrypt actually completes per distro and yields a mountable,
# integrity-protected header.
#
# The `cdn-node` leg bakes the CDN cache node image instead (golden
# dm-verity base, `--profile cdn-node`) and smoke-boots its root under
# systemd-nspawn: systemd comes up, the input firewall and OpenResty are
# active, cdn-agent starts on stub keys (what the KBS release would put
# in /run/hippius), and /__hippius/health answers 200 past nginx's cache
# loader with a stand-in for the agent. The real guest path needs SNP + the KBS, which this
# runner has neither of, so the initramfs is checked for the cdn-node
# pieces but not booted.
#
# Self-maintaining: each leg downloads the (moving) cloud image, computes
# its sha256 at runtime, and feeds that to the bake's mandatory
# `--base-image-sha256` gate. The point is to exercise the bake
# MECHANISM, not to pin production bytes (that pinning lives in the
# operator runbook + the §22 allowlist).
#
# The `latest/` / `current/` URLs below are therefore DELIBERATE and are
# the one legitimate use of a moving pointer: no hash is pinned against
# them (the sha is derived from the bytes just fetched) and the baker is
# handed a local `file://`, so nothing here can contradict a pin. Vali's
# intake refuses moving URLs precisely because a bake row DOES pin one
# (register #48) — do not "fix" these to dated URLs; that would silently
# stop testing against the images tenants actually get.

on:
  workflow_dispatch:
    inputs:
      distros:
        description: "Comma-separated subset to run (blank = all)"
        required: false
        default: ""
  schedule:
    # 03:30 UTC nightly — after the day's merges have published a fresh
    # `:latest` baker image.
    - cron: "30 3 * * *"

permissions:
  contents: read
  packages: read

concurrency:
  group: tenant-bake-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bake:
    # Stays GitHub-hosted: privileged docker with loop/nbd devices and
    # qemu-nbd, not guaranteed on the Hippius runner VMs.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMG: ghcr.io/thenervelab/hippius-tenant-baker:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu
            url: "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"
            family: debian
          - id: debian
            label: debian-12
            url: "https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-amd64.qcow2"
            family: debian
          - id: debian
            label: debian-13
            url: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
            family: debian
          - id: centos
            label: centos-stream-10
            url: "https://cloud.centos.org/centos/10-stream/x86_64/images/CentOS-Stream-GenericCloud-10-latest.x86_64.qcow2"
            family: rhel
          - id: fedora
            label: fedora-43
            url: "https://download.fedoraproject.org/pub/fedora/linux/releases/43/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-43-1.6.x86_64.qcow2"
            family: rhel
          - id: debian
            label: cdn-node
            url: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
            family: debian
            profile: cdn-node
    name: bake ${{ matrix.label || matrix.id }}
    steps:
      - name: Skip if not in requested subset
        id: gate
        env:
          want: ${{ github.event.inputs.distros }}
          me: ${{ matrix.label || matrix.id }}
        run: |
          if [ -n "$want" ] && ! echo ",$want," | grep -q ",$me,"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "skip: $me not in '$want'"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # The cdn-node smoke's in-guest helper (it stands in for the agent).
      - name: Check out the cdn-node smoke helper
        if: steps.gate.outputs.run == 'true' && matrix.profile == 'cdn-node'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: scripts/dev/cdn-node-health-smoke.py
          sparse-checkout-cone-mode: false

      - name: Log in to GHCR
        if: steps.gate.outputs.run == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Reclaim runner disk (the bake's raw+LUKS need ~30 GiB)
        if: steps.gate.outputs.run == 'true'
        run: |
          # `/mnt` is NOT a separate disk on this runner image — it shares
          # `/` (72 GiB total, only ~17 GiB free). The bake's intermediate
          # raw + 10 GiB LUKS output overflow that, so drop the preinstalled
          # SDKs/toolchains we don't use (~25 GiB).
          echo "before:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache /usr/local/share/boost \
                      /usr/share/swift "${AGENT_TOOLSDIRECTORY:-}" 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          echo "after:"; df -h /

      - name: Prepare host (loop + nbd modules, work area)
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo modprobe nbd max_part=8 || true
          sudo modprobe loop || true
          sudo mkdir -p /mnt/e2e/work /mnt/e2e/out /mnt/e2e/tmp
          sudo chmod 777 /mnt/e2e /mnt/e2e/work /mnt/e2e/out /mnt/e2e/tmp

      - name: Download base image + compute sha256
        if: steps.gate.outputs.run == 'true'
        id: img
        run: |
          set -euo pipefail
          dest="/mnt/e2e/work/base.img"
          echo "fetching ${{ matrix.url }}"
          curl -fsSL --retry 5 --retry-delay 5 -o "$dest" "${{ matrix.url }}"
          sha=$(sha256sum "$dest" | awk '{print $1}')
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "base image sha256=$sha ($(du -h "$dest" | cut -f1))"

      - name: Bake (random throwaway KEK, baker:latest)
        if: steps.gate.outputs.run == 'true' && matrix.profile != 'cdn-node'
        run: |
          set -euo pipefail
          docker pull "$IMG"
          # 32-byte throwaway KEK as a FILE (not stdin) — keeps the bake's
          # stdin clean (a piped KEK collides with the chroot heredoc) and
          # the file lives on the mounted big disk, never persisted beyond
          # the run.
          head -c 32 /dev/urandom > /mnt/e2e/work/kek.bin
          # WORK_DIR (the bake's mktemp) follows /tmp → bind /tmp to the
          # big disk so the ~30 GiB intermediate raw doesn't fill `/`.
          docker run --rm --privileged \
            -v /dev:/dev \
            -v /mnt/e2e/work:/work \
            -v /mnt/e2e/out:/out \
            -v /mnt/e2e/tmp:/tmp \
            --entrypoint /usr/local/bin/tenant-image-bake.sh \
            "$IMG" \
            --base-image-url "file:///work/base.img" \
            --base-image-sha256 "${{ steps.img.outputs.sha256 }}" \
            --hippius-release-bin /usr/sbin/hippius-guest-release \
            --hippius-vsock-bin /usr/sbin/hippius-vsock-ticket \
            --distro "${{ matrix.id }}" \
            --kbs-url "vsock://2:19266" \
            --output-dir /out \
            --output-qcow2-gb 10 \
            --kek-source file --kek-file /work/kek.bin \
            > /mnt/e2e/out/bake.json
          shred -u /mnt/e2e/work/kek.bin || rm -f /mnt/e2e/work/kek.bin
          echo "=== bake JSON ==="
          cat /mnt/e2e/out/bake.json

      - name: Assert artifacts + LUKS2/integrity header
        if: steps.gate.outputs.run == 'true' && matrix.profile != 'cdn-node'
        run: |
          set -uo pipefail   # NOT -e: the asserts handle their own failures
          OUT="/mnt/e2e/out"
          fail() { echo "ASSERT FAIL: $1" >&2; exit 1; }

          # 1. bake JSON shape. The bake emits a PRETTY-PRINTED (multi-line)
          #    object on stdout; slice from the first `{` to its closing `}`
          #    so any stray stderr-leak before/after is dropped.
          sed -n '/^{/,/^}/p' "$OUT/bake.json" > "$OUT/bake.obj.json"
          jq -e . "$OUT/bake.obj.json" >/dev/null 2>&1 || fail "bake stdout is not valid JSON"
          jq -e '.luks_version == 2' "$OUT/bake.obj.json" >/dev/null || fail "luks_version != 2"
          for k in qcow2_sha256 kernel_sha256 initrd_sha256 luks_header_sha256; do
            jq -e --arg k "$k" '.[$k] | test("^[0-9a-f]{64}$")' "$OUT/bake.obj.json" >/dev/null \
              || fail "bake.$k not 64-hex"
          done
          qcow2=$(jq -re '.qcow2_path' "$OUT/bake.obj.json")
          echo "bake JSON OK (luks_version=2, all shas 64-hex)"

          # 2. the four artifacts land under /out (host-mapped)
          base=$(basename "$qcow2" .qcow2)
          for ext in qcow2 vmlinuz initrd.img measurement.json; do
            f="$OUT/${base}.${ext}"
            [ -s "$f" ] || fail "missing/empty artifact: ${base}.${ext}"
          done
          echo "artifacts present for ${base}"

          # 3. measurement.json carries the §296 header sha + kernel/initrd shas
          m="$OUT/${base}.measurement.json"
          for k in luks_header_sha256 kernel_sha256 initrd_sha256; do
            jq -e --arg k "$k" '.[$k] | test("^[0-9a-f]{64}$")' "$m" >/dev/null \
              || fail "measurement.$k not 64-hex"
          done
          jq -e '.luks_version == 2' "$m" >/dev/null || fail "measurement luks_version != 2"

          # 4. independently confirm the on-disk qcow2 is a LUKS2 +
          #    dm-integrity container. The runner has no qemu-nbd/cryptsetup,
          #    so run the attach + luksDump INSIDE the baker image (which
          #    ships both) — privileged + /dev for the nbd device.
          dump=$(docker run --rm --privileged -v /dev:/dev -v "$OUT:/out" \
            --entrypoint sh "${{ env.IMG }}" -c '
              qemu-nbd --connect=/dev/nbd0 --read-only -f qcow2 "/out/'"${base}"'.qcow2" || exit 50
              sleep 1
              cryptsetup luksDump /dev/nbd0
              rc=$?
              qemu-nbd --disconnect /dev/nbd0 >/dev/null 2>&1 || true
              exit $rc
            ' 2>&1 || true)
          echo "$dump" | grep -q "Version:.*2" || { echo "$dump" | tail -20; fail "qcow2 is not LUKS2"; }
          echo "$dump" | grep -qiE "integrity:.*hmac" || { echo "$dump" | tail -20; fail "LUKS2 header lacks dm-integrity (hmac)"; }
          echo "LUKS2 + dm-integrity header verified for ${base}"

          echo "E2E BAKE OK: ${{ matrix.label || matrix.id }}"

      - name: Bake cdn-node (golden, baker:latest)
        if: steps.gate.outputs.run == 'true' && matrix.profile == 'cdn-node'
        run: |
          set -euo pipefail
          docker pull "$IMG"
          # Golden takes no KEK. The backend URL is baked into the agent
          # config only; nothing here contacts it.
          docker run --rm --privileged \
            -v /dev:/dev \
            -v /mnt/e2e/work:/work \
            -v /mnt/e2e/out:/out \
            -v /mnt/e2e/tmp:/tmp \
            --entrypoint /usr/local/bin/tenant-image-bake.sh \
            "$IMG" \
            --base-image-url "file:///work/base.img" \
            --base-image-sha256 "${{ steps.img.outputs.sha256 }}" \
            --hippius-release-bin /usr/sbin/hippius-guest-release \
            --hippius-vsock-bin /usr/sbin/hippius-vsock-ticket \
            --distro "${{ matrix.id }}" \
            --kbs-url "vsock://2:19266" \
            --output-dir /out \
            --disk-mode golden_verity_overlay \
            --profile cdn-node \
            --cdn-agent-bin /usr/sbin/hippius-cdn-agent \
            --cdn-openresty-tarball /usr/local/share/hippius/cdn-node/openresty.tar.gz \
            --cdn-config-dir /usr/local/share/hippius/cdn-node/openresty-config \
            --cdn-backend-url "https://cdn-backend.example.invalid"

      - name: Assert cdn-node artifacts + initrd
        if: steps.gate.outputs.run == 'true' && matrix.profile == 'cdn-node'
        run: |
          set -uo pipefail   # NOT -e: the asserts handle their own failures
          OUT="/mnt/e2e/out"
          fail() { echo "ASSERT FAIL: $1" >&2; exit 1; }
          for ext in rootfs.img rootfs.verity vmlinuz initrd.img measurement.json; do
            f="$(find "$OUT" -maxdepth 1 -name "golden-*.${ext}" | head -1)"
            [ -s "$f" ] || fail "missing/empty golden artifact: *.${ext}"
          done
          m="$(find "$OUT" -maxdepth 1 -name 'golden-*.measurement.json' | head -1)"
          jq -e '.disk_mode == "golden_verity_overlay"' "$m" >/dev/null || fail "measurement disk_mode != golden_verity_overlay"
          for k in verity_root_hash rootfs_img_sha256 rootfs_verity_sha256 kernel_sha256 initrd_sha256; do
            jq -e --arg k "$k" '.[$k] | test("^[0-9a-f]{64}$")' "$m" >/dev/null \
              || fail "measurement.$k not 64-hex"
          done
          # The initrd carries the ephemeral-root marker and its chown (the
          # bake refuses otherwise; checked again on the shipped bytes).
          initrd="$(basename "$(find "$OUT" -maxdepth 1 -name 'golden-*.initrd.img' | head -1)")"
          list=$(docker run --rm -v "$OUT:/out:ro" --entrypoint lsinitramfs "$IMG" "/out/${initrd}") \
            || fail "lsinitramfs failed on ${initrd}"
          if ! grep -Ex 'conf/conf\.d/hippius-cdn-ephemeral-upper' <<<"$list" >/dev/null; then
            fail "initrd lacks the cdn-node ephemeral-root marker"
          fi
          # A merged-/usr initrd lists /lib/... under usr/lib/.
          grep -Ex '(usr/)?lib/hippius/chown' <<<"$list" >/dev/null || fail "initrd lacks /lib/hippius/chown"
          echo "cdn-node artifacts + initrd OK"

      - name: Boot + unit-start smoke (systemd-nspawn, stub keys)
        if: steps.gate.outputs.run == 'true' && matrix.profile == 'cdn-node'
        run: |
          set -uo pipefail   # NOT -e: the asserts handle their own failures
          fail() { echo "ASSERT FAIL: $1" >&2; dump; exit 1; }
          M=cdnsmoke
          in_guest() { sudo systemd-run -M "$M" --quiet --wait --pipe "$@"; }
          dump() {
            echo "=== system state: $(sudo systemctl -M "$M" is-system-running 2>&1)"
            sudo systemctl -M "$M" --no-pager --failed 2>&1 || true
            for u in hippius-cdn-firewall hippius-cdn-openresty hippius-cdn-agent; do
              sudo systemctl -M "$M" --no-pager status "$u.service" 2>&1 | head -20 || true
              in_guest /usr/bin/journalctl --no-pager -u "$u.service" 2>&1 | tail -30 || true
            done
            echo "=== nspawn"; tail -40 /mnt/e2e/nspawn.log || true
          }
          sudo apt-get update -qq
          sudo apt-get install -y -qq systemd-container squashfs-tools >/dev/null

          ROOT=/mnt/e2e/root
          img="$(find /mnt/e2e/out -maxdepth 1 -name 'golden-*.rootfs.img' | head -1)"
          sudo unsquashfs -q -d "$ROOT" "$img" || fail "unsquashfs failed"
          [ ! -e "$ROOT/usr/sbin/sshd" ] || fail "the cdn-node root ships sshd"

          # Stubs for what the KBS release leaves in /run/hippius on a real
          # node: the lifecycle key, one fleet key, the node identity. All
          # throwaway.
          STUB=/mnt/e2e/run-hippius
          sudo install -d -m 0700 "$STUB" "$STUB/cdn-fleet"
          head -c 32 /dev/urandom | sudo tee "$STUB/lifecycle.key" >/dev/null
          head -c 32 /dev/urandom | sudo tee "$STUB/cdn-fleet/v1.key" >/dev/null
          printf '{"node_id":"ci-smoke","region":"FR"}\n' | sudo tee "$STUB/cdn-node.json" >/dev/null
          sudo chmod 0400 "$STUB/lifecycle.key" "$STUB/cdn-fleet/v1.key"
          sudo chmod 0600 "$STUB/cdn-node.json"
          # The data volume the initramfs binds on a real node.
          sudo install -d -m 0755 /mnt/e2e/data
          SMOKE=/mnt/e2e/smoke
          sudo install -d -m 0755 "$SMOKE"
          sudo install -m 0644 "$GITHUB_WORKSPACE/scripts/dev/cdn-node-health-smoke.py" "$SMOKE/"

          sudo nohup systemd-nspawn --quiet --boot --private-network --console=passive \
            --machine "$M" -D "$ROOT" \
            --bind=/mnt/e2e/data:/var/lib/hippius-data \
            --bind="$STUB":/run/hippius \
            --bind-ro="$SMOKE":/run/hippius-smoke \
            >/mnt/e2e/nspawn.log 2>&1 &
          nspawn_pid=$!

          state=""
          for _ in $(seq 1 150); do
            sudo kill -0 "$nspawn_pid" 2>/dev/null || fail "systemd-nspawn exited during boot"
            state="$(sudo systemctl -M "$M" is-system-running 2>/dev/null || true)"
            case "$state" in running|degraded) break ;; esac
            sleep 2
          done
          echo "system state after boot: ${state:-<none>}"
          case "$state" in running|degraded) ;; *) fail "the cdn-node root did not finish booting (${state:-no answer})" ;; esac

          for u in hippius-cdn-firewall hippius-cdn-openresty; do
            ok=""
            for _ in $(seq 1 30); do
              [ "$(sudo systemctl -M "$M" is-active "$u.service" 2>/dev/null)" = active ] && { ok=1; break; }
              sleep 2
            done
            [ -n "$ok" ] || fail "$u.service is not active"
            echo "$u.service active"
          done

          # cdn-agent: credentials loaded, keys derived, state dir and
          # counter epoch set up; it then keeps retrying the (unreachable)
          # backend, so the unit stays active.
          ok=""
          for _ in $(seq 1 30); do
            log="$(in_guest /usr/bin/journalctl --no-pager -o cat -u hippius-cdn-agent.service 2>/dev/null)"
            if grep -q 'node key derived, fleet versions \[1\]' <<<"$log" && grep -q 'counter epoch' <<<"$log"; then
              ok=1; break
            fi
            sleep 2
          done
          [ -n "$ok" ] || fail "cdn-agent did not start on the stub keys"
          [ "$(sudo systemctl -M "$M" is-active hippius-cdn-agent.service)" = active ] \
            || fail "hippius-cdn-agent.service is not active"
          echo "hippius-cdn-agent.service active (keys derived, counter epoch open)"

          # Up and staying up: no restart of the three units after a settle,
          # and no failed unit but the one a private network always fails
          # (nothing configures it, so wait-online times out).
          sleep 20
          for u in hippius-cdn-firewall hippius-cdn-openresty hippius-cdn-agent; do
            n="$(sudo systemctl -M "$M" show -p NRestarts --value "$u.service")"
            [ "$n" = 0 ] || fail "$u.service restarted ${n} time(s)"
          done
          failed="$(sudo systemctl -M "$M" --failed --plain --no-legend 2>/dev/null \
            | awk '{print $1}' | grep -vx 'systemd-networkd-wait-online.service' || true)"
          [ -z "$failed" ] || fail "failed units: $(echo "$failed" | tr '\n' ' ')"
          echo "no restarts, no unexpected failed unit"

          # /__hippius/health must answer 200, and still after nginx's cache
          # loader has run (a minute after start; it once deleted a canary
          # kept inside the cache tree). The agent cannot reach a backend
          # here and reports not-ready, so it is stopped and the helper
          # pushes what it would push once the backend has answered.
          sudo systemctl -M "$M" stop hippius-cdn-agent.service
          in_guest /usr/bin/python3 -I /run/hippius-smoke/cdn-node-health-smoke.py 75 240 \
            || fail "/__hippius/health never answered 200"

          dump
          sudo machinectl poweroff "$M" || true
          echo "E2E CDN-NODE SMOKE OK"
