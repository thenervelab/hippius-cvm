# `.github/workflows/broker-image.yml` — #102 PR C.
#
# Builds the `hippius-kbs-vault-broker` container image (the
# SNP-attestation-bound Vault broker, §8 / #102) and pushes it to the
# GitHub Container Registry. The broker runs as a `kata-qemu-snp`
# confidential pod on the k3s cluster
# (deploy/gitops/apps/kbs-vault-broker/); the chart pins the image by
# SHA-256 digest, so this workflow's job is to produce that digest
# reproducibly.
#
# Trigger:
#   - push to `main` / `v*` tags touching the build inputs;
#   - pull_request touching the build inputs — builds + pushes a
#     `sha-<commit>` image so the chart can be pinned to a real digest
#     and live-tested before merge (and validates the Dockerfile);
#   - `workflow_dispatch` — manual rebuilds.
#
# Supply-chain discipline (§F): every GitHub Action is pinned by commit
# SHA; the image's base layers are digest-pinned in the Dockerfile; the
# pushed image is cosign-signed keyless (GitHub OIDC → Sigstore).

name: broker-image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # DERIVED, not hand-listed: the in-tree crates
    # `cargo build -p hippius-kbs-vault-broker` transitively compiles, per
    # `cargo metadata`. `scripts/dev/image-build-inputs-test.sh` recomputes the
    # closure in CI and fails if this list stops covering it. `vendor/sev/**`
    # is the `[patch.crates-io]` in-tree copy the broker's SNP verification
    # links — it was missing, so an EPYC-generation patch shipped no image.
    paths:
      - "binaries/kbs-vault-broker/**"
      - "kbs-core/**"
      - "hippius-types/**"
      - "vendor/sev/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/broker-image.yml"
  pull_request:
    # Same derived set as `push` (the check asserts the two lists match).
    paths:
      - "binaries/kbs-vault-broker/**"
      - "kbs-core/**"
      - "hippius-types/**"
      - "vendor/sev/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/broker-image.yml"
  workflow_dispatch:

# Minimal: read the repo, write packages (push to GHCR), and an OIDC
# token for cosign keyless signing. Nothing else.
permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/thenervelab/hippius-kbs-vault-broker

jobs:
  broker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign (version pinned)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.0.6"

      - name: Image tags
        # `sha-<short>` is always produced — a stable, unambiguous tag.
        # `latest` only on the default branch; the git tag on `v*`.
        id: tags
        run: |
          set -euo pipefail
          tags="${IMAGE}:sha-${GITHUB_SHA::12}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tags="${tags},${IMAGE}:latest"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tags="${tags},${IMAGE}:${GITHUB_REF_NAME}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          # Context is the repo root — the crate is a workspace member.
          context: .
          file: binaries/kbs-vault-broker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Single-arch image, no provenance manifest — keeps the pushed
          # digest a plain image digest the Helm chart can pin directly
          # as `@sha256:...`.
          provenance: false

      - name: Sign the image (cosign keyless)
        # Keyless: the ambient GitHub OIDC token (`id-token: write`) → a
        # short-lived Fulcio cert → a Rekor transparency-log entry.
        # Signs the immutable digest, never a tag.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Report the pushed digest
        # The chart pins `image@sha256:<digest>`; surface it here so the
        # value is one click away from the run.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "### kbs-vault-broker image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
