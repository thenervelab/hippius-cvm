# `.github/workflows/verify-gitops-signatures.yml` — M-cosign-admission
# (deploy-time-verify slice).
#
# Every first-party image is cosign-signed keyless at build (each
# `*-image.yml` runs `cosign sign`), but nothing VERIFIED those signatures
# on the deploy path — so an unsigned or tampered digest edited into a
# gitops `values.yaml` would ArgoCD-sync unchecked (audit "M-cosign-
# admission", governance gap). This gate closes that at the gitops
# boundary: on every change under `deploy/gitops/`, it extracts each
# `ghcr.io/thenervelab/hippius-*` digest the charts reference and
# `cosign verify`s that it was keyless-signed by a `*-image.yml` workflow
# in THIS repo (GitHub OIDC → Sigstore). A digest that isn't so signed
# fails the gate.
#
# This is the CI half; the cluster-admission half (a policy-controller
# ClusterImagePolicy, which also covers a manual `kubectl set image`)
# remains the escalated infra follow-up.

name: verify-gitops-signatures

# Runs on EVERY pull_request (no path filter) so it is a stable, always-
# present status check that branch protection can mark REQUIRED — a
# gitops digest edit then cannot merge unless every referenced image is
# cosign-verified. It is cheap (~20s: verify N signatures, no build).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read the repo + read packages (cosign fetches the signature manifest
# from GHCR, and some first-party images are private). An OIDC token is
# NOT needed — verification checks the Fulcio cert against a fixed
# identity, it does not sign.
permissions:
  contents: read
  packages: read

env:
  # The signer identity: any `*-image.yml` workflow in this repo, signing
  # via the GitHub Actions OIDC issuer. Ref-agnostic (main / tag / PR
  # builds all qualify) — the guarantee is "built + signed by this repo's
  # CI", not which branch.
  #
  # BOTH repo names are accepted because this repo was renamed
  # `hippius-compute` → `hippius-compute-internal`. A Fulcio certificate
  # records the repo name AT BUILD TIME and is immutable, so the pinned
  # images split into two eras: everything built before the rename is signed
  # under the old name, everything after under the new one. An anchor naming
  # only one era rejects the other — narrowing to `-internal` alone would
  # fail all six previously-pinned images at once. The alternation is the
  # only form that verifies both eras without rebuilding history.
  #
  # ⚠️ Safe ONLY while both names stay ours. The old name is a GitHub
  # redirect today, and a redirected name becomes claimable once nothing
  # occupies it — so a repo we do NOT control taking
  # `thenervelab/hippius-compute` could mint certificates satisfying this
  # anchor. Never give that name to a public or externally-contributed repo
  # (the open-source repo is `hippius-cvm` precisely so this stays true).
  #
  # Cleanup, once every pinned image has been rebuilt post-rename: drop the
  # alternation and anchor on `-internal` alone.
  IDENTITY_RE: '^https://github\.com/thenervelab/hippius-compute(-internal)?/\.github/workflows/[a-z0-9-]+-image\.yml@'
  OIDC_ISSUER: "https://token.actions.githubusercontent.com"

jobs:
  verify:
    # Stable status-check context name for branch-protection required checks.
    name: verify-gitops-signatures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install cosign (version pinned)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.0.6"

      - name: Log in to GHCR (private image signatures)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify cosign signatures on every gitops-referenced first-party image
        run: |
          set -euo pipefail
          mapfile -t REFS < <(python3 .github/scripts/gitops_image_refs.py deploy/gitops)
          if [ "${#REFS[@]}" -eq 0 ]; then
            echo "::error::no ghcr.io/thenervelab/hippius-* image digests found under deploy/gitops — the extractor or the manifests changed shape"
            exit 1
          fi
          echo "Verifying ${#REFS[@]} first-party image signature(s):"
          printf '  %s\n' "${REFS[@]}"
          fail=0
          for ref in "${REFS[@]}"; do
            echo "::group::cosign verify ${ref}"
            if cosign verify \
                 --certificate-identity-regexp "${IDENTITY_RE}" \
                 --certificate-oidc-issuer "${OIDC_ISSUER}" \
                 "${ref}" > /dev/null; then
              echo "OK  ${ref}"
            else
              echo "::error::UNVERIFIED — ${ref} is not keyless-signed by a thenervelab/hippius-compute *-image.yml workflow"
              fail=1
            fi
            echo "::endgroup::"
          done
          if [ "${fail}" -ne 0 ]; then
            echo "::error::one or more gitops-referenced first-party images failed cosign signature verification"
            exit 1
          fi
          echo "All ${#REFS[@]} first-party image signatures verified."

      # ── P3: trust-critical images must match a DECLARED provenance ──────
      # The gate above is deliberately ref-agnostic ("built + signed by this
      # repo's CI, not which branch"). That is too weak for anything whose
      # substitution matters, and the proof is in this repo's own history:
      # the KBS ran a `refs/pull/897/merge` build for weeks — a tree not
      # reachable from any commit here — and the check above passed it clean
      # every time.
      #
      # This step tightens it to the EXACT declared build: `--certificate-
      # identity` (not -regexp, so the git ref is pinned too) and
      # `--certificate-github-workflow-sha` (so the source commit is pinned).
      # Both were confirmed load-bearing against the live signatures — drop
      # either and a different build verifies clean.
      #
      # It covers EVERY first-party image the gitops charts pin, not just the
      # two at the confidentiality boundary it started with: vali, the Edge,
      # the tenant-baker and the epoch-closer were each guarded only by the
      # ref-agnostic check above, i.e. by the one control with a documented
      # blind spot for the failure mode we already hit. See
      # `TRUST_CRITICAL_IMAGES` in the script.
      #
      # It does NOT prove the running pod pulled that digest, and it does not
      # bind the image into any attestation. See
      # `deploy/gitops/apps/kbs/README.md` § "What the KBS measurement does
      # not cover".
      # P10 — every image the ADDON charts render must be digest-pinned.
      # Renders rather than greps: only three addons override any image, so a
      # grep sees 1 unpinned reference while a render sees 14. The worst was
      # `kata-deploy:3.31.0` + `imagePullPolicy: Always` — the node-level
      # installer for the Kata shim, QEMU, OVMF and the guest kernel — which
      # was invisible to grep precisely because we never overrode it.
      # Needs network for the upstream chart dependencies, which is why it
      # lives here beside the other network-dependent verifications.
      - name: Every image addons/ renders is digest-pinned (P10)
        run: |
          shellcheck -S error scripts/dev/addons-digest-pin-test.sh
          bash scripts/dev/addons-digest-pin-test.sh
      - name: Verify trust-critical images match their declared provenance (P3)
        run: python3 .github/scripts/verify_image_provenance.py --cosign "$(command -v cosign)"
