# `.github/workflows/miner-agent-release.yml` — the hippius-miner-agent
# binary release that miners auto-update from.
#
# On a `v*` tag pushed to the PUBLIC repository (thenervelab/hippius-cvm):
#
#   build    builds the agent with the tag compiled in
#            (scripts/release/build-miner-agent.sh), smoke-tests it
#   rebuild  builds it again in another checkout directory and fails
#            unless the bytes are identical
#   sbom     the signed CycloneDX SBOMs (sbom.yml, called here)
#   publish  attests build provenance for the binary (Sigstore, keyless),
#            re-verifies that attestation exactly as a miner will, checks
#            the SBOM signatures, and publishes the GitHub Release: the
#            binary, SHA256SUMS, BUILD-INFO.txt, <binary>.sigstore.json and
#            the SBOMs with their cosign bundles
#
# This workflow is the ONLY creator of a release, and it publishes in one
# move: a draft first, every asset uploaded to it, then `--draft=false` as
# the last step. Releases are immutable on hippius-cvm: once published a
# release takes no more assets, so a release published early (v2026.10.08,
# created empty by sbom.yml on the same tag) is empty for good.
# scripts/dev/release-creator-test.sh fails if another workflow writes a
# release.
#
# Miners (deploy/ansible/playbooks/miner-tasks/files/hippius-miner-update.sh)
# accept a release only if cosign verifies that attestation for the identity
#   https://github.com/thenervelab/hippius-cvm/.github/workflows/miner-agent-release.yml@refs/tags/<tag>
# so this file's PATH and the repository NAME are part of the trust anchor:
# renaming either strands every auto-updating miner.
#
# The internal repository carries this file unchanged; the `if:` keeps it
# from ever publishing there.
#
# Supply-chain discipline (§F): every action pinned by commit SHA; only the
# publish job can write. The publish job (attestation) and the sbom job
# (SBOM signatures) get an OIDC token.

name: miner-agent-release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: miner-agent-release-${{ github.ref }}
  cancel-in-progress: false

env:
  ASSET: hippius-miner-agent-x86_64-linux-gnu

jobs:
  build:
    if: github.repository == 'thenervelab/hippius-cvm'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.sum.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends pkg-config libssl-dev
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal

      - name: Build + smoke
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/release/build-miner-agent.sh "$TAG" dist

      - name: Record the digest
        id: sum
        run: echo "sha256=$(cut -d' ' -f1 dist/SHA256SUMS)" >>"$GITHUB_OUTPUT"

      - name: Upload the release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: miner-agent-release
          path: dist/
          if-no-files-found: error

  rebuild:
    # Same tag, different checkout path: the remapped paths must keep the
    # directory out of the binary, or the release is not reproducible.
    if: github.repository == 'thenervelab/hippius-cvm'
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
    steps:
      - name: Checkout (another directory)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          path: rebuild-src

      - name: Build prerequisites
        working-directory: rebuild-src
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends pkg-config libssl-dev
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal

      - name: Rebuild + compare
        working-directory: rebuild-src
        env:
          TAG: ${{ github.ref_name }}
          WANT: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          bash scripts/release/build-miner-agent.sh "$TAG" ../redist
          got="$(cut -d' ' -f1 ../redist/SHA256SUMS)"
          echo "build:   $WANT"
          echo "rebuild: $got"
          if [ "$got" != "$WANT" ]; then
            echo "::error::the rebuild differs from the build ($got != $WANT); not reproducible, refusing to publish"
            exit 1
          fi

  sbom:
    if: github.repository == 'thenervelab/hippius-cvm'
    uses: ./.github/workflows/sbom.yml
    permissions:
      contents: read
      id-token: write # keyless cosign signing of the SBOMs

  publish:
    if: github.repository == 'thenervelab/hippius-cvm'
    runs-on: ubuntu-24.04
    needs: [build, rebuild, sbom]
    permissions:
      contents: write # create the release
      id-token: write # Sigstore keyless signing of the attestation
      attestations: write # store the attestation on the repository
    steps:
      - name: Download the release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: miner-agent-release
          path: dist

      - name: Download the signed SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-cyclonedx
          path: sbom

      - name: Check the files are the ones the rebuild matched
        env:
          WANT: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          got="$(sha256sum "dist/$ASSET" | cut -d' ' -f1)"
          [ "$got" = "$WANT" ] || { echo "::error::artifact digest $got != built $WANT"; exit 1; }
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ env.ASSET }}

      - name: Ship the attestation bundle with the release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/$ASSET.sigstore.json"

      - name: Install cosign (the version miners pin)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Verify the attestation exactly as a miner will
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cosign verify-blob-attestation \
            --bundle "dist/$ASSET.sigstore.json" \
            --type https://slsa.dev/provenance/v1 \
            --certificate-identity "https://github.com/thenervelab/hippius-cvm/.github/workflows/miner-agent-release.yml@refs/tags/$TAG" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository thenervelab/hippius-cvm \
            --certificate-github-workflow-ref "refs/tags/$TAG" \
            --certificate-github-workflow-trigger push \
            "dist/$ASSET"

      - name: Verify the SBOM signatures
        # Signed by the sbom job of THIS run: a reusable workflow's
        # certificate names the called file at the caller's ref.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          count=$(find sbom -maxdepth 1 -name '*.cdx.json' | wc -l)
          [ "$count" -gt 0 ] || { echo "::error::no SBOMs in the sbom job's artifact"; exit 1; }
          for f in sbom/*.cdx.json; do
            [ -f "$f.cosign.bundle" ] || { echo "::error::$f has no cosign bundle"; exit 1; }
            cosign verify-blob \
              --bundle "$f.cosign.bundle" \
              --certificate-identity "https://github.com/thenervelab/hippius-cvm/.github/workflows/sbom.yml@refs/tags/$TAG" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$f"
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cat >notes.md <<EOF
          hippius-miner-agent \`$TAG\`, built from this tag by the miner-agent-release workflow (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}), twice, with identical bytes.

          - \`$ASSET\`: the binary (\`--features snp\`, \`--version\` prints \`$TAG\`)
          - \`SHA256SUMS\`, \`BUILD-INFO.txt\`: digest, toolchain and the exact build command
          - \`$ASSET.sigstore.json\`: GitHub build-provenance attestation of the binary
          - \`*.cdx.json\` + \`*.cdx.json.cosign.bundle\`: CycloneDX SBOMs of the trusted-computing-base binaries, cosign-signed by this run (docs/sbom.md)

          Miners with auto-update on install it once the release is 24 hours old. To verify by hand, see BUILD-INFO.txt or docs/operator/onboarding-a-miner.md ("Auto-update").
          EOF
          # A release that already exists was not made by this run's
          # draft: published means immutable (never replaced, never added
          # to); a draft is a run that died before publishing, and drafts
          # are never served, so it is rebuilt from scratch.
          if gh release view "$TAG" --json isDraft -q .isDraft >state 2>/dev/null; then
            if [ "$(cat state)" != "true" ]; then
              echo "::error::release $TAG is already published; it is immutable, refusing to touch it"
              exit 1
            fi
            echo "::warning::deleting the unpublished draft of $TAG left by an earlier attempt"
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file notes.md dist/* sbom/*

          # Publish only a draft that carries every file.
          want="$(cd dist && ls; cd ../sbom && ls)"
          have="$(gh release view "$TAG" --json assets -q '.assets[].name')"
          missing="$(comm -23 <(sort <<<"$want") <(sort <<<"$have"))"
          if [ -n "$missing" ]; then
            echo "::error::the draft of $TAG is missing: $missing"
            exit 1
          fi
          gh release edit "$TAG" --draft=false
