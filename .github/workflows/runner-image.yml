# `.github/workflows/runner-image.yml` — build + push + cosign-sign
# the `hippius-runner-k8s` self-hosted runner image (PR-§K-runner).
#
# This workflow does NOT run on the self-hosted runner it is building.
# It uses `ubuntu-latest` so the very first push (and every rebuild)
# is bootstrappable: a broken image cannot lock the operator out of
# producing a fix.
#
# Trigger:
#   - push to `main` touching the runner Dockerfile / the workspace
#     `rust-toolchain.toml` (which determines the baked-in
#     toolchain channel);
#   - pull_request touching the same paths — builds only; nothing is
#     pushed or signed (see `PUBLISH` below);
#   - `workflow_dispatch` — manual rebuilds (e.g. cosign / base
#     digest bump); publishes only when run on main.
#
# Supply-chain discipline (§F): every GitHub Action is pinned by
# commit SHA; the Dockerfile pins its base + cosign by digest /
# sha256; the pushed image is cosign-signed keyless (GitHub OIDC →
# Sigstore Rekor).

name: runner-image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "runner/**"
      - "rust-toolchain.toml"
      - ".github/workflows/runner-image.yml"
  pull_request:
    paths:
      - "runner/**"
      - "rust-toolchain.toml"
      - ".github/workflows/runner-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/thenervelab/hippius-runner-k8s
  # Publish = push to GHCR + cosign-sign. ONLY a build of reviewed code may
  # publish: a push to main, a `v*` tag, or a workflow_dispatch run ON main.
  # A pull_request (or a dispatch from any other branch) builds and discards:
  # a pushed + keyless-signed image of unreviewed code would carry the same
  # workflow identity as a main build (hippius-audits#12).
  # verify-gitops-signatures.yml only accepts `@refs/heads/main` /
  # `@refs/tags/v*` identities, so nothing else could be deployed anyway.
  PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

jobs:
  runner-image:
    # Build the runner image ITSELF never on `mon-runner-k8s`: a broken
    # self-hosted runner image must not block its own rebuild. The Hippius
    # runners (`CI_RUNS_ON_BUILD`) are a separate pool; unset the variable
    # to fall back to GitHub-hosted ubuntu-latest.
    runs-on: ${{ vars.CI_RUNS_ON_BUILD || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign (version pinned)
        if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.0.6"

      - name: Image tags
        id: tags
        run: |
          set -euo pipefail
          tags="${IMAGE}:sha-${GITHUB_SHA::12}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tags="${tags},${IMAGE}:latest"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tags="${tags},${IMAGE}:${GITHUB_REF_NAME}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          # Build context = repo root because the Dockerfile reads
          # `rust-toolchain.toml` from the workspace. The Dockerfile
          # itself is under `runner/`.
          context: .
          file: runner/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          # The runner pod runs on a Linux/amd64 k8s node; no
          # multi-arch needed today.
          provenance: false

      - name: Report the pushed digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "  IMAGE:  ${IMAGE}"
          echo "  DIGEST: ${DIGEST}"

      - name: Sign the image (cosign keyless)
        if: env.PUBLISH == 'true'
        # Keyless: the ambient GitHub OIDC token (`id-token: write`)
        # mints a short-lived Fulcio cert + a Rekor transparency-log
        # entry. Operators verify with the same OIDC issuer + the
        # repo's `certificate-identity-regexp` (see runner/README.md).
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
