---
# NetBird agent — install + join the `miner` mesh group. Tasks file
# imported by 06-miner-bootstrap.yml play "04".
#
# The miner joins the NetBird mesh in the group named by
# `network.netbird_group` (group_vars/miner_nodes.yml). Group
# membership is carried by the SETUP KEY the operator creates in their
# NetBird dashboard bound to that group — the agent inherits it on
# join. The setup key is read from the operator workstation at run
# time and NEVER written to the repo or logged.

# `deb822_repository` imports `python3-debian` on the MANAGED node and
# cannot install it itself — unlike `ansible.builtin.apt`, which
# auto-installs `python3-apt` when it is missing. So the module fails
# with "Failed to import the required Python library (python3-debian)"
# on any image that does not already carry it.
#
# Whether an image carries it is a property of the image, not of Ubuntu:
# measured on 24.04, `ubuntu-minimal` + `ubuntu-standard` do NOT pull it
# in, while the `ubuntu-server` metapackage does. Our own hosts happened
# to be built from an image that had it, which is exactly why this was
# invisible until the playbook was run somewhere else. A third party on a
# minimised cloud image stops here.
- name: Ensure the deb822_repository module's host dependency is present
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true

# The conflicting legacy `netbird.list` is removed in the PREFLIGHT play,
# not here — see `06-miner-bootstrap.yml`. It has to be gone before the
# first apt task of the whole run, and that is play 02, well before this
# file is reached.
- name: Add the NetBird apt repository
  ansible.builtin.deb822_repository:
    name: netbird
    types: [deb]
    uris: "https://pkgs.netbird.io/debian"
    suites: [stable]
    components: [main]
    signed_by: "https://pkgs.netbird.io/debian/public.key"
    enabled: true

- name: Install the NetBird agent (pinned)
  ansible.builtin.apt:
    name: "netbird={{ versions.netbird }}"
    state: present
    update_cache: true
    # The repo only carries `netbird`; keep an exact version pinned
    # rather than letting a future release drift in unreviewed.
    allow_downgrade: true

- name: Enable the NetBird service
  ansible.builtin.systemd:
    name: netbird
    enabled: true
    state: started

- name: Read the operator-local NetBird setup key
  ansible.builtin.set_fact:
    miner_netbird_setup_key: >-
      {{ lookup('file', operator_secret_dir ~ '/' ~ netbird_setup_key_file) | trim }}
  no_log: true

- name: Query the current NetBird connection state
  ansible.builtin.command:
    cmd: netbird status
  register: miner_netbird_status
  changed_when: false
  check_mode: false
  failed_when: false

- name: Join the NetBird mesh (miner group) via the setup key
  # `netbird up` registers this peer. Skipped when the agent is
  # already connected — a second run is then a no-op. `no_log` keeps
  # the setup key out of the Ansible output.
  #
  # `--management-url` is not optional: without it the client dials the
  # PUBLIC api.netbird.io, which rejects our self-hosted setup key and
  # leaves the daemon `LoginFailed`. The value lives under `network.`
  # in group_vars; this task used to test a top-level
  # `netbird_management_url` that nothing defines, so the flag was
  # silently dropped on every run.
  ansible.builtin.command:
    cmd: >-
      netbird up
      --setup-key {{ miner_netbird_setup_key }}
      --management-url {{ network.netbird_management_url }}
  no_log: true
  register: miner_netbird_up
  changed_when: miner_netbird_up.rc == 0
  when: "'Management: Connected' not in miner_netbird_status.stdout"

- name: Report the NetBird peer state (no secrets)
  # Retried: right after `netbird up` the address can take a moment.
  ansible.builtin.command:
    cmd: netbird status
  register: miner_netbird_final
  changed_when: false
  check_mode: false
  failed_when: false
  until: "'NetBird IP:' in miner_netbird_final.stdout"
  retries: 5
  delay: 3

# The miner's own NetBird mesh address — assigned by NetBird at join,
# so it is PER-HOST and only known after the join. The orders HTTP
# server (MA-5) binds it (and ONLY it; the agent rejects any non-mesh
# bind). It must be the address `netbird status` reports AND one the
# mesh interface actually carries: falling back to a configured value
# here once let a failed join pass with the group_vars placeholder.
- name: Read the IPv4 addresses on the NetBird mesh interface
  # `wt0`: NetBird's interface, as in host-firewall.yml.
  ansible.builtin.command:
    cmd: ip -4 -o addr show dev wt0
  register: miner_netbird_iface
  changed_when: false
  check_mode: false
  failed_when: false
  # The client can report its address before it has configured wt0.
  until: >-
    (miner_netbird_final.stdout | regex_findall('(?m)^NetBird IP:\s+([0-9.]+)')
     | first | default('-')) ~ '/' in miner_netbird_iface.stdout
  retries: 5
  delay: 3

- name: Capture this miner's NetBird mesh IP (for orders.bind_addr)
  ansible.builtin.import_tasks: netbird-mesh-ip.yml
  vars:
    miner_netbird_was_connected: "{{ 'Management: Connected' in miner_netbird_status.stdout }}"

- name: Show the NetBird peer state + bind IP
  ansible.builtin.debug:
    msg: "{{ miner_netbird_final.stdout_lines }} | bind_ip={{ miner_netbird_ip | default('(none: --check before the first join)') }}"
