---
# libvirt + QEMU — the tenant-CVM hypervisor stack. Tasks file
# imported by 06-miner-bootstrap.yml play "02".
#
# Distro packages (Ubuntu 26.04: libvirt 12.0 / qemu 10.2 — see
# `versions` in group_vars/miner_nodes.yml). They are NOT apt-version-
# pinned: pinning a distro's own default blocks its security point
# releases. `apt` with `state: present` is idempotent — a second run
# is a zero-diff no-op.

- name: Install the libvirt + QEMU hypervisor packages
  ansible.builtin.apt:
    name:
      - libvirt-daemon-system   # the libvirt daemon + system config
      - libvirt-clients         # virsh
      - qemu-system-x86         # the x86 system emulator
      - qemu-utils              # qemu-img and friends
      - ovmf                    # UEFI firmware — required for CVMs
      - virtinst                # virt-install / domain provisioning
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable + start the libvirt daemon
  ansible.builtin.systemd:
    name: libvirtd
    enabled: true
    state: started

- name: Add the login user to the libvirt group (non-sudo virsh)
  ansible.builtin.user:
    name: "{{ libvirt.access_user }}"
    groups: libvirt
    append: true
  when: libvirt.user_can_access | default(false)

- name: Report the installed hypervisor versions
  ansible.builtin.command:
    cmd: "{{ item }}"
  loop:
    - "virsh --version"
    - "qemu-system-x86_64 --version"
  register: miner_hv_versions
  changed_when: false
  check_mode: false

- name: Show the installed hypervisor versions
  ansible.builtin.debug:
    msg: >-
      {{ miner_hv_versions.results | map(attribute='stdout') | list }}

# Play 00 checked what apt would resolve; this checks what actually runs.
# `virsh --version` prints the libvirt version, QEMU prints
# "QEMU emulator version 10.2.1 (Debian 1:10.2.1+ds-...)".
- name: Assert the installed hypervisor can launch a SEV-SNP guest
  ansible.builtin.assert:
    that:
      - miner_hv_libvirt is version(miner_min_libvirt_version, '>=')
      - miner_hv_qemu is version(miner_min_qemu_version, '>=')
    fail_msg: >-
      Installed libvirt {{ miner_hv_libvirt }} / QEMU {{ miner_hv_qemu }} is
      below the SEV-SNP minimum (libvirt >= {{ miner_min_libvirt_version }},
      QEMU >= {{ miner_min_qemu_version }}).
  vars:
    miner_hv_libvirt: "{{ miner_hv_versions.results[0].stdout | trim }}"
    miner_hv_qemu: "{{ miner_hv_versions.results[1].stdout | regex_search('version ([0-9.]+)', '\\1') | first }}"

# ── virt-aa-helper: the dm-verity hash disk ─────────────────────────
#
# libvirt runs virt-aa-helper at every define to build the per-domain
# AppArmor profile, and the helper opens each disk to probe it. Its stock
# profile allows `/**.img`, `/**.raw`, `/**.qcow2`… but not `*.verity`, so
# every golden define logs 4 `apparmor="DENIED" … rootfs.verity` lines
# (#1247). The domain still starts (the generated QEMU profile lists the
# disk by path) — the denial is noise, but noise that hides a real one.
# The stock profile ends in `include if exists <local/…>`, the supported
# extension point; a package update never overwrites it.
- name: Let virt-aa-helper read the staged dm-verity hash disks
  ansible.builtin.copy:
    dest: /etc/apparmor.d/local/usr.lib.libvirt.virt-aa-helper
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (miner-tasks/libvirt-install.yml). Do not edit by hand.
      /var/lib/hippius-miner/staging/*/rootfs.verity r,
      # Legacy default `rootfs_hash_path` (orders/types.rs) for orders
      # that do not name a per-VM staging path.
      /var/lib/hippius-miner/rootfs.verity r,
  register: miner_aa_helper_local

# Reloads only the helper's own profile — running domains keep theirs.
# Unconditional (it is cheap): gating it on the copy above would leave the
# rule unloaded forever if a reload ever failed after the copy succeeded.
- name: Reload the virt-aa-helper AppArmor profile
  ansible.builtin.command:
    cmd: apparmor_parser -r /etc/apparmor.d/usr.lib.libvirt.virt-aa-helper
  changed_when: miner_aa_helper_local.changed

# ── Tenant OVMF ──────────────────────────────────────────────────────
#
# The `ovmf` package above is for libvirt's own use. Tenant CVMs boot a
# SPECIFIC firmware image whose bytes are folded into the SNP launch
# measurement, and the validator recomputes that measurement from the copy
# it pins. A different build measures differently, the KBS refuses the
# release, and the guest never unlocks — so this is fetched by URL and
# verified by digest, never taken from the distro.
#
# Without it every launch fails preflight with
# `tenant-preflight/ovmf-missing`, which names the file but not the fact
# that nothing was ever supposed to create it.

- name: Ensure the miner state directory exists
  ansible.builtin.file:
    path: "{{ miner_tenant_ovmf_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Stage the tenant OVMF, verified by digest
  ansible.builtin.get_url:
    url: "{{ miner_tenant_ovmf_url }}"
    dest: "{{ miner_tenant_ovmf_path }}"
    checksum: "sha256:{{ miner_tenant_ovmf_sha256 }}"
    owner: root
    group: root
    mode: "0644"
  register: miner_tenant_ovmf

# get_url verifies before installing, so a mismatch never lands. Re-read the
# file that is ACTUALLY on disk: this asserts the end state, not the action.
- name: Re-verify the staged tenant OVMF on disk
  ansible.builtin.stat:
    path: "{{ miner_tenant_ovmf_path }}"
    checksum_algorithm: sha256
  register: miner_tenant_ovmf_stat

- name: Refuse to continue on an OVMF that is not the pinned one
  ansible.builtin.assert:
    that:
      - miner_tenant_ovmf_stat.stat.exists
      - miner_tenant_ovmf_stat.stat.checksum == miner_tenant_ovmf_sha256
    fail_msg: >-
      {{ miner_tenant_ovmf_path }} does not match
      miner_tenant_ovmf_sha256. This firmware is measured into every tenant
      guest's SNP launch digest, so a mismatch means the KBS will refuse to
      release any disk key on this host. Fix the pin or the artefact — do
      not proceed.
    success_msg: "tenant OVMF staged and digest-verified"
