---
# miner-agent install + identity self-gen. Tasks file imported by
# 06-miner-bootstrap.yml play "05".
#
# Installs the `hippius-miner-agent` binary, renders its config,
# self-generates the miner identity on first run (printing the public
# key for the operator to register out-of-band with vali), and writes
# a hardened systemd unit. The unit is ENABLED but NOT STARTED — the
# operator starts it manually once the mTLS cert is in place (play 06
# only creates the mount point; the operator pushes the content).
#
# This task file does NOT touch Vault and does NOT install k3s.

# The agent's on-disk layout is fixed at /var/lib/hippius-miner: storage
# pools other than `default` must sit at /var/lib/hippius-miner/pools/<id>
# (the agent's POOLS_ROOT), and only the state dir is in the unit's
# ReadWritePaths. A moved or symlinked state dir would refuse every pool.
- name: Assert the miner-agent state dir is the agent's fixed layout
  ansible.builtin.assert:
    that:
      - miner_agent.state_dir == "/var/lib/hippius-miner"
    fail_msg: >-
      miner_agent.state_dir must be /var/lib/hippius-miner (the agent's
      storage pools root is /var/lib/hippius-miner/pools); to put it on
      another disk, mount or bind-mount that disk at /var/lib/hippius-miner.

- name: Read the miner-agent state dir
  ansible.builtin.stat:
    path: "{{ miner_agent.state_dir }}"
    follow: false
  register: miner_agent_state_dir_stat

- name: Assert the miner-agent state dir is not a symlink
  ansible.builtin.assert:
    that:
      - not (miner_agent_state_dir_stat.stat.islnk | default(false))
    fail_msg: >-
      {{ miner_agent.state_dir }} is a symlink: every storage pool under it
      would fail the agent's canonical-path check. Bind-mount the target at
      {{ miner_agent.state_dir }} instead.

- name: Ensure the miner-agent state directory exists
  ansible.builtin.file:
    path: "{{ miner_agent.state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure the miner-agent config directory exists
  ansible.builtin.file:
    path: /etc/hippius-miner
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check the installed miner-agent version
  ansible.builtin.command:
    argv:
      - "{{ miner_agent.install_path }}"
      - "--version"
  register: miner_agent_version_check
  failed_when: false
  changed_when: false
  check_mode: false

- name: Set whether the miner-agent binary needs (re)building
  ansible.builtin.set_fact:
    miner_agent_build_needed: >-
      {{ miner_agent_version_check.rc != 0
         or versions.miner_agent not in (miner_agent_version_check.stdout | default('')) }}

# The supported install is the release binary (onboarding-a-miner.md §1
# "Prebuilt binary"); auto-update keeps it current. Building on the host
# is an explicit opt-in: by default a missing or foreign binary stops the
# play here instead of cloning a repository the operator may not be able
# to read, or code nobody pinned, and building it on a confidential host.
- name: Refuse to build the miner-agent from source unless asked to
  ansible.builtin.assert:
    that:
      - not (miner_agent_build_needed | bool) or (miner_agent_build_from_source | bool)
    fail_msg: >-
      [MINER_AGENT_BINARY_MISSING] {{ miner_agent.install_path }} is missing or
      does not report version {{ versions.miner_agent }} (`--version` said:
      {{ miner_agent_version_check.stdout | default('', true) or 'nothing' }}).
      Install the release binary on the host first:
      download hippius-miner-agent-x86_64-linux-gnu and SHA256SUMS from
      https://github.com/{{ miner_auto_update_release_repo }}/releases/latest,
      `sha256sum -c SHA256SUMS`, then
      `sudo install -m 0755 -o root -g root hippius-miner-agent-x86_64-linux-gnu
      {{ miner_agent.install_path }}` (docs/operator/onboarding-a-miner.md,
      "Prebuilt binary"), and re-run. To build from
      `miner_agent_source_repo` on this host instead, set
      `miner_agent_build_from_source: true` in host_vars.

# ── Binary install ──────────────────────────────────────────────────
# Opt-in source build on the host (`miner_agent_build_from_source`); the
# default path is the signed release binary, installed before the play.
# Tracked alongside the §MA phase-2 roadmap.
# Building from source needs a build environment, and the playbook used
# to install only the Rust half of it. Each of these was found by running
# the play on a host that did not already have it, and each stopped the
# build dead:
#
#   git              the `ansible.builtin.git` clone below: "Failed to
#                    find required executable git"
#   build-essential  `error: linker 'cc' not found` — cargo cannot link
#                    even a build script without a C toolchain
#   pkg-config       }  `openssl-sys` build script: the `sev` crate that
#   libssl-dev       }  `--features snp` pulls in links against OpenSSL
#
# None of this is exotic; it was simply already present on the machines
# we provisioned, so the omission never showed. It is the same failure
# mode as the `python3-debian` one in play 04.
- name: Install the source-build prerequisites (TEMPORARY — with the source build)
  ansible.builtin.apt:
    name:
      - git
      - build-essential
      - pkg-config
      - libssl-dev
    state: present
    update_cache: true
  when: miner_agent_build_needed | bool

# A published tree cannot ship a default that only WE can clone, and the
# placeholder must fail loudly rather than produce a confusing git error
# several tasks later. `<...>` is the repository's placeholder convention.
- name: Assert the miner-agent source repository has been configured
  ansible.builtin.assert:
    that:
      - "'<' not in miner_agent_source_repo_resolved"
    fail_msg: >-
      `miner_agent_source_repo` is still the unfilled placeholder
      ({{ miner_agent_source_repo_resolved }}). With
      `miner_agent_build_from_source: true` play 05 builds the miner-agent
      from source, so it needs a git URL it can actually clone. Set
      `miner_agent_source_repo` to the repository you build the agent
      from, or drop `miner_agent_build_from_source` and install the
      release binary at /usr/local/bin/hippius-miner-agent.
  vars:
    miner_agent_source_repo_resolved: "{{ miner_agent_source_repo | default('') }}"
  when: miner_agent_build_needed | bool

- name: Install the Rust toolchain (TEMPORARY — until a binary release)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
        | sh -s -- -y --profile minimal
    executable: /bin/bash
    creates: /root/.cargo/bin/cargo
  when: miner_agent_build_needed | bool

- name: Clone the hippius-compute repo (TEMPORARY — source build)
  ansible.builtin.git:
    # Spelled out, and overridable, because this step CLONES AND BUILDS the
    # binary that runs on a confidential host — it is a code-delivery path,
    # not a documentation link.
    #
    # It used to name the repo as it was called before the rename, and that
    # only kept working because GitHub redirects the old name. A redirect is
    # not a pin: it lives exactly as long as nobody else takes the name, and
    # the moment some other repo claims it this task would silently clone
    # THAT one and build a miner-agent from it.
    # The value lives in `group_vars/miner_nodes.yml`, with NO inline
    # default here on purpose. A default would silently win whenever the
    # group_vars entry is missing or renamed, which is precisely how a
    # published tree would keep pointing at a repository only we can
    # clone. Undefined is a loud failure; a wrong default is a quiet one.
    repo: "{{ miner_agent_source_repo }}"
    dest: /opt/hippius-compute
    # Defaults to `main`; override `miner_agent_source_ref` in host_vars
    # to test an agent-side branch.
    version: "{{ miner_agent_source_ref | default('main') }}"
    depth: 1
    force: true
  when: miner_agent_build_needed | bool

- name: Build the miner-agent binary (TEMPORARY — source build)
  # No `creates:` guard — the `when` already gates this. A `creates:`
  # on the build output would skip rebuilding a STALE binary after a
  # `git` pull bumped the source, so the install step would keep
  # copying the old version forever.
  #
  # `--features snp` is LOAD-BEARING for a production miner: it pulls
  # in the `sev` crate so `compute_launch_digest` can actually
  # compute the SEV-SNP launch digest pre-flight. WITHOUT the flag,
  # any launch order fail-closes at the validate step with
  # `cvm-launch-digest/feature-disabled` (observed live 2026-05-28:
  # a `cargo build` without `--features snp` produced a binary that
  # rejected every order with HTTP 422 `launch-input`). The default
  # feature set is empty by design — it keeps `cargo test
  # --workspace` cross-platform green on macOS dev, where the `sev`
  # crate's OpenSSL + Linux-only headers cannot link. Production
  # always opts in here.
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      source "$HOME/.cargo/env"
      cd /opt/hippius-compute
      cargo build --release --locked -p hippius-miner-agent --features snp
    executable: /bin/bash
  when: miner_agent_build_needed | bool

- name: Install the miner-agent binary
  ansible.builtin.copy:
    src: /opt/hippius-compute/target/release/hippius-miner-agent
    dest: "{{ miner_agent.install_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: miner_agent_build_needed | bool

# ── Host attestor components ────────────────────────────────────────
# Rendered into [host_attestor] from `snp_generation` (derived from the
# CPU by play 00's preflight, or set in host_vars — run play 00 in the
# same invocation when host_vars does not set it). A
# miner without it would render no attestor, never attest, and — with
# vali's host-attestor gate enforced — never receive a VM, so it is
# required. The files are staged by the operator (see
# `miner_host_attestor` in group_vars); a missing or different file is a
# hard stop here, because the agent would otherwise retry the launch
# forever against a digest mismatch and the host would never attest.
- name: Assert snp_generation names a known host-attestor measurement
  ansible.builtin.assert:
    that:
      - snp_generation is defined
      - snp_generation in miner_host_attestor.measurements
    fail_msg: >-
      Set `snp_generation` in host_vars to one of
      {{ miner_host_attestor.measurements.keys() | list }} (the host's AMD
      EPYC generation: 7003=milan, 9004=genoa, 9005=turin); got
      {{ snp_generation | default('(unset)') }}.

- name: Stat the staged host-attestor components
  ansible.builtin.stat:
    path: "{{ miner_host_attestor.dir }}/{{ item.file }}"
    checksum_algorithm: sha256
  loop:
    - { file: ovmf.fd, sha256: "{{ miner_host_attestor.ovmf_sha256 }}" }
    - { file: linux.bin, sha256: "{{ miner_host_attestor.kernel_sha256 }}" }
    - { file: initrd.bin, sha256: "{{ miner_host_attestor.initrd_sha256 }}" }
  loop_control:
    label: "{{ item.file }}"
  register: miner_ha_files
  when: snp_generation is defined

- name: Refuse host-attestor components that are missing or not the pinned ones
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.checksum == item.item.sha256
    fail_msg: >-
      {{ miner_host_attestor.dir }}/{{ item.item.file }} is missing or does
      not match its pinned sha256 ({{ item.item.sha256 }}). Stage the
      host-attestor components before this play.
  loop: "{{ miner_ha_files.results }}"
  loop_control:
    label: "{{ item.item.file }}"
  when: snp_generation is defined

# ── Config ──────────────────────────────────────────────────────────
- name: Assert the CVM budget inputs before deriving the budget
  # Jinja's `int` turns a typo into 0 — which would REMOVE the reserve and
  # raise the budget. Refuse anything that is not a plain integer in range,
  # including a host_vars `host_cvm` that replaced the group policy.
  ansible.builtin.assert:
    that:
      - (host_cvm.cpu_ratio_pct | string) is match('^[0-9]+$')
      - (host_cvm.reserve_cpus | string) is match('^[0-9]+$')
      - (host_cvm.reserve_memory_mb | string) is match('^[0-9]+$')
      - host_cvm.cpu_ratio_pct | int >= 100
      - host_cvm.cpu_ratio_pct | int <= 400
      - host_cvm.reserve_cpus | int >= 2
      - host_cvm.reserve_memory_mb | int >= 8192
      - ansible_processor_vcpus | int > host_cvm.reserve_cpus | int
      - ansible_memtotal_mb | int > host_cvm.reserve_memory_mb | int
      - (host_cvm_overrides | default({})).values() | map('string') | select('match', '^[0-9]+$') | list | length == (host_cvm_overrides | default({})) | length
    fail_msg: >-
      host_cvm must be integers with cpu_ratio_pct 100..400, reserve_cpus >= 2,
      reserve_memory_mb >= 8192 (got {{ host_cvm }}); host_cvm_overrides values
      must be integers (got {{ host_cvm_overrides | default({}) }}).

- name: Find the filesystem that holds the tenant data-disk root
  # The longest `ansible_mounts` mount point that is a path prefix of
  # `miner_data_disk_root` — the root itself is usually a directory, not a
  # mount point. Play 05 has already created it under its real mount.
  ansible.builtin.set_fact:
    miner_data_fs_mount: >-
      {%- set ns = namespace(mount='') -%}
      {%- set root = miner_data_disk_root.rstrip('/') ~ '/' -%}
      {%- for m in ansible_mounts -%}
      {%-   if root.startswith(m.mount.rstrip('/') ~ '/') and m.mount | length > ns.mount | length -%}
      {%-     set ns.mount = m.mount -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ ns.mount }}

- name: Derive the tenant disk budget from the data filesystem size
  ansible.builtin.set_fact:
    miner_data_fs_gb: >-
      {{ (ansible_mounts | selectattr('mount', 'equalto', miner_data_fs_mount)
          | map(attribute='size_total') | first | default(0) | int) // 1073741824 }}

- name: Assert the disk budget inputs
  # Same fail-loud rule as the CPU/RAM inputs: a typo'd reserve must never
  # turn into 0 and hand the whole filesystem to tenants.
  ansible.builtin.assert:
    that:
      - (host_cvm.reserve_disk_gb | string) is match('^[0-9]+$')
      - host_cvm.reserve_disk_gb | int >= 50
      - miner_data_fs_mount | length > 0
      - miner_data_fs_gb | int > host_cvm.reserve_disk_gb | int
    fail_msg: >-
      host_cvm.reserve_disk_gb must be an integer >= 50 (got
      {{ host_cvm.reserve_disk_gb | default('unset') }}), and the filesystem
      holding {{ miner_data_disk_root }} ({{ miner_data_fs_mount | default('not found', true) }},
      {{ miner_data_fs_gb }} GiB) must be larger than it.

- name: Assert the v5 heartbeat is only asked for on top of v4
  # The agent refuses `schema_host_health` without `schema_disk` and
  # would not start; say so here instead.
  ansible.builtin.assert:
    that:
      - not (miner_heartbeat_schema_host_health | default(false) | bool)
        or (miner_heartbeat_schema_disk | default(false) | bool)
    fail_msg: >-
      miner_heartbeat_schema_host_health needs miner_heartbeat_schema_disk:
      the v5 heartbeat is the v4 body plus the host-health fields, and the
      agent refuses the config otherwise.

- name: Assert the v6 heartbeat is only asked for on top of v5
  # The agent refuses `schema_agent_version` without `schema_host_health`
  # and would not start; say so here instead.
  ansible.builtin.assert:
    that:
      - not (miner_heartbeat_schema_agent_version | default(false) | bool)
        or (miner_heartbeat_schema_host_health | default(false) | bool)
    fail_msg: >-
      miner_heartbeat_schema_agent_version needs
      miner_heartbeat_schema_host_health: the v6 heartbeat is the v5 body
      plus the agent release tag, and the agent refuses the config otherwise.

# ── Identity self-gen (first run only) ──────────────────────────────
- name: Check whether the miner identity already exists
  ansible.builtin.stat:
    path: "{{ miner_agent.state_dir }}/identity.key"
  register: miner_identity_check

- name: Self-generate the miner identity + print the public key
  # Run UNCONDITIONALLY — `init-identity` is itself idempotent (it
  # refuses to overwrite an existing key) and `--print-pubkey` re-emits
  # the existing public key on a no-op run. Running it every time means
  # the operator can re-capture the pubkey from any playbook run, not
  # only the first. `changed_when` keys on the binary's stderr so a
  # no-op re-run still reports changed=0.
  ansible.builtin.command:
    argv:
      - "{{ miner_agent.install_path }}"
      - "init-identity"
      - "--key-output"
      - "{{ miner_agent.state_dir }}/identity.key"
      - "--pub-output"
      - "{{ miner_agent.state_dir }}/identity.pub"
      - "--print-pubkey"
  register: miner_identity_init
  changed_when: "'already present' not in miner_identity_init.stderr"

# ── miner_id ────────────────────────────────────────────────────────
# vali's `miner_id` is a global namespace, so a NEW miner does not pick
# one: it is `m-` + the first 16 hex chars of its node id (the
# `node_id_to_miner_id` filter, filter_plugins/miner_id.py), the same
# value the backend declares to vali. A host already registered under
# another id pins it with the `miner_id` host var, which always wins —
# changing a registered miner's id orphans its identity, telemetry and
# placements. Hence the config is rendered only AFTER init-identity.
- name: Read the miner identity public key (the node id)
  ansible.builtin.slurp:
    src: "{{ miner_agent.state_dir }}/identity.pub"
  register: miner_identity_pub
  when: miner_id is not defined

- name: Resolve this miner's vali miner_id
  ansible.builtin.set_fact:
    miner_agent_miner_id: >-
      {{ miner_id if miner_id is defined
         else (miner_identity_pub.content | b64decode | node_id_to_miner_id) }}

- name: Refuse an empty, oversize or unsafe miner_id
  # vali's `MinerIdentity.miner_id` and the signed heartbeat body cap
  # the id at 64 chars; the agent refuses an empty one at start. The
  # charset keeps the id a plain TOML string in the rendered config.
  ansible.builtin.assert:
    that:
      - miner_agent_miner_id | string | trim | length > 0
      - miner_agent_miner_id | string | length <= 64
      - miner_agent_miner_id is match('^[A-Za-z0-9._-]+$')
    fail_msg: >-
      miner_id {{ miner_agent_miner_id | to_json }} is not a 1-64 char
      [A-Za-z0-9._-] id. Fix the `miner_id` host var, or unset it to
      derive the id from the node id.

# ── Storage pools / dedicated disks (disk-tier) ─────────────────────
- name: Assert the storage pool and dedicated disk declarations
  # The agent drops an invalid declaration (and runs with `default` only)
  # rather than crash-loop; fail here instead, where the operator sees why.
  vars:
    _pools: "{{ miner_storage_pools | default([]) }}"
    _disks: "{{ miner_storage_dedicated_disks | default([]) }}"
  ansible.builtin.assert:
    that:
      # Shape first, so a malformed entry fails here with the message
      # below rather than as an evaluation error further down.
      - _pools is sequence and _pools is not string and _pools is not mapping
      - _disks is sequence and _disks is not string and _disks is not mapping
      - _pools | reject('mapping') | list | length == 0
      - _disks | reject('mapping') | list | length == 0
      - _pools | rejectattr('id', 'defined') | list | length == 0
      - _pools | rejectattr('class', 'defined') | list | length == 0
      - _pools | rejectattr('budget_gb', 'defined') | list | length == 0
      - _disks | rejectattr('id', 'defined') | list | length == 0
      # No typo'd key passes silently (a `sorce:` would mean no bind).
      - _pools | map('dict2items') | flatten | map(attribute='key') | reject('in', ['id', 'class', 'budget_gb', 'source', 'os_disks', 'state']) | list | length == 0
      - _disks | map('dict2items') | flatten | map(attribute='key') | reject('in', ['id', 'state']) | list | length == 0
      - _pools | selectattr('os_disks', 'defined') | map(attribute='os_disks') | reject('boolean') | list | length == 0
      - _pools | length <= 3
      - _pools | map(attribute='id') | unique | list | length == _pools | length
      - _pools | rejectattr('id', 'match', '^[a-z0-9-]{1,32}$') | list | length == 0
      - _pools | selectattr('id', 'equalto', 'default') | list | length == 0
      - _pools | rejectattr('class', 'in', ['nvme', 'ssd', 'hdd']) | list | length == 0
      - _pools | map(attribute='budget_gb') | map('string') | reject('match', '^[0-9]+$') | list | length == 0
      - _pools | selectattr('state', 'defined') | rejectattr('state', 'in', ['active', 'draining']) | list | length == 0
      - _pools | selectattr('source', 'defined') | rejectattr('source', 'match', '^/[A-Za-z0-9._/-]+$') | list | length == 0
      - (miner_storage_default_class | default('nvme')) in ['nvme', 'ssd', 'hdd']
      - _disks | length <= 24
      - _disks | map(attribute='id') | unique | list | length == _disks | length
      - _disks | rejectattr('id', 'match', '^(wwn|ata|scsi|nvme)-[A-Za-z0-9._:-]{1,90}$') | list | length == 0
      - _disks | selectattr('id', 'match', '.*-part[0-9]+$') | list | length == 0
      - _disks | selectattr('state', 'defined') | rejectattr('state', 'in', ['active', 'draining']) | list | length == 0
    fail_msg: >-
      miner_storage_pools: at most 3 (plus the implicit `default`), unique
      [a-z0-9-]{1,32} ids other than `default`, class nvme|ssd|hdd, an
      integer budget_gb, a boolean os_disks, state active|draining, an
      absolute [A-Za-z0-9._/-] `source` if any, and no other key (got
      {{ _pools }}). miner_storage_dedicated_disks: at most 24 unique
      /dev/disk/by-id names (wwn-/ata-/scsi-/nvme-, not a partition), keys
      id/state only (got {{ _disks }}).

- name: Assert the v7 heartbeat is only asked for on top of v6
  # The agent refuses `emit_pools` without `schema_agent_version`.
  ansible.builtin.assert:
    that:
      - not (miner_heartbeat_emit_pools | default(false) | bool)
        or (miner_heartbeat_schema_agent_version | default(false) | bool)
    fail_msg: >-
      miner_heartbeat_emit_pools needs miner_heartbeat_schema_agent_version:
      the v7 heartbeat is the v6 body plus the storage report.

- name: Assert each bind source is a mounted filesystem other than /
  # Bound before its filesystem is mounted (this play run alone, a RAID not
  # up yet), the pool would capture an empty directory of the root
  # filesystem and keep it until a reboot.
  ansible.builtin.assert:
    that:
      - item.source in (ansible_mounts | map(attribute='mount') | list)
      - item.source != '/'
    fail_msg: >-
      storage pool {{ item.id }}: source {{ item.source }} is not a mounted
      filesystem (or is /). Mount it first (play 04 for the data RAID).
  loop: "{{ miner_storage_pools | default([]) | selectattr('source', 'defined') | list }}"
  loop_control:
    label: "{{ item.id }} <- {{ item.source }}"

- name: Ensure each storage pool's mount point exists under the pools root
  # The agent requires every pool other than `default` at
  # <state_dir>/pools/<id> (its sandbox's writable root). No mode: once a
  # filesystem is mounted there, this path IS its root, whose mode is its
  # own play's (04-data-raid), not this one's.
  ansible.builtin.file:
    path: "{{ miner_agent.state_dir }}/pools/{{ item.id }}"
    state: directory
  loop: "{{ miner_storage_pools | default([]) }}"
  loop_control:
    label: "{{ item.id }}"

- name: Bind-mount each storage pool's filesystem at its pool path (fstab)
  # A pool whose filesystem is mounted elsewhere (`source`, e.g.
  # /mnt/hippius-data) is bind-mounted at its pool path, durably: the
  # fstab line orders the bind after the source mount. `nofail`: a bind
  # that cannot come up at boot must not drop a remote host into emergency
  # mode — the agent reports the pool unavailable instead.
  # `x-systemd.before=` orders the bind before the agent at boot (nofail
  # alone lets the agent start first, and see the pool unmounted). A pool
  # mounted directly at its pool path has no `source`. Changing a pool's `source`
  # later needs an unmount first (a remount keeps the old one live).
  ansible.posix.mount:
    path: "{{ miner_agent.state_dir }}/pools/{{ item.id }}"
    src: "{{ item.source }}"
    fstype: none
    opts: "bind,nofail,x-systemd.requires-mounts-for={{ item.source }},x-systemd.before=hippius-miner-agent.service"
    state: mounted
  loop: "{{ miner_storage_pools | default([]) | selectattr('source', 'defined') | list }}"
  loop_control:
    label: "{{ item.id }} <- {{ item.source }}"

- name: Assert the orders server has a real mesh address to bind
  # Play 04 detects it (miner_netbird_ip); `orders_bind_ip` is the
  # fallback when play 04 is not part of this run. Under --check on a
  # never-joined host there is no address yet.
  ansible.builtin.assert:
    that:
      - (miner_netbird_ip | default(orders_bind_ip)) is match('^100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.')
    fail_msg: >-
      No NetBird mesh address for [orders] bind_addr (got
      "{{ miner_netbird_ip | default(orders_bind_ip) }}"). Run play 04 in
      the same invocation, or set orders_bind_ip in host_vars to this
      host's `netbird status` address.
  when: not ansible_check_mode

- name: Refuse an unfilled placeholder before rendering the config
  ansible.builtin.import_tasks: placeholder-check.yml

- name: Render the miner-agent config
  ansible.builtin.template:
    # Explicit playbook-relative path — unambiguous regardless of the
    # template search-path heuristics for an imported task file.
    src: "{{ playbook_dir }}/miner-tasks/templates/miner-agent-config.toml.j2"
    dest: "{{ miner_agent.config_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Read this host's real SEV-SNP CHIP_ID (the launch/attestation platform_id)
  # The `platform_id` vali stores in `MinerIdentity` MUST be the real
  # 64-byte AMD CHIP_ID — the launch ticket pins it to bind the miner's
  # VCEK for §21 attestation, and vali's scheduler dispatchability gate
  # (#510) rejects a miner whose platform_id is not real 128-hex.
  # Reading it from hardware (host /dev/sev GET_ID) instead of letting
  # the operator hand-type a label removes the placeholder-CHIP_ID bug
  # that once left hosts un-schedulable.
  ansible.builtin.command:
    argv:
      - "{{ miner_agent.install_path }}"
      - "platform-id"
  register: miner_platform_id
  changed_when: false
  check_mode: false

- name: "OPERATOR ACTION — register this miner with vali"
  ansible.builtin.import_tasks: registration-output.yml

# ── systemd unit ────────────────────────────────────────────────────
# The [storage] roots must be writable to the agent: with
# ProtectSystem=strict below, a root outside the state dir is read-only
# and every launch fails (`overlay-disk/mkdir`, `data-disk/mkdir` or
# `state-disk/mkdir`), so the unit lists them in ReadWritePaths. They are
# NOT created here: a root meant to be a dedicated mount that is not
# mounted yet would silently put VM disks on the system disk, hidden
# later by the mount. Mount (or create) them before the play.
- name: Stat the [storage] roots
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ miner_storage_roots }}"
  register: miner_storage_root_stat
  vars:
    miner_storage_roots: "{{ [miner_data_disk_root, miner_state_disk_root] | unique(case_sensitive=True) }}"

- name: Refuse a [storage] root that is missing, not a directory, or unusable in a unit
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isdir
      - item.item is match('^/[^\s]*$')
    fail_msg: >-
      [storage] root {{ item.item }} must be an existing absolute directory
      without whitespace (systemd ReadWritePaths is space-separated).
      Mount or create it before running this play.
    quiet: true
  loop: "{{ miner_storage_root_stat.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Install the miner-agent systemd unit
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ miner_agent.systemd_unit_name }}.service"
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Hippius miner-agent
      # Soft dependencies ONLY (Wants= + After=), never Requires= /
      # BindsTo= / PartOf=: with a hard one, stopping or restarting
      # netbird or libvirtd (a netbird apt upgrade, a libvirt postinst,
      # an operator restart) STOPS the agent too — and a stopped agent
      # is one config slip (skip_shutdown_teardown) away from tearing
      # down every tenant domain. The agent tolerates both being down:
      # libvirt is driven by one `virsh` process per operation (the
      # reboot-watcher's `virsh event` respawns on exit), and a NetBird
      # outage only fails the orders bind at START, which Restart=
      # retries until the mesh address is back.
      After=network-online.target libvirtd.service netbird.service
      Wants=network-online.target libvirtd.service netbird.service
      # No start-rate limit: Restart= must always bring the agent back,
      # including after the auto-updater's SIGKILL swap and its rollback.
      StartLimitIntervalSec=0

      [Service]
      Type=simple
      ExecStart={{ miner_agent.install_path }} serve --config {{ miner_agent.config_path }}
      # always, not on-failure: a binary that exits 0 is brought back too
      # (the agent only exits on a signal; `systemctl stop` never restarts).
      Restart=always
      RestartSec=10
      User=root
      Group=root

      # Hardening — a root service kept on a tight leash. The agent
      # reaches libvirt over its UNIX socket and Hippius S3 over the
      # network; it needs no raw devices and no kernel tunables (the
      # dedicated-disk inventory reads the facts the
      # hippius-miner-storage-collect oneshot writes). Storage pools other
      # than `default` live at /var/lib/hippius-miner/pools/<id>
      # (mounted or bind-mounted there), inside the state dir below, so a
      # pool declared from the dashboard needs no unit change.
      ProtectSystem=strict
      ProtectHome=true
      ReadWritePaths={{ [miner_agent.state_dir, miner_data_disk_root, miner_state_disk_root] | unique(case_sensitive=True) | join(' ') }}
      NoNewPrivileges=true
      PrivateTmp=true
      PrivateDevices=true
      ProtectKernelTunables=true
      ProtectControlGroups=true

      [Install]
      WantedBy=multi-user.target

- name: Install the storage collector (dedicated-disk facts) service
  # A oneshot of the same binary, OUTSIDE the agent's PrivateDevices
  # sandbox: it reads /sys/block, /dev/disk/by-id and `blkid -p`
  # (read-only on every disk) and writes the facts the agent reads. No
  # network. The agent also starts it before judging declared disks.
  ansible.builtin.copy:
    dest: /etc/systemd/system/hippius-miner-storage-collect.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Hippius miner storage collector (dedicated-disk facts)

      [Service]
      Type=oneshot
      ExecStart={{ miner_agent.install_path }} storage-collect --out /run/hippius-miner/disk-facts.json
      User=root
      Group=root
      RuntimeDirectory=hippius-miner
      RuntimeDirectoryPreserve=yes
      ProtectSystem=strict
      ProtectHome=true
      PrivateTmp=true
      PrivateNetwork=true
      NoNewPrivileges=true
      ProtectKernelTunables=true
      ProtectControlGroups=true
      TimeoutStartSec=300

- name: Install the storage collector timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/hippius-miner-storage-collect.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Refresh the miner's dedicated-disk facts

      [Timer]
      OnBootSec=30s
      OnUnitActiveSec=5min
      AccuracySec=30s

      [Install]
      WantedBy=timers.target

- name: Enable and start the storage collector timer
  ansible.builtin.systemd:
    name: hippius-miner-storage-collect.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Enable the miner-agent unit — but DO NOT start it
  # Intentionally no `state:` — the operator starts the service
  # manually after provisioning the mTLS cert (play 06 + the README
  # post-delivery checklist). `daemon_reload` picks up the unit above.
  ansible.builtin.systemd:
    name: "{{ miner_agent.systemd_unit_name }}"
    enabled: true
    daemon_reload: true

- name: "OPERATOR ACTION — swap the agent if it was already running"
  # The miner-agent lifecycle is operator-controlled (the service is
  # enabled, not started). If this run REPLACED the binary and the
  # operator had already started the service, it keeps running the old
  # binary until relaunched — surface that rather than auto-restarting.
  # Never `systemctl restart`: a graceful stop destroys every domain
  # unless the RUNNING process started with skip_shutdown_teardown.
  ansible.builtin.debug:
    msg: >-
      The miner-agent binary was (re)installed. If the service is
      already running on this host, relaunch it on the new binary with
      `systemctl kill --signal=SIGKILL {{ miner_agent.systemd_unit_name }}`
      (Restart= brings it back and it re-adopts the running CVMs). Do not
      use systemctl restart/stop. See miner-tasks/AUTO_UPDATE.md.
  when: miner_agent_build_needed | bool

# ── Auto-update (GitHub Releases) ──────────────────────────────────
# A systemd timer runs /usr/local/bin/hippius-miner-update, which installs
# the latest release of miner_auto_update_release_repo once it is old
# enough and verified (sha256, cosign build-provenance attestation, the
# binary's --version), swaps the agent with SIGKILL — never stop/restart —
# and rolls back on a missing heartbeat. The files are always installed;
# the timer only runs when miner_auto_update_enabled is true (the
# group_vars default). See miner-tasks/AUTO_UPDATE.md. Tagged
# `miner_auto_update` so the switch can be applied alone
# (`--tags miner_auto_update`) without re-running the agent install.
- name: Ensure the cosign directory exists
  tags: [miner_auto_update]
  ansible.builtin.file:
    path: "{{ miner_cosign.path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install cosign (pinned version + digest) for the release attestation
  tags: [miner_auto_update]
  ansible.builtin.get_url:
    url: "https://github.com/sigstore/cosign/releases/download/{{ miner_cosign.version }}/cosign-linux-amd64"
    dest: "{{ miner_cosign.path }}"
    checksum: "sha256:{{ miner_cosign.sha256 }}"
    owner: root
    group: root
    mode: "0755"

- name: Install the miner-agent auto-update script
  tags: [miner_auto_update]
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/miner-tasks/files/hippius-miner-update.sh"
    dest: /usr/local/bin/hippius-miner-update
    owner: root
    group: root
    mode: "0755"

- name: Render the auto-update env file
  tags: [miner_auto_update]
  ansible.builtin.template:
    src: "{{ playbook_dir }}/miner-tasks/templates/auto-update.env.j2"
    dest: /etc/hippius-miner/auto-update.env
    owner: root
    group: root
    mode: "0644"

- name: Render the auto-update systemd service + timer units
  tags: [miner_auto_update]
  ansible.builtin.template:
    src: "{{ playbook_dir }}/miner-tasks/templates/{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - hippius-miner-update.service
    - hippius-miner-update.timer

- name: Enable + start the auto-update timer (gated on miner_auto_update_enabled)
  tags: [miner_auto_update]
  # `daemon_reload` picks up the rendered units. Disabled: stop + disable
  # the timer so a previously enabled miner is frozen. Only the timer: the
  # agent service ({{ miner_agent.systemd_unit_name }}) is never touched.
  ansible.builtin.systemd:
    name: hippius-miner-update.timer
    enabled: "{{ miner_auto_update_enabled | bool }}"
    state: "{{ 'started' if (miner_auto_update_enabled | bool) else 'stopped' }}"
    daemon_reload: true
