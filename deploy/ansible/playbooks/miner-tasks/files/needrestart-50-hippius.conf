# Managed by Ansible (miner-tasks/needrestart.yml, tag miner_needrestart).
# Local edits are overwritten on the next run.
#
# needrestart runs after every apt transaction, unattended-upgrades
# included, and restarts each service still mapping an upgraded library.
# These are never restarted that way; anything else still is. The distro
# needrestart.conf already holds back ^libvirt, ^virtlogd and ^virtlockd:
# they are repeated here so this file alone states the policy. The
# modular libvirt daemons are listed for hosts that run them.
$nrconf{override_rc}{qr(^hippius-miner-agent)} = 0;
$nrconf{override_rc}{qr(^libvirt)} = 0;
$nrconf{override_rc}{qr(^virtqemud)} = 0;
$nrconf{override_rc}{qr(^virtlogd)} = 0;
$nrconf{override_rc}{qr(^virtlockd)} = 0;
$nrconf{override_rc}{qr(^virtnetworkd)} = 0;
$nrconf{override_rc}{qr(^virtnodedevd)} = 0;
$nrconf{override_rc}{qr(^virtstoraged)} = 0;
$nrconf{override_rc}{qr(^virtsecretd)} = 0;
$nrconf{override_rc}{qr(^virtproxyd)} = 0;
