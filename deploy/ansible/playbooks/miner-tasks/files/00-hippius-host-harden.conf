# Managed by Ansible (06-miner-bootstrap.yml, tag miner_sshd_harden).
# Local edits are overwritten on the next run.
#
# sshd keeps the FIRST value it reads for a keyword, and sshd_config
# includes sshd_config.d/*.conf in lexical order near its top: the 00-
# prefix makes these lines win over 50-cloud-init.conf (which ships
# `PasswordAuthentication yes` on some provider images) and over any
# keyword set later in sshd_config itself.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
MaxAuthTries 3
LoginGraceTime 30
