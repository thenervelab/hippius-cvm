---
# Orchestrator for the UNTRUSTED miner fleet (`miner_nodes` group).
#
# Run order:
#   00 preflight         READ-ONLY, fail-closed host checks: generic
#                        hardware/firmware/OS (codes + fixes), derives
#                        snp_generation; alone: `--tags preflight`
#   01 SEV-SNP cmdline   GRUB tokens — reboots ONLY if the line changed;
#                        retires hippius-smt-off, asserts no CPU offline
#   02 libvirt + qemu    tenant-CVM hypervisor stack
#   03 networking        libvirt `default` NAT network for tenant VMs
#   04 NetBird agent     join the NetBird `miner` group via setup key
#   05 miner-agent       install the binary + systemd unit + identity
#   06 mTLS mount point  create the dir; the operator pushes the certs
#   07 host firewall     UFW default-deny INPUT + narrow public surface
#   08 host sshd         key-only auth (drop-in), `systemctl reload ssh`
#
# This playbook is a SEPARATE trust profile from the cc-node playbooks
# (`site.yml` / 00-05): it is intentionally NOT wired into `site.yml`.
# Run it explicitly, scoped to one host:
#   ansible-playbook -i inventory.yml playbooks/06-miner-bootstrap.yml \
#     --limit <miner-host>
#
# INVARIANTS (asserted at preflight, see the README "Miner node
# bootstrap" section):
#   - it NEVER touches the hippius-compute Vault — no lookup, no token.
#     A task that pulls a credential from Vault is a BUG.
#   - it NEVER installs k3s — a miner is not a cluster node.
#   - the miner identity is self-generated on the box; nothing is
#     imported.
#   - the mTLS cert content is operator-provisioned out-of-band;
#     Ansible only creates the mount-point directory.

# ── 00 — Preflight (read-only, fail-closed) ─────────────────────────
- name: "00 — Miner preflight"
  hosts: miner_nodes
  gather_facts: true
  become: true
  # `--tags preflight` runs this play alone (with `--check`: changes nothing).
  tags: [preflight]
  tasks:
    # ── Generic host preflight ──────────────────────────────────────
    # Judges the host from what it IS (CPU, BIOS, firmware, kernel,
    # sizes, clock, network), so a third-party operator with no curated
    # host_vars gets the same refusal we would — every problem at once,
    # each with a code and a fix (docs/operator/external-miner-guide.md
    # lists them). The logic is filter_plugins/host_preflight.py
    # (unit-tested: tests/test_host_preflight.py); the probe below only
    # reads. Run this play alone with `--tags preflight` (add `--check`
    # to change nothing at all: without it, the legacy NetBird apt source
    # below is the one file it removes).
    - name: Probe the host hardware, firmware and services (read-only)
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail
          cpuinfo() {
            awk -F: -v k="$1" '{f=$1; sub(/[ \t]+$/, "", f)} f == k {v=$2; sub(/^[ \t]+/, "", v); print v; exit}' /proc/cpuinfo
          }
          has_flag() { case " $(cpuinfo flags) " in *" $1 "*) echo 1 ;; *) echo 0 ;; esac; }
          echo "cpu_vendor=$(cpuinfo vendor_id)"
          echo "cpu_family=$(cpuinfo 'cpu family')"
          echo "cpu_model=$(cpuinfo model)"
          echo "cpu_model_name=$(cpuinfo 'model name')"
          echo "flag_sev_snp=$(has_flag sev_snp)"
          echo "flag_hypervisor=$(has_flag hypervisor)"
          echo "virt=$(systemd-detect-virt --vm 2>/dev/null)"
          echo "cmdline=$(cat /proc/cmdline)"
          echo "smt_control=$(cat /sys/devices/system/cpu/smt/control 2>/dev/null || echo absent)"
          echo "smt_active=$(cat /sys/devices/system/cpu/smt/active 2>/dev/null)"
          echo "cpus_online=$(cat /sys/devices/system/cpu/online 2>/dev/null)"
          echo "cpus_present=$(cat /sys/devices/system/cpu/present 2>/dev/null)"
          echo "cpus_possible=$(cat /sys/devices/system/cpu/possible 2>/dev/null)"
          # PRESENT CPUs that are offline (cpuN dirs; cpu0 may have no
          # `online` file) — not cpu/offline, which lists empty slots too.
          off=""
          for f in /sys/devices/system/cpu/cpu[0-9]*/online; do
            [ -e "$f" ] || continue
            if [ "$(cat "$f")" = 0 ]; then d=${f%/online}; off="$off ${d##*/}"; fi
          done
          echo "cpus_offline=$off"
          if systemctl cat hippius-smt-off.service >/dev/null 2>&1; then echo smt_off_unit=1; else echo smt_off_unit=0; fi
          if systemctl cat {{ miner_agent.systemd_unit_name }}.service >/dev/null 2>&1; then echo agent_installed=1; else echo agent_installed=0; fi
          echo "sev_snp_param=$(cat /sys/module/kvm_amd/parameters/sev_snp 2>/dev/null || echo absent)"
          if [ -e /dev/sev ]; then echo dev_sev=1; else echo dev_sev=0; fi
          echo "sev_es_asids=$(awk '$1 == "sev_es" {print $2}' /sys/fs/cgroup/misc.capacity 2>/dev/null)"
          fw_re='SEV-SNP API:[0-9]+\.[0-9]+ build:[0-9]+'
          fw=$(dmesg 2>/dev/null | grep -oE "$fw_re" | tail -1)
          [ -n "$fw" ] || fw=$(journalctl -k -b 0 -q --no-pager 2>/dev/null | grep -oE "$fw_re" | tail -1)
          echo "snp_fw=${fw#SEV-SNP API:}"
          echo "iommu_units=$(ls /sys/class/iommu 2>/dev/null | wc -l)"
          echo "ntp_synced=$(timedatectl show -p NTPSynchronized --value 2>/dev/null)"
          if command -v netbird >/dev/null 2>&1; then
            echo netbird_installed=1
            echo "netbird_mgmt=$(timeout 10 netbird status 2>/dev/null | awk -F': *' '/^Management:/ {print $2; exit}')"
          else
            echo netbird_installed=0
          fi
        executable: /bin/bash
      register: miner_host_probe
      changed_when: false
      check_mode: false

    - name: Stat the [storage] roots
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ [miner_data_disk_root, miner_state_disk_root] }}"
      register: miner_pf_roots

    - name: Read the block counts of the filesystem holding the data root
      # Fundamental block size, blocks, free, available: the usable size
      # excludes the root-reserved blocks, which `ansible_mounts` cannot
      # show (#1641). The mount point always exists, the root may not yet.
      ansible.builtin.command:
        argv:
          - timeout
          - "10"
          - stat
          - -f
          - -c
          - "%S %b %f %a"
          - "{{ (miner_data_disk_root | miner_mount_for(ansible_mounts)) or '/' }}"
      register: miner_pf_data_statfs
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Probe the NetBird management URL from the host
      # Any HTTP status = reachable (TLS verified, so a broken clock or an
      # intercepting proxy shows up here too); -1 = no answer.
      ansible.builtin.uri:
        url: "{{ network.netbird_management_url }}"
        method: GET
        follow_redirects: none
        timeout: 10
      register: miner_pf_netbird_mgmt
      failed_when: false
      check_mode: false

    - name: Judge the host, report, refuse or derive snp_generation
      ansible.builtin.import_tasks: miner-tasks/host-preflight.yml

    # NetBird's OWN install script writes a legacy one-line source at
    # `/etc/apt/sources.list.d/netbird.list` pinned to
    # `/usr/share/keyrings/netbird-archive-keyring.gpg`. Play 04 declares
    # the SAME repo as a deb822 source with a different keyring, and apt
    # refuses to read its ENTIRE source list when one repo carries two
    # `Signed-By` values:
    #
    #   E: Conflicting values set for option Signed-By regarding source
    #      https://pkgs.netbird.io/debian/ stable:
    #      /usr/share/keyrings/netbird-archive-keyring.gpg
    #      != /etc/apt/keyrings/netbird.asc
    #
    # So it does not merely break NetBird — it breaks the FIRST apt task
    # of the run, which is the libvirt install in play 02, long before
    # play 04 could clean up after itself. Hence the removal lives here in
    # preflight rather than next to the repo it belongs to — after the
    # generic checks, so a refused host is left untouched, and before
    # the apt read below, which the conflict would break too.
    #
    # This bites any host where netbird was installed by the vendor's
    # script — a third party who followed NetBird's own documentation
    # before running this playbook, or any re-run on a host bootstrapped
    # by an older revision of it.
    - name: Remove the legacy one-line NetBird apt source (conflicting Signed-By)
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/netbird.list
        state: absent

    # The OS release is a proxy; this is the property itself. Read what
    # apt WOULD install (or has installed) before play 02 installs it, so a
    # host whose distro hypervisor cannot boot an SNP guest is refused here
    # rather than at its first tenant launch.
    - name: Read the libvirt / QEMU versions apt resolves to
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          for pkg in libvirt-daemon-system qemu-system-x86; do
            v=$(apt-cache policy "$pkg" | awk '/Installed:/{i=$2} /Candidate:/{c=$2} END{print (i != "" && i != "(none)") ? i : c}')
            # 1:10.2.1+ds-1ubuntu3.2 -> 10.2.1
            echo "$pkg=$(echo "$v" | sed -E 's/^[0-9]+://; s/^([0-9]+(\.[0-9]+)*).*/\1/')"
          done
        executable: /bin/bash
      register: miner_hv_resolved
      changed_when: false
      # Read-only: run it under --check too, or the assert below sees
      # no output and fails every --check run.
      check_mode: false

    - name: Assert the distro hypervisor can launch a SEV-SNP guest
      ansible.builtin.assert:
        that:
          # An empty / "(none)" answer (unknown package, empty apt lists)
          # must fail with this message, not a version() type error.
          - miner_hv_libvirt is match('^[0-9]')
          - miner_hv_qemu is match('^[0-9]')
          - miner_hv_libvirt is version(miner_min_libvirt_version, '>=')
          - miner_hv_qemu is version(miner_min_qemu_version, '>=')
        fail_msg: >-
          [HYPERVISOR_TOO_OLD] libvirt {{ miner_hv_libvirt }} / QEMU {{ miner_hv_qemu }} cannot boot a
          SEV-SNP guest (need libvirt >= {{ miner_min_libvirt_version }} and QEMU
          >= {{ miner_min_qemu_version }}): every `<launchSecurity type='sev-snp'>`
          domain the miner-agent renders would be refused. Upgrade the OS.
      vars:
        miner_hv_libvirt: "{{ (miner_hv_resolved.stdout_lines | select('match', '^libvirt-daemon-system=') | first).split('=')[1] }}"
        miner_hv_qemu: "{{ (miner_hv_resolved.stdout_lines | select('match', '^qemu-system-x86=') | first).split('=')[1] }}"

    - name: Assert system + data NVMe devices from host_vars are block devices
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: true   # host_vars name disks by /dev/disk/by-id symlinks
      loop: "{{ (nvme_system_devices | default([])) + (nvme_data_devices | default([])) }}"
      register: miner_nvme_stat

    - name: Fail closed if any declared NVMe device is missing or not a block device
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isblk | default(false)
        fail_msg: >-
          [NVME_LAYOUT] {{ item.item }} is not a block device on this host — the
          host_vars NVMe layout is wrong. Re-check `lsblk` BEFORE
          running anything (the §K2 control-plane near-miss lesson).
      loop: "{{ miner_nvme_stat.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Verify the data NVMe devices carry no system / unexpected signature
      # Read-only safety assertion — this bootstrap does NOT format the
      # data disks (tenant LUKS volumes are MA-3+). It fails closed on:
      #   - a partition table — a partitioned "data" device is almost
      #     always a mis-targeted system disk (/, /boot, swap); the
      #     §K2 control-plane near-miss lesson;
      #   - any whole-disk filesystem / RAID signature OTHER than
      #     crypto_LUKS or a data-only `linux_raid_member`.
      # An empty (raw, fresh box) device passes; so does crypto_LUKS —
      # a tenant volume a later MA-3+ stage initialised — so re-running
      # this bootstrap to update the agent stays idempotent after the
      # disks are in use.
      #
      # `linux_raid_member` is accepted ONLY when the array the device
      # belongs to is mounted, and mounted nowhere system-critical.
      # Play 04 (`04-data-raid.yml`) is what PUTS that signature there,
      # so refusing it outright broke the idempotence this comment
      # promises: on any host where play 04 had run, re-running this
      # bootstrap failed closed forever. The safety property is
      # unchanged — a member of an array carrying /, /boot, /boot/efi
      # or swap is still refused, which is the §K2 control-plane near-miss this
      # assertion exists for. An UNMOUNTED raid member is refused too:
      # an unassembled array is unidentifiable, so it fails closed.
      ansible.builtin.shell:
        cmd: |
          set -e
          for dev in {{ nvme_data_devices | default([]) | join(' ') }}; do
            if blkid -p "$dev" 2>/dev/null | grep -q "PTTYPE="; then
              echo "DATA_DISK_BUSY: $dev has a partition table — refusing (likely a system disk):"
              lsblk "$dev"
              exit 1
            fi
            sig=$(blkid -p -o value -s TYPE "$dev" 2>/dev/null || true)
            case "$sig" in
              ""|crypto_LUKS) ;;
              linux_raid_member)
                mnts=$(lsblk -nro MOUNTPOINTS "$dev" 2>/dev/null | grep -v '^$' || true)
                if [ -z "$mnts" ]; then
                  echo "DATA_DISK_BUSY: $dev is an UNASSEMBLED raid member — refusing (cannot identify the array):"
                  lsblk "$dev"
                  exit 1
                fi
                while IFS= read -r m; do
                  case "$m" in
                    /|/boot|/boot/efi|"[SWAP]")
                      echo "DATA_DISK_BUSY: $dev backs a SYSTEM mount [$m] — refusing:"
                      lsblk "$dev"
                      exit 1
                      ;;
                  esac
                done <<< "$mnts"
                ;;
              *)
                echo "DATA_DISK_BUSY: $dev has an unexpected signature [$sig] — refusing:"
                lsblk "$dev"
                exit 1
                ;;
            esac
          done
          echo OK
        executable: /bin/bash
      register: miner_disk_check
      changed_when: false
      failed_when: "'OK' not in miner_disk_check.stdout"
      check_mode: false
    - name: Stat the NetBird setup key on the operator workstation
      ansible.builtin.stat:
        path: "{{ operator_secret_dir }}/{{ netbird_setup_key_file }}"
      delegate_to: localhost
      become: false
      register: miner_nb_key

    - name: Assert the NetBird setup key is present locally
      ansible.builtin.assert:
        that:
          - miner_nb_key.stat.exists
        fail_msg: >-
          [NETBIRD_SETUP_KEY_MISSING] NetBird setup key missing. Save the
          single-use key the providers dashboard shows when you prepare the
          host (fleet operators: a key bound to the `miner` group) to
          {{ operator_secret_dir }}/{{ netbird_setup_key_file }}.

    - name: "INVARIANT — assert NO Vault credentials are configured for miners"
      # Miners are untrusted — they must NEVER reach the hippius-compute
      # Vault. This fails the run if a Vault var was inherited or set.
      ansible.builtin.assert:
        that:
          - vault_addr is not defined
          - vault_token is not defined
        fail_msg: >-
          [VAULT_CREDENTIALS_SET] INVARIANT VIOLATION — a Vault credential is defined for a
          miner node. Miners never authenticate to the hippius-compute
          Vault. Remove vault_addr / vault_token from the miner vars.

    - name: Check whether k3s is installed on this host
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: miner_k3s_bin

    - name: "INVARIANT — assert this miner host is not a k3s node"
      # A miner is not a cluster node. `k3s_install_args` exists in
      # group_vars/all.yml for the cc-nodes — this playbook never acts
      # on it — and the box itself must carry no k3s install.
      ansible.builtin.assert:
        that:
          - not miner_k3s_bin.stat.exists
        fail_msg: >-
          [K3S_PRESENT] INVARIANT VIOLATION — /usr/local/bin/k3s exists on this host.
          Miners are never cluster nodes and never run k3s; this box is
          mis-targeted for the miner bootstrap.

# ── 01 — SEV-SNP kernel cmdline ─────────────────────────────────────
- name: "01 — SEV-SNP kernel cmdline"
  hosts: miner_nodes
  become: true
  tasks:
    - name: Retire the runtime SMT-off unit (breaks SNP DF_FLUSH)
      ansible.builtin.import_tasks: miner-tasks/smt-runtime-off-retire.yml
    - name: Apply the SEV-SNP GRUB cmdline
      ansible.builtin.import_tasks: miner-tasks/snp-kernel.yml
  handlers:
    - name: run update-grub
      ansible.builtin.command:
        cmd: update-grub
      changed_when: true
    - name: reboot for SEV-SNP cmdline
      ansible.builtin.reboot:
        reboot_timeout: 600
        post_reboot_delay: 15
        msg: "Rebooting to apply the SEV-SNP GRUB cmdline"

# ── 02 — libvirt + qemu ─────────────────────────────────────────────
- name: "02 — libvirt + qemu install"
  hosts: miner_nodes
  become: true
  tasks:
    - name: Install the tenant-CVM hypervisor stack
      ansible.builtin.import_tasks: miner-tasks/libvirt-install.yml
    - name: Keep unattended-upgrades off the hypervisor stack
      ansible.builtin.import_tasks: miner-tasks/unattended-upgrades.yml
    - name: Keep needrestart off the miner-agent and libvirt
      ansible.builtin.import_tasks: miner-tasks/needrestart.yml
    - name: Install the host-inventory collector's tools
      ansible.builtin.import_tasks: miner-tasks/host-inventory-tools.yml
      tags: [miner_inventory]

# ── 03 — Tenant CVM networking ──────────────────────────────────────
- name: "03 — Tenant CVM networking bridge"
  hosts: miner_nodes
  become: true
  tasks:
    - name: Enable the libvirt default network
      ansible.builtin.import_tasks: miner-tasks/networking-bridge.yml

# ── 04 — NetBird agent ──────────────────────────────────────────────
- name: "04 — NetBird agent + join the miner group"
  hosts: miner_nodes
  become: true
  tasks:
    - name: Install + join NetBird
      ansible.builtin.import_tasks: miner-tasks/netbird-agent.yml

# ── 05 — miner-agent ────────────────────────────────────────────────
- name: "05 — miner-agent install + identity self-gen"
  hosts: miner_nodes
  become: true
  tasks:
    - name: Install the miner-agent
      ansible.builtin.import_tasks: miner-tasks/miner-agent-install.yml
    - name: Install the guest network policy boot loader
      ansible.builtin.import_tasks: miner-tasks/net-policy-loader.yml

# ── 06 — mTLS cert mount point ──────────────────────────────────────
- name: "06 — mTLS cert mount point (operator pushes the content)"
  hosts: miner_nodes
  become: true
  tasks:
    - name: Prepare the mTLS cert directory
      ansible.builtin.import_tasks: miner-tasks/mtls-cert-mount.yml

# ── 07 — Host firewall (UFW) ────────────────────────────────────────
- name: "07 — Host firewall (UFW default-deny INPUT)"
  hosts: miner_nodes
  become: true
  tasks:
    - name: Apply the UFW host firewall
      ansible.builtin.import_tasks: miner-tasks/host-firewall.yml

# ── 08 — Host sshd hardening ────────────────────────────────────────
- name: "08 — Host sshd hardening (key-only auth)"
  hosts: miner_nodes
  become: true
  tasks:
    - name: Harden the host sshd
      ansible.builtin.import_tasks: miner-tasks/sshd-harden.yml
  handlers:
    # `reloaded` also starts ssh.service if socket activation has not
    # started it yet. Reload only: never restart sshd from here.
    - name: reload ssh
      ansible.builtin.systemd_service:
        name: ssh
        state: reloaded
