---
# Scratch tree for the launch-preflight wiring tests: a data root, the
# installed agent config, and the stub host tools (launch_preflight_stubs.yml).
# Written for real, under --check too.
- name: Fresh scratch dirs
  check_mode: false
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: "{{ item.state }}"
    mode: "0755"
  loop:
    - { path: "{{ scratch }}", state: absent }
    - { path: "{{ scratch }}/bin", state: directory }
    - { path: "{{ scratch }}/data", state: directory }

- name: The installed agent config
  check_mode: false
  ansible.builtin.copy:
    dest: "{{ scratch }}/config.toml"
    mode: "0600"
    content: |
      [storage]
      data_disk_root = "{{ scratch }}/data"
      state_disk_root = "{{ scratch }}/data"

- name: Stub virsh, systemctl, systemd-run, runuser, a uutils-like dd, id, chown
  check_mode: false
  ansible.builtin.copy:
    dest: "{{ scratch }}/bin/{{ item.key }}"
    mode: "0755"
    content: "{{ item.value }}"
  loop: "{{ stubs | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
