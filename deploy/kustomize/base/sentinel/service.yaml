apiVersion: v1
kind: Service
metadata:
  name: hippius-sentinel
  labels:
    app.kubernetes.io/name: hippius-sentinel
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: hippius-compute
spec:
  # ClusterIP only — the healthz endpoint is for the kubelet (via the
  # pod IP) and for cluster-internal scraping. The sentinel has no
  # ingress; all outputs in PR-S5 are outbound (Anthropic API, S3,
  # Slack, GitHub).
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hippius-sentinel
  ports:
    - name: healthz
      port: 8080
      targetPort: healthz
      protocol: TCP
