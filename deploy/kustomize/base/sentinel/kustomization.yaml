apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Hippius Sentinel — §S, issue #57. PR-S1 skeleton (no readers wired
# yet). Overlay this base with environment-specific patches (image
# digest pin, secret references, namespace) when deploying.
namespace: hippius-sentinel

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml

# ⚠️  OPERATOR-SET. Point this at YOUR container registry and pin a
# digest in the deploying overlay. `registry.example.invalid` uses the
# RFC 2606 reserved TLD: it cannot resolve, so an unpatched overlay
# fails at pull time instead of silently pulling from somewhere real.
images:
  - name: hippius-sentinel
    newName: registry.example.invalid/hippius-sentinel
    newTag: pr-s1-skeleton
