apiVersion: v1
kind: ServiceAccount
metadata:
  name: hippius-sentinel
  labels:
    app.kubernetes.io/name: hippius-sentinel
# PR-S1 skeleton: no cluster RBAC bindings. The sentinel pod talks to
# external services (Anthropic API, future Hippius S3, future KBS audit
# endpoint) and does NOT need API access to the kube apiserver. If
# PR-S3 needs to read pod state for diagnostics it must be granted a
# scoped read-only RoleBinding, never cluster-admin.
automountServiceAccountToken: false
