---
# Prometheus Pushgateway — the metrics sink for BATCH/CronJob workloads
# that are too short-lived to be scraped directly. The synthetic monitor
# (apps.synthetic, vali namespace) PUSHes its light/full-tier result
# gauges here; Prometheus scrapes the gateway via the ServiceMonitor
# below, and the `hippius-synthetic-monitor` PrometheusRule alerts on them.
#
# The gateway PERSISTS the last pushed value per group, which is exactly
# what the staleness alert needs (`last_success_timestamp` survives
# between cron runs). Grouping keys are `{tier}` / `{tier,distro}` — see
# `apps.synthetic.metrics`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-pushgateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: prometheus-pushgateway
    app.kubernetes.io/part-of: hippius-compute
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: pushgateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-pushgateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus-pushgateway
        app.kubernetes.io/component: pushgateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pushgateway
          # Digest-pinned per §F supply-chain reproducibility (tag kept for
          # readability). `--persistence.file` keeps the last-pushed values
          # across a pod restart so staleness alerts stay accurate.
          image: "prom/pushgateway:v1.11.1@sha256:03738d278e082ee9821df730c741b3b465c251fc2b68a85883def301a55a6215"
          args:
            - "--persistence.file=/data/pushgateway.store"
            - "--persistence.interval=1m"
          ports:
            - name: http
              containerPort: 9091
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        # emptyDir is acceptable: a restart loses persisted values but the
        # next cron cycle re-pushes them within minutes; the gateway is not
        # a durable store of record.
        - name: data
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-pushgateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: prometheus-pushgateway
    app.kubernetes.io/part-of: hippius-compute
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: pushgateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus-pushgateway
  ports:
    - name: http
      port: 9091
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: prometheus-pushgateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: prometheus-pushgateway
    app.kubernetes.io/part-of: hippius-compute
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: pushgateway
    # Picked up by the stack's `serviceMonitorSelector: {}` (all).
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-pushgateway
  endpoints:
    - port: http
      interval: 30s
      # CRITICAL: preserve the pushed `job` + `tier`/`distro` grouping
      # labels instead of overwriting them with the scrape job name.
      honorLabels: true
