---
# Alertmanager full config — from Vault. PR-K14, §K (#54), issue #128.
#
# The kube-prometheus-stack chart's Alertmanager wiring reads its
# config from a Secret with key `alertmanager.yaml` (hard-coded by the
# chart) via `alertmanagerSpec.useExistingSecret + .configSecret`
# (see ../values.yaml).
#
# The full `alertmanager.yaml` — including the Slack webhook URL —
# lives in Vault at `secret/hippius-compute/observability/alertmanager`
# under property `alertmanager.yaml`. Keeping the whole config in Vault
# (rather than templating receivers from a hostname value) avoids the
# webhook ever transiting Git, and keeps route changes a Vault edit
# (operator-only) instead of a code PR.
#
# Example Vault payload (operator writes this, never committed):
#
#   vault kv put secret/hippius-compute/observability/alertmanager \
#     alertmanager.yaml=@alertmanager.yaml
#
# where `alertmanager.yaml` is the full upstream-format config:
#
#   route:
#     receiver: slack-operators
#     group_by: [alertname, severity]
#     repeat_interval: 4h
#     routes:
#       - matchers: ['alertname="Watchdog"']
#         receiver: slack-deadmans
#         repeat_interval: 1m
#   receivers:
#     - name: slack-operators
#       slack_configs:
#         - api_url: https://hooks.slack.com/services/T.../B.../...
#           channel: '#hippius-alerts'
#           send_resolved: true
#     - name: slack-deadmans
#       slack_configs:
#         - api_url: https://hooks.slack.com/services/T.../B.../...
#           channel: '#hippius-deadmans'
#           send_resolved: false
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: hippius-compute
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: alerts
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hippius-vault
    kind: ClusterSecretStore
  target:
    name: alertmanager-config
    creationPolicy: Owner
  data:
    - secretKey: alertmanager.yaml
      remoteRef:
        key: hippius-compute/observability/alertmanager
        property: alertmanager.yaml
