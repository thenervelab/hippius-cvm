---
# Grafana admin password — from Vault. PR-K14, §K (#54), issue #128.
#
# The kube-prometheus-stack chart's Grafana wiring reads the admin
# password out of the Secret named below via `admin.existingSecret`
# (see ../values.yaml). The value is operator-provisioned into Vault —
# never in Git (#1 anti-pattern 4). See README.md "Operator setup".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: hippius-compute
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: dashboard
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hippius-vault
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: hippius-compute/observability/grafana
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: hippius-compute/observability/grafana
        property: admin-password
