---
# Argo CD Application — MetalLB L2 LoadBalancer. PR-K3, §K (#54).
#
# Sync wave 2: after Cilium (wave 1). MetalLB needs pod networking to
# run its controller + speaker, so the CNI must converge first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hippius-compute-metallb
  namespace: argocd
  labels:
    app.kubernetes.io/name: hippius-compute-metallb
    app.kubernetes.io/part-of: hippius-compute
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: loadbalancer
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:thenervelab/hippius-compute-internal.git
    targetRevision: main
    path: deploy/gitops/addons/metallb
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 5
