---
# Argo CD Application — ingress-nginx. PR-K3, §K (#54).
#
# Sync wave 3: after Cilium (1) and MetalLB (2) — the controller's
# `LoadBalancer` Service needs MetalLB to assign it an IP. Shares the
# wave with the sibling cert-manager addon (the ACME HTTP-01 solver
# routes challenges through this controller).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hippius-compute-ingress-nginx
  namespace: argocd
  labels:
    app.kubernetes.io/name: hippius-compute-ingress-nginx
    app.kubernetes.io/part-of: hippius-compute
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: ingress
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:thenervelab/hippius-compute-internal.git
    targetRevision: main
    path: deploy/gitops/addons/ingress-nginx
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 5
