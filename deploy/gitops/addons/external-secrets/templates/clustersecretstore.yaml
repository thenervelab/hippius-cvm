---
# `hippius-vault` ClusterSecretStore — PR-K11, §K (#54).
#
# The cluster-wide binding from ESO to the operator's Vault instance.
# Every ExternalSecret in any namespace references this store by name
# (`secretStoreRef: {name: hippius-vault, kind: ClusterSecretStore}`) to
# pull a secret out of Vault — that is the §K "all app secrets transit
# Vault, never plaintext in Git" path.
#
# The endpoint is OPERATOR-SET: fill `vault.address` in values.yaml.
#
# ## TLS verification — ENABLED
#
# When `vault.caCert` is set, `caProvider` points at the sibling
# `vault-ca` ConfigMap and ESO pins verification to that CA; when it is
# empty, ESO verifies against the system trust store. There is
# deliberately NO `tls-skip-verify` / `insecure` field either way — TLS
# verification is a locked invariant.
#
# ## Auth — `jwt` with the ESO ServiceAccount (was: static `tokenSecretRef`)
#
# ESO now authenticates with a short-lived TokenRequest token minted for
# its OWN ServiceAccount; Vault validates the JWT and returns a 1h token
# carrying `hippius-compute-eso-read`. **Nothing is stored** — no static
# credential to leak, expire, or renew. This retires the `vault-token`
# Secret, whose unrenewed sibling in the `vali` namespace caused the
# 2026-08-08 Edge lockout (M-k8sauth, #94).
#
# ### Why `jwt` and not `kubernetes` auth
#
# `kubernetes` auth is the more usual choice — Vault calls TokenReview on
# the k8s API, which gives INSTANT revocation. It was implemented first
# and it does not work in this topology: the cluster's host firewall
# restricts `:6443` to the operator's own address and the NetBird range
# (INPUT policy DROP), and Vault runs outside both — so TokenReview is
# unreachable and every login returns a bare `permission denied`. (Note
# `:6443` reads as OPEN from an operator workstation because that
# workstation is itself whitelisted; that test is misleading.)
#
# Making it work would mean exposing the Kubernetes API to an external
# host. The operator declined that trade (2026-08-09), so Vault validates
# the SA JWT signature OFFLINE against the cluster's pinned RS256 signing
# pubkey (`jwt_validation_pubkeys`, from /openid/v1/jwks) with
# `bound_issuer=https://kubernetes.default.svc.cluster.local`. Zero
# inbound exposure, zero network dependency.
#
# ACCEPTED trade-offs of pinning: (a) if the cluster rotates its SA
# signing key, every login breaks until the new pubkey is re-pinned —
# there is no auto-discovery; (b) revocation is not instant, a minted
# token lives out its TTL (bounded to 1h) even if the SA is deleted.
#
# The Vault-side `jwt` backend + the `eso` role are **operator-configured,
# never in Git** (they need the root token). See README.md. The role binds
# `bound_subject` to exactly this ServiceAccount, so no other workload can
# assume it — and the policy stays RA-N1-scoped to the ESO-synced leaves,
# NOT a `hippius-compute/*` wildcard (source of truth is
# deploy/terraform/policies/hippius-compute-eso-read.hcl).
#
# `sync-wave: "2"` — after the ESO CRDs + webhook (chart, wave 0) and
# the `vault-ca` ConfigMap (wave 1).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: hippius-vault
  labels:
    app.kubernetes.io/name: hippius-vault
    app.kubernetes.io/part-of: hippius-compute
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: secret-store
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  # ── Namespace gate ──────────────────────────────────────────────────
  # A `ClusterSecretStore` is cluster-scoped — by default an
  # `ExternalSecret` in ANY namespace may reference it. `conditions`
  # restricts that to namespaces that have deliberately opted in by
  # carrying the `hippius.network/vault-secrets: enabled` label, so a
  # secret cannot be pulled into an arbitrary namespace. A consumer
  # (KBS, vali, …) labels its namespace as part of its own addon/app.
  conditions:
    - namespaceSelector:
        matchLabels:
          hippius.network/vault-secrets: enabled
  provider:
    vault:
      # Vault API endpoint — OPERATOR-SET (`vault.address` in values).
      # HTTPS only.
      server: {{ required "vault.address must be set (deploy/gitops/addons/external-secrets/values.yaml)" .Values.vault.address | quote }}
      # KV v2 secrets engine mount.
      path: {{ .Values.vault.path | quote }}
      version: {{ .Values.vault.version | quote }}
      {{- if .Values.vault.caCert }}
      # TLS verification pinned to the operator-supplied Vault CA
      # (sibling ConfigMap, rendered from `vault.caCert`). Omitted when
      # that value is empty, i.e. when Vault presents a publicly-trusted
      # certificate and the system trust store is the right anchor.
      caProvider:
        type: ConfigMap
        name: vault-ca
        key: ca.crt
        namespace: {{ .Release.Namespace }}
      {{- end }}
      auth:
        # Short-lived SA JWT — nothing stored, nothing to rotate.
        jwt:
          # Vault auth mount + role (operator-configured; see above).
          path: {{ .Values.vault.authPath | quote }}
          role: {{ .Values.vault.authRole | quote }}
          kubernetesServiceAccountToken:
            # ESO mints this via TokenRequest for its own SA. The audience
            # must match the role's `bound_audiences` on the Vault side.
            serviceAccountRef:
              name: hippius-compute-external-secrets
              namespace: {{ .Release.Namespace }}
            audiences:
              - "https://kubernetes.default.svc.cluster.local"
            expirationSeconds: 600
