---
# Argo CD Application — External Secrets Operator + Vault wiring.
# PR-K11, §K (#54).
#
# Sync wave 5: after the PR-K3 network/ingress addons (waves 1-3) and
# PR-K4 storage (wave 4). ESO must be running before any app that
# consumes an `ExternalSecret` — and, per the addons/README ordering
# rule, before the PR-K12 Argo CD self-management (the Argo CD repo
# credential is later delivered as an ExternalSecret).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hippius-compute-external-secrets
  namespace: argocd
  labels:
    app.kubernetes.io/name: hippius-compute-external-secrets
    app.kubernetes.io/part-of: hippius-compute
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: secrets-operator
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:thenervelab/hippius-compute-internal.git
    targetRevision: main
    path: deploy/gitops/addons/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      # ESO ships large CRDs — server-side apply avoids the client-side
      # last-applied-configuration annotation size limit.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 5
