# Values for the `cert-manager` dependency (see Chart.yaml). Nested
# under the `cert-manager:` key — the dependency's name.
cert-manager:
  # ── Images — digest-pinned ──────────────────────────────────────────
  # The upstream chart pins its images by TAG only (`v1.20.2`), which is
  # mutable: whoever controls the quay.io repo can re-point that tag and
  # every restart of the controller / webhook / cainjector silently runs
  # different bytes. cert-manager holds the cluster's ACME account key
  # and mints the TLS certs the ingress serves, so that is not an
  # acceptable supply-chain posture.
  #
  # The chart's image helper renders `repo:tag@digest` when BOTH `tag`
  # and `digest` are set (digest wins for the pull, tag stays as the
  # human-readable hint) — hence both are spelled out below. They are a
  # matched pair: bumping the chart version means re-resolving BOTH.
  #
  # Digests are the multi-arch INDEX digests of what the cluster is
  # already running, read back from the node
  # (`k3s crictl inspecti <ref>` → `repoDigests`), so applying this is a
  # no-op today and a guarantee tomorrow. `acmesolver` is never resident
  # on the node (it is pulled on demand for an ACME HTTP-01 challenge),
  # so its digest was resolved from quay.io directly.
  #
  # NOTE: the `webhook` and `cainjector` digests live in their existing
  # blocks further down (this chart's values already carry a `webhook:` /
  # `cainjector:` key for the PodDisruptionBudgets — a second top-level
  # key of the same name would silently shadow it in YAML).
  image:
    tag: v1.20.2
    digest: sha256:fe0623d7d04a382c888f03343a3a2da716e0d96ad3d5d790c0ebcbcb2a4329a5
  startupapicheck:
    image:
      tag: v1.20.2
      digest: sha256:4e2a69b4a0cc9627905bbeecf720f95d5153ca39cacdab923d2748e73556792b
  acmesolver:
    image:
      tag: v1.20.2
      digest: sha256:cfa55e9c3dcfc6a3cba97575748c1549b04a30fd14d88a2fcb9e2dddef415e2f

  # ── CRDs ────────────────────────────────────────────────────────────
  # cert-manager renders its own CRDs as part of the chart. `keep: true`
  # leaves them in place if this Application is ever removed, so issued
  # Certificate / Issuer objects are not silently destroyed.
  crds:
    enabled: true
    keep: true

  # ── Fleet labels ────────────────────────────────────────────────────
  # `global.commonLabels` stamps every cert-manager-rendered resource.
  global:
    commonLabels:
      app.kubernetes.io/part-of: hippius-compute
      app.kubernetes.io/managed-by: argocd

  # ── PodDisruptionBudgets ────────────────────────────────────────────
  # The controller, webhook and cainjector are each a single replica on
  # the single-node MVP — the locked "no replicas: 1 without a PDB" rule
  # (#1) requires an explicit PDB for each. `maxUnavailable: 1` allows
  # the singleton to be drained (no second node to fail over to).
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  webhook:
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    # Digest pin — see the "Images" section at the top of this file.
    image:
      tag: v1.20.2
      digest: sha256:baf651128b9f05c426cbd5e60e2036bf382c99ca270f49d0757d6f7d2452f4e5
  cainjector:
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    # Digest pin — see the "Images" section at the top of this file.
    image:
      tag: v1.20.2
      digest: sha256:6f5a644135887b2aa7d5cc145072fa56421560e3586ff1f184358022d490f4e1
