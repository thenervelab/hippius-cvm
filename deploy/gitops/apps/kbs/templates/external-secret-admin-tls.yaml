{{- if and .Values.admin.enabled .Values.admin.mtls.secretName .Values.admin.mtls.vaultPath }}
---
# Admin-listener mTLS material — the KBS's own server identity + the
# PINNED client CA every admin caller must chain to.
#
# ## Why Vault/ESO and not cert-manager
#
# cert-manager is in this cluster, but only as an ACME client for public
# ingress (`letsencrypt-*` ClusterIssuers). Using it here would mean
# adding a CA `Issuer`, and a cert-manager CA Issuer keeps the CA PRIVATE
# KEY in a Secret in the cluster it is protecting. That key mints admin
# client certs; anyone who can read that Secret can register VM states,
# seed boot counters and drive the §25 migration fence. The whole point
# of this listener's authentication is that in-cluster reach is not
# enough — so its trust root must not be an in-cluster object.
#
# The Edge already solves the identical problem the identical way
# (`apps/edge-gateway/templates/external-secret.yaml`): an
# operator-minted CA whose key never enters the cluster, with only the
# LEAF cert + key in Vault. This template is that pattern, second use.
# The public-ACME alternative is also the exact coupling #776 had to
# undo: an internal, launch-critical hop must not depend on a public DNS
# zone and an external CA.
#
# ## Contents
#
# - `tls.crt` / `tls.key` — the listener's identity. SAN MUST include
#   `kbs-server-admin.kbs.svc.cluster.local` (what vali dials).
# - `ca.crt` — the PINNED client CA. `admin_tls::build_server_config`
#   builds a `WebPkiClientVerifier` over exactly this bundle with no
#   `allow_unauthenticated()`, so a peer that cannot chain to it never
#   reaches a route.
#
# ⚠️  Mounting this Secret ENABLES ENFORCEMENT. `AdminListenerMode::
# decide` returns `Mtls` whenever the three paths are set, REGARDLESS of
# `admin.requireMtls` — that flag only covers the case where material is
# ABSENT. So rendering this template is the cutover, not a preparation
# for it: vali must already be able to present a client cert. Follow
# `docs/operator/kbs-admin-mtls-cutover-runbook.md` step for step.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.admin.mtls.secretName }}
  namespace: kbs
  labels:
    {{- include "kbs.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.admin.mtls.refreshInterval | default "1h" }}
  secretStoreRef:
    name: hippius-vault
    kind: ClusterSecretStore
  target:
    name: {{ .Values.admin.mtls.secretName }}
    creationPolicy: Owner
  data:
    # Dot-free Vault property names: ESO reads the remoteRef property
    # through gjson, which treats a dot as nesting.
    - secretKey: tls.crt
      remoteRef:
        key: {{ .Values.admin.mtls.vaultPath }}
        property: cert
    - secretKey: tls.key
      remoteRef:
        key: {{ .Values.admin.mtls.vaultPath }}
        property: key
    - secretKey: ca.crt
      remoteRef:
        key: {{ .Values.admin.mtls.vaultPath }}
        property: ca
{{- end }}
