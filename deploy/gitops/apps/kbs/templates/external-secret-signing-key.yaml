---
# KBS response-signing key — from Vault. PR-K6, §K (#54).
#
# `hippius-kbs-server` signs every KBS response with an in-process
# Ed25519 key loaded from `keys.signing_key_path` — a 32-byte raw seed
# (§D #101: response signing is in-process, NOT a Vault transit call).
#
# The seed is stored in Vault base64-encoded; `decodingStrategy: Base64`
# makes ESO materialise the raw 32 bytes into the `signing.key` Secret
# key, which deployment.yaml projects as a file at
# /etc/kbs-keys/signing.key.
#
# The VALUE is operator-provisioned into Vault — never in Git (#1
# anti-pattern 4). See README.md "Operator setup".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kbs-signing-key
  namespace: kbs
  labels:
    {{- include "kbs.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.vault.refreshInterval }}
  secretStoreRef:
    name: hippius-vault
    kind: ClusterSecretStore
  target:
    name: kbs-signing-key
    creationPolicy: Owner
  data:
    - secretKey: signing.key
      remoteRef:
        key: {{ .Values.vault.kbsSecretPath }}
        property: signing-key
        # The seed is base64 in Vault; ESO decodes it so the mounted
        # file is exactly 32 raw bytes (the binary rejects any other
        # length, fail-closed).
        decodingStrategy: Base64
