{{- if .Values.snp.enabled }}
---
# KBS SEV-SNP VEK PEM — from Vault.
#
# `hippius-kbs-server` reads the per-host VEK PEM at boot when
# `[snp].vek_pem_path` is set (the chart only writes that key into the
# config when `.Values.snp.enabled` is true). The PEM is an AMD-signed
# certificate, not a secret — but it IS chip-binding, and we keep it in
# Vault so the deploy mechanism is the same shape ESO uses for every
# other piece of operator-provided material (signing key, vault token).
#
# This `ExternalSecret` is rendered ONLY when `snp.enabled` is true —
# the chart's `required` guard refuses to render a Deployment with an
# empty `vekSecretName`, so the matching Secret MUST exist when the
# Deployment is reconciled.
#
# The §17 follow-up replaces this with an in-cluster AMD-KDS fetch
# sidecar (per-CHIP_ID, refreshes on TCB rotation). Until then this
# fixture is staged once by the operator, per host.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  # Same `required` message + quoting style as `deployment.yaml`'s VEK
  # volume mount — both renders must fail at the same place with the
  # same operator-facing diagnostic.
  name: {{ required ".Values.snp.vekSecretName must be set when snp.enabled is true (the ExternalSecret + Deployment both pin to this name)" .Values.snp.vekSecretName | quote }}
  namespace: kbs
  labels:
    {{- include "kbs.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.vault.refreshInterval }}
  secretStoreRef:
    name: hippius-vault
    kind: ClusterSecretStore
  target:
    name: {{ .Values.snp.vekSecretName | quote }}
    creationPolicy: Owner
  data:
    # `deployment.yaml` mounts this Secret with `items: [{key: vek.pem,
    # path: vek.pem}]` — the binary then reads `/etc/kbs-vek/vek.pem`.
    - secretKey: vek.pem
      remoteRef:
        key: {{ .Values.snp.vekVaultPath | default (printf "%s/vek" .Values.vault.kbsSecretPath) }}
        property: pem
{{- end }}
