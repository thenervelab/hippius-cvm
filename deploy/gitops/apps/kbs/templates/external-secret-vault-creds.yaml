---
# KBS Vault token — from Vault. PR-K6, §K (#54).
#
# `hippius-kbs-server` requires a `VAULT_TOKEN` at boot (it fails
# closed without one). In this §D-MVP build the token is the
# `vault_mvp::StaticTokenVaultKv` credential — but the Vault KV path is
# never actually reached, because the release pipeline fails closed at
# the deny-closed attestation verifier first (§D #101). The token is
# nonetheless a real least-privilege Vault token; the SNP-attested
# broker (#102) replaces this static-token seam.
#
# The VALUE is operator-provisioned into Vault — never in Git (#1
# anti-pattern 4). See README.md "Operator setup".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kbs-vault-creds
  namespace: kbs
  labels:
    {{- include "kbs.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.vault.refreshInterval }}
  secretStoreRef:
    name: hippius-vault
    kind: ClusterSecretStore
  target:
    name: kbs-vault-creds
    creationPolicy: Owner
  data:
    - secretKey: vault-token
      remoteRef:
        key: {{ .Values.vault.kbsSecretPath }}
        property: vault-token
