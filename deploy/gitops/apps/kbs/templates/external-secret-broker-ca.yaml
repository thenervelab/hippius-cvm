{{- if .Values.vault.brokerCaPath }}
---
# Broker server-TLS pin — the broker's exact leaf cert (RA-KBS-M1).
#
# The KBS reaches the broker over TLS (`vault.brokerUrl` is https) and
# pins THIS exact leaf: `ca_pinned_tls_config` does a byte-exact
# end-entity match, so a self-signed broker cert is correct and the
# hostname/SAN is ignored (the KBS dials the broker through the
# host-netns TCP relay by IP). Only the public cert is needed here — no
# key.
#
# Single source: reads `tls.crt` from the SAME Vault path the broker
# chart's `broker-tls` ExternalSecret uses for its server cert+key, so
# the served cert and this pin can never drift.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: broker-ca
  namespace: kbs
  labels:
    {{- include "kbs.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.vault.refreshInterval | default "1h" }}
  secretStoreRef:
    name: hippius-vault
    kind: ClusterSecretStore
  target:
    name: broker-ca
    creationPolicy: Owner
  data:
    # Dot-free Vault key (`cert`): ESO gjson reads a dot as nesting.
    - secretKey: ca.crt
      remoteRef:
        key: {{ .Values.vault.brokerTlsVaultPath | default "hippius-compute/kbs-vault-broker/tls" }}
        property: cert
{{- end }}
