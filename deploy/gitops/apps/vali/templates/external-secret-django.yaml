---
# vali Django SECRET_KEY — from Vault. PR-K7, §K (#54).
#
# settings.py refuses to start in production (DEBUG=false) with the
# placeholder dev key, so a real key MUST be supplied. The VALUE is
# operator-provisioned into Vault — never in Git (#1 anti-pattern 4).
# See README.md "Operator setup".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vali-django
  namespace: vali
  labels:
    {{- include "vali.labels" . | nindent 4 }}
    app.kubernetes.io/name: vali
    app.kubernetes.io/component: orchestration
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.vault.refreshInterval }}
  secretStoreRef:
    name: hippius-vault
    kind: ClusterSecretStore
  target:
    name: vali-django
    creationPolicy: Owner
  data:
    - secretKey: secret-key
      remoteRef:
        key: {{ .Values.vault.valiSecretPath }}
        property: django-secret-key
