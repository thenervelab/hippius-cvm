---
# Postgres for vali. PR-K7, §K (#54).
#
# Single-replica StatefulSet (the vali MVP — HA Postgres via
# CloudNativePG is a locked future migration, #54). Data on a
# local-path PVC (PR-K4). Sync wave 1: Argo brings Postgres Healthy
# before the django-migrations hook (wave 2) and vali itself (wave 3).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: vali
  labels:
    {{- include "vali.labels" . | nindent 4 }}
    {{- include "vali.postgresSelector" . | nindent 4 }}
    app.kubernetes.io/component: database
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "vali.postgresSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vali.labels" . | nindent 8 }}
        {{- include "vali.postgresSelector" . | nindent 8 }}
        app.kubernetes.io/component: database
    spec:
      # Non-confidential workload — any general-workloads node.
      nodeSelector:
        node-role.hippius.network/general-workloads: "true"
      automountServiceAccountToken: false
      securityContext:
        # The `postgres` user in the postgres:16-alpine image is uid/gid
        # 70. `fsGroup` makes the data PVC group-writable so Postgres
        # runs non-root.
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vali-db
                  key: password
            # Data in a subdirectory of the mount — the conventional
            # pattern (keeps PGDATA clear of the volume root).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- .Values.postgres.resources | toYaml | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            # RA-N11 — postgres:16-alpine writes only to its PVC
            # (/var/lib/postgresql/data), the unix-socket dir
            # (/run/postgresql), and /tmp. Lock the rootfs read-only; the
            # emptyDir mounts below cover those writable paths.
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # RA-N11 — writable tmpfs for a read-only rootfs.
            - name: run-postgresql
              mountPath: /run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        # RA-N11 — the only rootfs paths postgres needs to write with
        # readOnlyRootFilesystem=true (the socket dir + temp files).
        - name: run-postgresql
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "vali.labels" . | nindent 10 }}
          app.kubernetes.io/component: database
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: {{ .Values.postgres.storageSize | quote }}
