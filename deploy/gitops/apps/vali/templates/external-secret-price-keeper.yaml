{{- if .Values.priceKeeper.enabled }}
---
# §23 price keeper signing key — the dedicated keeper mnemonic, operator-
# provisioned into Vault (property `mnemonic`), never in Git. Mounted as a
# file by cronjob-price-keeper.yaml. NOT the epoch-close key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.priceKeeper.keySecretName }}
  namespace: vali
  labels:
    {{- include "vali.labels" . | nindent 4 }}
    app.kubernetes.io/name: vali
    app.kubernetes.io/component: price-keeper
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.vault.refreshInterval }}
  secretStoreRef:
    name: hippius-vault
    kind: ClusterSecretStore
  target:
    name: {{ .Values.priceKeeper.keySecretName }}
    creationPolicy: Owner
  data:
    - secretKey: mnemonic
      remoteRef:
        key: {{ .Values.priceKeeper.vaultPath }}
        property: mnemonic
{{- end }}
