{{- if eq (toString .Values.agentReleaseWatch.enabled) "true" }}
---
# Miner-agent releases (`vali_agent_release_watch`, apps.miners.agent_release):
# one GET of the GitHub release list per run, the complete releases stored
# for the operator rows (`latest_agent_release`, `update_pending`). Display
# only. Egress: `world:443` (networkpolicy.yaml, same switch).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: agent-release-watch
  namespace: vali
  labels:
    {{- include "vali.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-release-watch
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  schedule: {{ .Values.agentReleaseWatch.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            {{- include "vali.labels" . | nindent 12 }}
            app.kubernetes.io/component: agent-release-watch
            {{- include "vali.valiSelector" . | nindent 12 }}
        spec:
          restartPolicy: Never
          nodeSelector:
            node-role.hippius.network/general-workloads: "true"
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: {{ .Values.image.pullSecret.name }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: agent-release-watch
              image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
              imagePullPolicy: IfNotPresent
              command: ["python", "manage.py", "vali_agent_release_watch"]
              envFrom:
                - configMapRef:
                    name: vali-config
              env:
                # Set here, not in the shared ConfigMap: only this pod
                # reaches GitHub.
                - name: VALI_AGENT_RELEASE_WATCH
                  value: "true"
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: vali-db
                      key: database-url
                - name: DJANGO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: vali-django
                      key: secret-key
              resources:
                {{- .Values.agentReleaseWatch.resources | toYaml | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 50Mi
{{- end }}
