{{- if .Values.syntheticMonitor.full.enabled }}
---
# Synthetic-monitor orchestration-root token (apps.synthetic full tier).
#
# The full-e2e CronJob drives the ROOT-only `POST /v1/vm/launch` + §24
# decommission endpoints (IsOrchestrationRoot →
# VALI_ORCHESTRATION_ROOT_PRINCIPAL, `orchestration-root`). It authenticates
# with a `ServiceToken` Bearer for that principal — a §20 secret,
# operator-minted in-cluster and staged into Vault, NEVER in Git.
#
# Provisioning (one-off, per the identity tooling): mint a ServiceToken for
# the `orchestration-root` ServiceClient, then
#   vault kv put <syntheticMonitor.full.tokenVaultPath> root-token=<token>
# ESO materialises it into the `vali-synthetic-monitor` Secret the full
# CronJob mounts as VALI_SYNTHETIC_ROOT_TOKEN.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vali-synthetic-monitor
  namespace: vali
  labels:
    {{- include "vali.labels" . | nindent 4 }}
    app.kubernetes.io/name: vali
    app.kubernetes.io/component: synthetic-monitor
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.vault.refreshInterval }}
  secretStoreRef:
    name: hippius-vault
    kind: ClusterSecretStore
  target:
    name: vali-synthetic-monitor
    creationPolicy: Owner
  data:
    - secretKey: root-token
      remoteRef:
        key: {{ .Values.syntheticMonitor.full.tokenVaultPath }}
        property: root-token
{{- end }}
