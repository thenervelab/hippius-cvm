---
# GHCR image-pull credential — materialised from Vault. PR-K7, §K (#54).
#
# vali is a runc workload, so its image is in the PRIVATE
# `ghcr.io/thenervelab` registry and the kubelet needs a pull
# credential. A read-only GHCR PAT is operator-provisioned into Vault
# at `hippius-compute/ghcr` (properties `username` + `pull-token`) —
# the fleet-wide credential shared with PR-K8. This ExternalSecret
# materialises it as the `ghcr-pull-secret` dockerconfigjson Secret
# that the Deployment + the migration Job reference via
# `imagePullSecrets`. The ESO template expression is wrapped in Helm
# backticks so Helm passes it through verbatim for ESO to render.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: vali
  labels:
    {{- include "vali.labels" . | nindent 4 }}
    app.kubernetes.io/name: vali
    app.kubernetes.io/component: orchestration
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.image.pullSecret.refreshInterval }}
  secretStoreRef:
    name: hippius-vault
    kind: ClusterSecretStore
  target:
    name: {{ .Values.image.pullSecret.name }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: {{ `'{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}'` }}
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.image.pullSecret.vaultPath }}
        property: username
    - secretKey: token
      remoteRef:
        key: {{ .Values.image.pullSecret.vaultPath }}
        property: pull-token
