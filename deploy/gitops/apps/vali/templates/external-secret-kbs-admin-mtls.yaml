{{- if and .Values.kbsAdminMtls.secretName .Values.kbsAdminMtls.vaultPath }}
---
# vali's CLIENT identity on the KBS lifecycle admin hop.
#
# The KBS admin listener authenticates its callers with mTLS against a
# pinned CA and nothing else — none of its routes carries a per-request
# credential, and every one of them mutates the state that decides which
# host may unlock a tenant's encrypted disk. This Secret is vali's half
# of that gate.
#
# - `tls.crt` — vali's leaf. Its `SAN URI` MUST be
#   `spiffe://hippius.network/vali`: `admin_tls::peer_cert_info` reads it
#   back and stamps it as the `peer_san` of every KBS admin audit row, so
#   this string is what makes those rows attributable. A leaf with NO
#   identity carrier is dropped by the listener.
# - `tls.key` — the matching key. Mounted 0400.
# - `ca.crt` — the PINNED CA for the KBS admin listener's SERVER cert.
#   `services.kbs_admin_tls` installs it as the ONLY trust anchor for
#   that hop, so no public CA can satisfy it.
#
# Same provisioning story as the Edge's mTLS material
# (`apps/edge-gateway/templates/external-secret.yaml`): operator-minted
# from a CA whose private key never enters the cluster, held in Vault,
# projected by ESO. See `docs/operator/kbs-admin-mtls-cutover-runbook.md`.
#
# Mounting this is INERT on its own: vali keeps talking plaintext until
# `config.kbsAdminUrl` becomes `https://`. That asymmetry with the KBS
# side (where mounting material IS the cutover) is deliberate — it gives
# the rollout a step where the client half can be proven in isolation.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.kbsAdminMtls.secretName }}
  namespace: vali
  labels:
    {{- include "vali.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.kbsAdminMtls.refreshInterval | default "1h" }}
  secretStoreRef:
    name: hippius-vault
    kind: ClusterSecretStore
  target:
    name: {{ .Values.kbsAdminMtls.secretName }}
    creationPolicy: Owner
  data:
    # Dot-free Vault property names: ESO reads them through gjson, which
    # treats a dot as nesting.
    - secretKey: tls.crt
      remoteRef:
        key: {{ .Values.kbsAdminMtls.vaultPath }}
        property: cert
    - secretKey: tls.key
      remoteRef:
        key: {{ .Values.kbsAdminMtls.vaultPath }}
        property: key
    - secretKey: ca.crt
      remoteRef:
        key: {{ .Values.kbsAdminMtls.vaultPath }}
        property: ca
{{- end }}
