---
# Hippius S3 credentials for the nightly Postgres backup — from Vault.
# PR-K7, §K (#54).
#
# Consumed ONLY by the backup CronJob (cronjob-postgres-backup.yaml) to
# upload the dump to the `hippius-compute-backups` bucket. vali itself
# does NOT use S3 in this build — its S3 client factory defaults to the
# in-process mock (settings.py `VALI_S3_CLIENT_FACTORY`); the boto
# factory is a §G3 follow-up.
#
# The VALUES are operator-provisioned into Vault — never in Git. See
# README.md "Operator setup".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vali-s3
  namespace: vali
  labels:
    {{- include "vali.labels" . | nindent 4 }}
    app.kubernetes.io/name: vali
    app.kubernetes.io/component: postgres-backup
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.vault.refreshInterval }}
  secretStoreRef:
    name: hippius-vault
    kind: ClusterSecretStore
  target:
    name: vali-s3
    creationPolicy: Owner
  data:
    - secretKey: access-key
      remoteRef:
        key: {{ .Values.vault.s3SecretPath }}
        property: access-key
    - secretKey: secret-key
      remoteRef:
        key: {{ .Values.vault.s3SecretPath }}
        property: secret-key
