{{- if .Values.vaultAuth.jwt.enabled }}
---
# The identity vali authenticates to Vault WITH (M-k8sauth, #94).
#
# Before this, every vali workload ran as the namespace's `default`
# ServiceAccount. That is unusable as a Vault identity: a role bound to
# `system:serviceaccount:vali:default` would admit ANY pod in the
# namespace, so the credential would not identify vali at all.
#
# The Vault role pins `bound_subject` to exactly this SA. It is granted
# NO Kubernetes RBAC — it exists only to be a subject, and the pods keep
# `automountServiceAccountToken: false` so the API-audience token is
# never even mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.vaultAuth.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vali.labels" . | nindent 4 }}
    app.kubernetes.io/component: vault-auth
automountServiceAccountToken: false
{{- end }}
