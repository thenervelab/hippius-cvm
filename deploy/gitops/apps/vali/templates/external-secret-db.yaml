---
# vali Postgres credentials — from Vault. PR-K7, §K (#54).
#
# Materialises the `vali-db` Secret with two keys: the raw `password`
# (consumed by the Postgres StatefulSet + the backup CronJob) and a
# composed `database-url` (consumed by Django via `dj-database-url`).
# ESO's template engine builds the URL — the `{{ .password }}`
# expression is wrapped in Helm backticks so Helm passes it through
# verbatim for ESO to render.
#
# The password VALUE is operator-provisioned into Vault — never in Git
# (#1 anti-pattern 4). See README.md "Operator setup".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vali-db
  namespace: vali
  labels:
    {{- include "vali.labels" . | nindent 4 }}
    app.kubernetes.io/name: vali
    app.kubernetes.io/component: orchestration
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.vault.refreshInterval }}
  secretStoreRef:
    name: hippius-vault
    kind: ClusterSecretStore
  target:
    name: vali-db
    creationPolicy: Owner
    template:
      data:
        password: "{{ `{{ .password }}` }}"
        database-url: "postgres://{{ .Values.postgres.user }}:{{ `{{ .password }}` }}@postgres.{{ .Release.Namespace }}.svc.cluster.local:5432/{{ .Values.postgres.database }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.vault.valiSecretPath }}
        property: postgres-password
