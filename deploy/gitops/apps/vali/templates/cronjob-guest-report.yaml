{{- if eq (toString .Values.guestReport.enabled) "true" }}
---
# Guest upgrade report (`vali_guest_report`, docs/design/guest-component-rollout.md).
# Hourly, read-only: rollouts and guest upgrade jobs by state, jobs past
# their deadline, VMs behind a release, live attestations of VMs recorded
# stopped (T4). Feeds the `hippius-guest-upgrade` alerts. DB-only — no
# Vault, no API token.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: guest-report
  namespace: vali
  labels:
    {{- include "vali.labels" . | nindent 4 }}
    app.kubernetes.io/component: guest-report
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  schedule: {{ .Values.guestReport.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            {{- include "vali.labels" . | nindent 12 }}
            app.kubernetes.io/component: guest-report
            {{- include "vali.valiSelector" . | nindent 12 }}
        spec:
          restartPolicy: Never
          nodeSelector:
            node-role.hippius.network/general-workloads: "true"
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: {{ .Values.image.pullSecret.name }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: guest-report
              image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
              imagePullPolicy: IfNotPresent
              command: ["python", "manage.py", "vali_guest_report"]
              envFrom:
                - configMapRef:
                    name: vali-config
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: vali-db
                      key: database-url
                - name: DJANGO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: vali-django
                      key: secret-key
                - name: VALI_GUEST_KBS_T4_ENABLED
                  value: {{ .Values.guestReport.kbsT4 | quote }}
                - name: VALI_KBS_NONCE_TTL_S
                  value: {{ .Values.guestReport.kbsNonceTtlSecs | quote }}
              resources:
                {{- .Values.guestReport.resources | toYaml | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 50Mi
{{- end }}
