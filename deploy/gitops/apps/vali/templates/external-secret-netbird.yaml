{{- if .Values.netbird.enabled }}
---
# NetBird management-API token — §F (#306) tenant VM overlay enrolment.
#
# vali (`AsyncLaunchView` / the CLI) AND the `vali-launch-tick` worker mint
# a one-off NetBird setup-key per launch via the self-hosted management API
# (`VALI_NETBIRD_API_BASE`) using this token. BOTH the main `vali` pod and
# the `launch-tick` worker need it — the worker is the one that runs
# `launch_vm` for the async `POST /v1/vm/launch` path, so a token missing
# there silently 404s every default (netbird-on) launch.
#
# The token is a §20 secret — operator-provisioned into Vault, NEVER in
# Git. Materialised into the `vali-netbird-token` Secret consumed by both
# deployments' `VALI_NETBIRD_API_TOKEN` env (secretKeyRef).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vali-netbird-token
  namespace: vali
  labels:
    {{- include "vali.labels" . | nindent 4 }}
    app.kubernetes.io/name: vali
    app.kubernetes.io/component: netbird
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.vault.refreshInterval }}
  secretStoreRef:
    name: hippius-vault
    kind: ClusterSecretStore
  target:
    name: vali-netbird-token
    creationPolicy: Owner
  data:
    - secretKey: VALI_NETBIRD_API_TOKEN
      remoteRef:
        key: {{ .Values.netbird.vaultPath }}
        property: api_token
{{- end }}
