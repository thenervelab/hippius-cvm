---
# GHCR image-pull credential — materialised from Vault. PR-K8, §K (#54).
#
# The Edge image lives in the PRIVATE `ghcr.io/thenervelab` registry,
# so the kubelet needs a pull credential. A read-only GHCR PAT
# (`read:packages` only) is operator-provisioned into Vault at the
# `image.pullSecret.vaultPath` KV path (properties `username` +
# `pull-token`) — never in Git. This ExternalSecret materialises it as
# the `ghcr-pull-secret` dockerconfigjson Secret that deployment.yaml
# references via `imagePullSecrets`.
#
# Same ESO + `hippius-vault` ClusterSecretStore pipeline as the mTLS
# secret (PR-K11). The dockerconfigjson is assembled by ESO's own
# template engine — the ESO template expression in `.dockerconfigjson`
# below is wrapped in Helm backticks so Helm passes it through verbatim
# for ESO to render (`.username` / `.token` are this ExternalSecret's
# data keys; `b64enc` is the sprig function ESO exposes).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: edge-gateway
  labels:
    {{- include "edge-gateway.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.image.pullSecret.refreshInterval }}
  secretStoreRef:
    name: hippius-vault
    kind: ClusterSecretStore
  target:
    name: {{ .Values.image.pullSecret.name }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: {{ `'{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}'` }}
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.image.pullSecret.vaultPath }}
        property: username
    - secretKey: token
      remoteRef:
        key: {{ .Values.image.pullSecret.vaultPath }}
        property: pull-token
