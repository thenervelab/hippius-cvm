---
# Edge mTLS material — CA + cert + key — from Vault. PR-K8, §K (#54).
#
# The Edge terminates per-peer mTLS (PR-H4); the CA bundle, the Edge's
# own cert chain, and its private key are pulled from the Hippius
# Vault Tier-0 via the `hippius-vault` ClusterSecretStore (PR-K11) and
# materialised into the `edge-gateway-mtls` Secret, which
# deployment.yaml mounts read-only at /etc/hippius-edge/mtls.
#
# The secret VALUES are operator-provisioned into Vault — never in Git
# (#1 anti-pattern 4). Until the dedicated hippius-compute CA lands
# (PR-K13) the operator seeds a bootstrap CA + Edge cert at the
# `vaultPath` below; see README.md "mTLS material".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: edge-gateway-mtls
  namespace: edge-gateway
  labels:
    {{- include "edge-gateway.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.mtls.refreshInterval }}
  secretStoreRef:
    name: hippius-vault
    kind: ClusterSecretStore
  target:
    name: edge-gateway-mtls
    creationPolicy: Owner
  data:
    - secretKey: ca.pem
      remoteRef:
        key: {{ .Values.mtls.vaultPath }}
        property: ca
    - secretKey: cert.pem
      remoteRef:
        key: {{ .Values.mtls.vaultPath }}
        property: cert
    - secretKey: key.pem
      remoteRef:
        key: {{ .Values.mtls.vaultPath }}
        property: key
