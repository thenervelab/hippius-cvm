{{- if .Values.valiIngestToken.enabled }}
---
# Edge → vali served-receipt ingest bearer token (§23 uptime billing).
#
# vali's `/v1/telemetry/ingest` pins `ServiceTokenAuthentication` on the
# JSON wrapper path (served receipts), unlike the token-exempt raw-CBOR
# heartbeat path (which authenticates via the `x-hippius-peer-id` mTLS
# identity). The Edge forwards a relayed tenant-VM served-receipt over
# that JSON path, so it must present a ServiceToken bearer.
#
# The plaintext token is a `secrets.token_urlsafe(32)` (~43 chars) minted
# by `ServiceToken.issue` for the `edge-telemetry-relay` ServiceClient;
# the operator vault-writes it under the property below. Materialised
# into the `edge-gateway-vali-ingest-token` Secret, which deployment.yaml
# exposes as the `HIPPIUS_EDGE_VALI_INGEST_TOKEN` env — `post_json` stamps
# it as `Authorization: Bearer <token>`. Never in Git; never a file.
#
# Gated by `.Values.valiIngestToken.enabled` — default off so a cluster
# where Vault has not yet been provisioned with the token keeps booting.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: edge-gateway-vali-ingest-token
  namespace: edge-gateway
  labels:
    {{- include "edge-gateway.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.valiIngestToken.refreshInterval }}
  secretStoreRef:
    name: hippius-vault
    kind: ClusterSecretStore
  target:
    name: edge-gateway-vali-ingest-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: {{ .Values.valiIngestToken.vaultPath }}
        property: token
{{- end }}
