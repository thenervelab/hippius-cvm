{{- if .Values.orderSigning.enabled }}
---
# Edge order-signing Ed25519 PRIVATE seed — §H phase-2 follow-up.
#
# The Edge signs lifecycle orders (`POST /v1/edge/order`, a follow-up
# PR) for miners with this key; every miner-agent verifies via the
# matching pubkey rendered into its `/etc/hippius-miner/config.toml`
# by Ansible (`deploy/ansible/group_vars/miner_nodes.yml`'s
# `edge_order_signing_pubkey`). The miner's `verify_strict` accepts
# only signatures that came from THIS key — so the two sides MUST be
# rotated together (see README.md "Order signing").
#
# The seed is a 32-byte raw Ed25519 private key, stored as 64
# lowercase-hex chars under the property below; the operator
# vault-writes it offline (the keypair is generated air-gapped, never
# committed). Materialised into the `edge-gateway-order-signing`
# Secret, which deployment.yaml mounts read-only at
# `/etc/hippius-edge/order-signing/priv.hex` and points
# `EDGE_ORDER_SIGNING_KEY_PATH` at.
#
# Gated by `.Values.orderSigning.enabled` — default off so existing
# clusters (where Vault has not yet been provisioned with the seed)
# keep booting through. The operator flips this once they have run
# the runbook end-to-end.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: edge-gateway-order-signing
  namespace: edge-gateway
  labels:
    {{- include "edge-gateway.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.orderSigning.refreshInterval }}
  secretStoreRef:
    name: hippius-vault
    kind: ClusterSecretStore
  target:
    name: edge-gateway-order-signing
    creationPolicy: Owner
  data:
    - secretKey: priv.hex
      remoteRef:
        key: {{ .Values.orderSigning.vaultPath }}
        property: priv
{{- end }}
