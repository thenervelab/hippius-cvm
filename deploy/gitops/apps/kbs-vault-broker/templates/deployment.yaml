---
# SNP-attestation-bound Vault broker (#102).
#
# CONFIDENTIAL: `runtimeClassName: kata-qemu-snp` runs the pod inside
# an AMD SEV-SNP CVM, pinned to the SEV-SNP node — same posture as the
# KBS it serves. The broker holds the cluster's ONLY privileged Vault
# credential; its runtime is confidential so the credential never sits
# in a runc pod's host-readable memory. (The k8s-Secret BOOTSTRAP of
# that credential remains the documented v1 residual — see
# docs/design/vault-broker-102.md.)
#
# `replicaCount: 1` — the challenge store is in-memory + single-use; a
# nonce issued by replica A cannot be redeemed against replica B.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kbs-vault-broker
  namespace: kbs
  labels:
    {{- include "broker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Single-replica with an in-memory challenge store — recreate, don't
  # surge (two live brokers would split the challenge space).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "broker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "broker.labels" . | nindent 8 }}
    spec:
      # Confidential runtime — an AMD SEV-SNP CVM, pinned to the
      # SEV-SNP node. The RuntimeClass already carries this
      # nodeSelector; repeated here as defence in depth.
      runtimeClassName: kata-qemu-snp
      nodeSelector:
        node-role.hippius.network/confidential-compute: "true"
      # The broker never calls the Kubernetes API — no token to mount.
      automountServiceAccountToken: false
      {{- if .Values.image.pullSecret.enabled }}
      # Authenticated guest-pull (see values.yaml `image.pullSecret`).
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret.name | quote }}
      {{- end }}
      # kata guest-pull cannot reach the CoreDNS ClusterIP (PR-K5) —
      # public resolvers, same as the KBS pod.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - "1.1.1.1"
          - "8.8.8.8"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kbs-vault-broker
          # Content-addressed — digest, never a floating tag.
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: IfNotPresent
          # argv[1] = config path (also the binary's default; explicit
          # so the contract survives a default change).
          args:
            - "/etc/kbs-vault-broker/config.toml"
          env:
            # ⛔ DO NOT SYNC THIS APP. Syncing it takes the whole platform
            # down, immediately and completely:
            #
            #   `strategy: Recreate` (above, with replicaCount 1) DELETES the
            #   running broker BEFORE starting its replacement. The
            #   replacement cannot start, because the Secret named below does
            #   not exist — CreateContainerConfigError. There is no old pod
            #   left to fall back to.
            #
            #   With no broker there is no scoped Vault capability, so the KBS
            #   cannot unwrap any tenant KEK. NOTHING unlocks: no VM launch
            #   completes, no §24 crypto-erase runs, and every running guest
            #   that needs a re-release is stuck. It stays down until someone
            #   notices and reverts the sync.
            #
            # This is NOT a rollout that fails safely. Do not "just try it".
            #
            # Why the reference is dangling, on purpose: #892 replaced this
            # static-token auth with a projected ServiceAccount JWT
            # (BROKER_VAULT_JWT_{ROLE,AUTH_PATH,TOKEN_PATH} + a
            # `serviceAccountToken` volume at /var/run/secrets/vault), which
            # is what the live Deployment has run since 2026-08-09. #888 then
            # retired the static token itself: neither `kbs-vault-broker-token`
            # nor its ExternalSecret exists in the cluster any more, and the
            # template that used to materialise it
            # (`external-secret-vault-token.yaml`) was deleted in #975.
            #
            # Left pointing at nothing DELIBERATELY, rather than restoring a
            # template that would quietly recreate a REVOKED credential and
            # let the broker come up authenticating with it.
            #
            # The fix — rewriting this block and re-pinning the image digest
            # past #892 — is a separate change. It needs the real
            # broker-image.yml run URL for d1302ca, because `provenance:` in
            # values.yaml is machine-checked against the Sigstore certificate
            # by .github/scripts/verify_image_provenance.py.
            - name: BROKER_VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kbs-vault-broker-token
                  key: vault-token
          ports:
            - name: http
              containerPort: {{ .Values.config.listenPort }}
              protocol: TCP
          # Startup — the kata-qemu-snp microVM boots before the
          # container, slower than a runc pod. Up to ~150s (30 × 5s);
          # liveness/readiness only begin once it succeeds.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
              {{- if .Values.tls.enabled }}
              # TLS listener — probe over HTTPS or the kubelet reads the
              # TLS ServerHello as a malformed HTTP response and the pod
              # never becomes Ready (RA-KBS-M1).
              scheme: HTTPS
              {{- end }}
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              {{- if .Values.tls.enabled }}
              scheme: HTTPS
              {{- end }}
            periodSeconds: 15
            failureThreshold: 3
          # The broker is ready as soon as it serves: config parsed,
          # verifier chain boot-gate passed, listener bound — all
          # before the first /healthz 200.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              {{- if .Values.tls.enabled }}
              scheme: HTTPS
              {{- end }}
            periodSeconds: 10
          resources:
            {{- .Values.resources | toYaml | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            # Stateless binary — nothing writes anywhere.
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/kbs-vault-broker
              readOnly: true
            {{- if .Values.tls.enabled }}
            # RA-KBS-M1 — server-TLS cert + key (broker-tls Secret).
            - name: broker-tls
              mountPath: /etc/kbs-vault-broker/tls
              readOnly: true
            {{- end }}
            {{- if .Values.snp.mountedVekFallback }}
            - name: vek
              mountPath: /etc/broker-vek
              readOnly: true
            {{- end }}
            {{- if .Values.vault.caCert }}
            - name: vault-ca
              mountPath: /etc/vault-ca
              readOnly: true
            {{- end }}
      volumes:
        # `config.toml`, from the kbs-vault-broker-config ConfigMap.
        - name: config
          configMap:
            name: kbs-vault-broker-config
        {{- if .Values.tls.enabled }}
        # RA-KBS-M1 — server-TLS cert + key from Vault (broker-tls).
        - name: broker-tls
          secret:
            secretName: broker-tls
            defaultMode: 0440
        {{- end }}
        {{- if .Values.vault.caCert }}
        # PROD Vault CA bundle (public cert) — see configmap-vault-ca.yaml.
        - name: vault-ca
          configMap:
            name: kbs-vault-broker-vault-ca
            items:
              - key: ca.pem
                path: ca.pem
        {{- end }}
        {{- if .Values.snp.mountedVekFallback }}
        # Dev fallback VEK PEM (mountedVekFallback). Prod uses the
        # report-carried VEK and renders neither this nor the
        # ExternalSecret.
        - name: vek
          secret:
            secretName: {{ required ".Values.snp.vekSecretName must be set when mountedVekFallback is true" .Values.snp.vekSecretName | quote }}
            defaultMode: 0440
            items:
              - key: vek.pem
                path: vek.pem
        {{- end }}
