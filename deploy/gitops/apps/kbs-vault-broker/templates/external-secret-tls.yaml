{{- if .Values.tls.enabled }}
---
# Broker server-TLS cert + key — from Vault (RA-KBS-M1).
#
# Closes the broker↔KBS token-in-cleartext residual: with these paths
# set the broker serves the challenge/redeem transport over TLS
# (`axum-server` + `ring`), so the minted per-VM Vault token never
# transits the wire in plaintext. The KBS pins THIS exact leaf cert
# (see the kbs chart's `broker-ca` ExternalSecret) — an exact-leaf
# match, so a self-signed cert is correct and hostname/SAN is ignored
# (the KBS reaches the broker through the host-netns TCP relay by IP).
#
# The VALUE is operator-provisioned into Vault (cert + key), never in
# Git. Single source: the kbs chart's `broker-ca` reads the same
# `tls.crt` from this path, so the server cert and the KBS pin can
# never drift. Rotate by re-staging both keys here + bumping nothing
# else.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: broker-tls
  namespace: kbs
  labels:
    {{- include "broker.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.vault.refreshInterval }}
  secretStoreRef:
    name: hippius-vault
    kind: ClusterSecretStore
  target:
    name: broker-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    # Vault stores the PEMs under dot-free keys (`cert`/`key`): ESO's
    # gjson property lookup reads a dot as nesting, so `tls.crt` would
    # miss. The k8s Secret still projects the tls.crt/tls.key names the
    # kubernetes.io/tls type requires (secretKey, below).
    - secretKey: tls.crt
      remoteRef:
        key: {{ .Values.tls.vaultPath }}
        property: cert
    - secretKey: tls.key
      remoteRef:
        key: {{ .Values.tls.vaultPath }}
        property: key
{{- end }}
