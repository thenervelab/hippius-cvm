# The identity the broker authenticates to Vault WITH (jwt auth, #892).
# The Vault role `kbs-vault-broker` pins `bound_subject` to exactly this SA.
# It is granted NO Kubernetes RBAC: it exists only to be a subject, and the
# pod keeps `automountServiceAccountToken: false` so the API-audience token
# is never mounted. (Created out of band on 2026-08-10; now in git.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.vaultAuth.serviceAccountName }}
  namespace: kbs
  labels:
    {{- include "broker.labels" . | nindent 4 }}
automountServiceAccountToken: false
