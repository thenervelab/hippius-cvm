{{- if .Values.snp.mountedVekFallback }}
---
# Broker SEV-SNP VEK PEM — from Vault. #102 PR C.
#
# The broker verifies the KBS's SNP self-report against the SAME
# platform VEK the KBS verifies guests against (when both workloads run
# on the same host), so this ExternalSecret points at the KBS chart's
# existing Vault path (`hippius-compute/kbs/vek`, property `pem`) —
# one operator-staged VEK serves both consumers. The PEM is an
# AMD-signed certificate, not a secret; Vault+ESO is just the uniform
# deploy mechanism.
#
# The §17 follow-up replaces this with an in-cluster AMD-KDS fetch
# (per-CHIP_ID, refreshes on TCB rotation).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ required ".Values.snp.vekSecretName must be set (the ExternalSecret + Deployment both pin to this name)" .Values.snp.vekSecretName | quote }}
  namespace: kbs
  labels:
    {{- include "broker.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.vault.refreshInterval }}
  secretStoreRef:
    name: hippius-vault
    kind: ClusterSecretStore
  target:
    name: {{ .Values.snp.vekSecretName | quote }}
    creationPolicy: Owner
  data:
    # `deployment.yaml` mounts this Secret with `items: [{key: vek.pem,
    # path: vek.pem}]` — the binary then reads /etc/broker-vek/vek.pem.
    - secretKey: vek.pem
      remoteRef:
        key: {{ .Values.snp.vekVaultPath }}
        property: pem
{{- end }}
