{{- if .Values.image.pullSecret.enabled }}
---
# Harbor pull secret — from Vault. #102 PR C.
#
# DORMANT (`image.pullSecret.enabled: false`). It was written for a
# broker image in a PRIVATE registry project, on the assumption that
# kata/CoCo forwards the kubelet's CRI pull credentials into the guest.
# That did not hold: the in-guest CDH blob fetch got 401 (2026-06-10, see
# values.yaml), so the image is in the PUBLIC
# registry.hippius.com/hippius-infra namespace instead. Kept for
# non-CVM reuse.
#
# The robot credential is operator-staged in Vault at
# `secret/hippius-compute/registry/harbor`, property
# `dockerconfigjson` (the full .docker/config.json `auths` document).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.image.pullSecret.name | quote }}
  namespace: kbs
  labels:
    {{- include "broker.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.vault.refreshInterval }}
  secretStoreRef:
    name: hippius-vault
    kind: ClusterSecretStore
  target:
    name: {{ .Values.image.pullSecret.name | quote }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ `{{ .dockerconfigjson }}` }}"
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: {{ .Values.image.pullSecret.vaultPath }}
        property: dockerconfigjson
{{- end }}
