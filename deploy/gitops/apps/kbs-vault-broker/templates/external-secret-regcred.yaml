{{- if .Values.image.pullSecret.enabled }}
---
# Harbor pull secret — from Vault. #102 PR C.
#
# The broker image lives in the team's PRIVATE Harbor project
# (registry.hippius.com/hip-team-private). The kata-qemu-snp guest
# pulls the image ITSELF (nydus-for-kata-tee guest-pull); recent
# kata/CoCo forwards the kubelet's CRI pull credentials into the
# guest, so `imagePullSecrets` works for authenticated guest-pull.
# (Validated live at deploy — if a kata version regression breaks
# credential forwarding, the fallback is a public registry project.)
#
# The robot credential is operator-staged in Vault at
# `secret/hippius-compute/registry/harbor`, property
# `dockerconfigjson` (the full .docker/config.json `auths` document).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.image.pullSecret.name | quote }}
  namespace: kbs
  labels:
    {{- include "broker.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.vault.refreshInterval }}
  secretStoreRef:
    name: hippius-vault
    kind: ClusterSecretStore
  target:
    name: {{ .Values.image.pullSecret.name | quote }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ `{{ .dockerconfigjson }}` }}"
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: {{ .Values.image.pullSecret.vaultPath }}
        property: dockerconfigjson
{{- end }}
