# cargo-audit (RustSec) configuration — read by the CI `audit` job
# (.github/workflows/ci.yml). This is the dependency-vulnerability gate:
# `cargo audit` FAILS the build on any advisory NOT listed under `ignore`,
# so a new CVE in the dependency graph blocks the merge (RA-M-NEW-1).
#
# Only VULNERABILITIES fail the gate; `unmaintained` / `yanked` advisories
# are reported as warnings (non-fatal) — tracked but not blocking, since
# they carry no exploit and often have no drop-in replacement.

[advisories]
# Advisories intentionally allowed, each with an explicit rationale. Keep
# this list minimal and re-evaluate on every dependency bump.
ignore = [
    # RUSTSEC-2023-0071 — RSA "Marvin" key-recovery timing side-channel in
    # the `rsa` crate. Pulled in TRANSITIVELY by `sev` (SEV-SNP attestation),
    # which uses RSA ONLY to VERIFY AMD's certificate chain (public-key
    # verification; AMD holds the private keys). The Marvin oracle needs
    # private-key decrypt/sign operations this codebase never performs, so
    # it is not exploitable here. No fixed `rsa` release exists yet — revisit
    # when `rsa` ships a patch or `sev` drops the dependency.
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0381 — webpki-roots ships the emSign ECC Root CA - G3,
    # which lets paths through distrusted intermediates; fixed in 1.0.10.
    # Ignored for the webpki-roots 0.26.11 copy: 0.26.11 is a shim whose
    # whole lib is `pub use parent::TLS_SERVER_ROOTS` with
    # `parent = webpki-roots "1"`, so it ships the 1.x root set, and 1.x is
    # locked at >= 1.0.10 (the fixed set). cargo-audit ignores are per
    # advisory, not per version, so this would also mute a 1.x regression:
    # scripts/ci/check-webpki-roots-floor.sh (audit job) fails on any 1.x
    # below 1.0.10 and on any 0.26 other than the 0.26.11 shim.
    # The only 0.26 consumer is ureq 2.x (every 2.x release pins 0.26);
    # remove this entry when ureq >= 3.1 lands (#1721).
    "RUSTSEC-2026-0381",
    # RUSTSEC-2026-0387 — timing variability in crypto-bigint 0.5.5
    # "constant-time" ops; fixed in >= 0.7.6. Reached only via
    # elliptic-curve 0.13 from (a) p384, which kbs-core uses solely to
    # VERIFY the AMD VCEK signature on SNP reports (public key, public
    # data — signing with p384 exists only in a unit test), and (b) k256
    # pulled by frame-support/sp-core (polkadot-sdk stable2407) for the
    # pallets, where no node-side secret-key EC operation runs from our
    # binaries. A timing leak needs a secret operand, so not exploitable
    # here. The 0.7 line needs elliptic-curve 0.14 (p384 0.14 + a
    # polkadot-sdk bump); remove this entry when both land.
    "RUSTSEC-2026-0387",
]
