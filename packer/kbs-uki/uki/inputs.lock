# `packer/kbs-uki/uki/inputs.lock` — pinned UKI inputs.
#
# Every input that affects the assembled UKI bytes is pinned here
# by SHA-256. `scripts/fetch-inputs.sh` downloads each URL and
# refuses to proceed if the digest doesn't match.
#
# Updating any digest is a deliberate PR — the §22 allowlist
# signer will refuse the new measurement until the corresponding
# allowlist epoch is bumped, so out-of-band drift between
# inputs.lock and the allowlist is itself fail-closed.
#
# Format (one entry per line):
#   <KEY>_URL    = <url>
#   <KEY>_SHA256 = <hex digest>
#
# KEY values currently consumed by the Makefile:
#   KERNEL          — Linux kernel binary OR a Debian .deb archive
#                     from which `scripts/build-initramfs.sh`
#                     extracts /boot/vmlinuz-*.
#   SYSTEMD_STUB    — UEFI stub PE used by `ukify` as the UKI
#                     skeleton.
#
# ## First-prod pin (PR-F UKI build pins + publish)
#
# The pinned snapshot is **2026-04-30T14:42:39Z** on snapshot.debian.org,
# which is content-addressed forever (the snapshot service mirrors a
# point-in-time view of the Debian archive). The kernel is the latest
# Debian-signed trixie 6.12 LTS at that snapshot; the systemd-boot stub
# is the trixie `systemd-boot-efi` for the matching systemd 257 line.

KERNEL_URL    = http://snapshot.debian.org/archive/debian/20260430T144239Z/pool/main/l/linux-signed-amd64/linux-image-6.12.63%2bdeb13-amd64_6.12.63-1_amd64.deb
KERNEL_SHA256 = 240f369b20bf2c9ec1e160a42713e6c77a39bef61fcda8ee2fd8d5c27e1059ac

SYSTEMD_STUB_URL    = http://snapshot.debian.org/archive/debian/20260430T144239Z/pool/main/s/systemd/systemd-boot-efi_257.9-1%7edeb13u1_amd64.deb
SYSTEMD_STUB_SHA256 = 602d0524a3ff2cf2f18175b06c2ac725fd9c046373b20947251d6da57e0672c1
