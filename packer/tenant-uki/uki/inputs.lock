# `packer/tenant-uki/uki/inputs.lock` — pinned UKI inputs (tenant flavour).
#
# Every input that affects the assembled tenant UKI bytes is pinned
# here by SHA-256. `scripts/fetch-inputs.sh` downloads each URL and
# refuses to proceed if the digest doesn't match.
#
# Updating any digest is a deliberate PR — the §22 allowlist signer
# will refuse the new measurement until the corresponding allowlist
# epoch is bumped, so out-of-band drift between `inputs.lock` and the
# allowlist is itself fail-closed.
#
# Format (one entry per line):
#   <KEY>_URL    = <url>
#   <KEY>_SHA256 = <hex digest>
#
# KEY values currently consumed by the Makefile:
#   KERNEL          — Linux kernel binary (Debian `.deb` archive from
#                     which `scripts/fetch-inputs.sh` extracts
#                     `/boot/vmlinuz-*`).
#   SYSTEMD_STUB    — UEFI stub PE used by `ukify` as the UKI skeleton.
#   NETBIRD         — NetBird agent static tarball (Linux/amd64) the
#                     tenant rootfs ships at `/sbin/netbird`. A pinned
#                     SHA is mandatory — bundling the binary in the
#                     measured rootfs makes a NetBird version change a
#                     §22 allowlist-affecting input.
#
# ## Shared with `packer/kbs-uki/`
#
# `KERNEL` and `SYSTEMD_STUB` are pinned to the **exact same values**
# as `packer/kbs-uki/uki/inputs.lock` (same Debian snapshot, same
# trixie 6.12 LTS kernel + systemd 257 stub) — bumping one without the
# other is a measurement-affecting drift. The OVMF firmware pin is
# shared too (sourced from `../../kbs-uki/ovmf/ovmf.lock`, see the
# Makefile) — there is one §22 OVMF anchor for the whole fleet.
#
# ## First-prod pin
#
# The kernel + stub snapshot is **2026-04-30T14:42:39Z** on
# snapshot.debian.org (content-addressed forever). The NetBird pin is
# **v0.71.3** — matches `deploy/ansible/group_vars/miner_nodes.yml`
# `versions.netbird` so the host-side miner agent and the guest-side
# tenant rootfs run the exact same NetBird build.

KERNEL_URL    = http://snapshot.debian.org/archive/debian/20260430T144239Z/pool/main/l/linux-signed-amd64/linux-image-6.12.63%2bdeb13-amd64_6.12.63-1_amd64.deb
KERNEL_SHA256 = 240f369b20bf2c9ec1e160a42713e6c77a39bef61fcda8ee2fd8d5c27e1059ac

SYSTEMD_STUB_URL    = http://snapshot.debian.org/archive/debian/20260430T144239Z/pool/main/s/systemd/systemd-boot-efi_257.9-1%7edeb13u1_amd64.deb
SYSTEMD_STUB_SHA256 = 602d0524a3ff2cf2f18175b06c2ac725fd9c046373b20947251d6da57e0672c1

# NetBird v0.71.3 — Linux/amd64 static tarball from the GitHub release.
# `fetch-inputs.sh` verifies this SHA over the WHOLE tarball; the
# extracted `netbird` binary is bundled into the verity-protected
# rootfs by `build-rootfs.sh`, so a version change rebuilds the
# rootfs → re-computes the verity root → re-derives the launch
# measurement (§22 allowlist epoch).
NETBIRD_URL    = https://github.com/netbirdio/netbird/releases/download/v0.71.3/netbird_0.71.3_linux_amd64.tar.gz
NETBIRD_SHA256 = 4c65906532781e5a664e376ee0691f57fead6ea6082b0463f3e4ff56ed79cef9
