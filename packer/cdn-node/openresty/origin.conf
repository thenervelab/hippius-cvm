# The S3 origin endpoint (CDN beta: Hippius S3 only, spec §16 decision 4).
# Baked into the measured image. A feed entry can only name a bucket and
# a prefix on this endpoint; it can never point a node at another host.
map $host $hippius_s3_scheme { default "https"; }
map $host $hippius_s3_host { default "s3.hippius.com"; }
