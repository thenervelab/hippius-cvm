# Cloud-init datasource pin. The agent-initramfs writes a NoCloud
# seed at `/var/lib/cloud/seed/nocloud/` (see
# `binaries/agent-initramfs/src/stages/seed.rs::NOCLOUD_SEED_DIR`)
# BEFORE `switch_root`; the Debian rootfs's cloud-init must read
# from that exact path AT first boot.
#
# `datasource_list: [ NoCloud, None ]` — short-circuits the
# auto-detection that would otherwise probe DataSourceEC2,
# DataSourceConfigDrive, etc. (each costs ~seconds at first boot
# and would all fail in a CVM that has no metadata service).
# `None` is the final fallback so cloud-init's `main()` doesn't
# error if NoCloud is somehow absent — cloud-init then runs the
# defaults (no user-data; sshd already configured by us).
#
# `seedfrom: file:///var/lib/cloud/seed/nocloud/` — explicitly
# points cloud-init at the agent-initramfs's seed dir; mirrors the
# `ds=nocloud` kernel cmdline token agent-initramfs's
# `assert_hardened_cmdline` requires.

datasource_list: [ NoCloud, None ]
datasource:
  NoCloud:
    # Empty fs_label disables the volume-label probe (no `cidata`
    # volume mounted in our CVM — the seed is on the tmpfs-mounted
    # /var/lib/cloud/seed instead).
    fs_label: null
    seedfrom: file:///var/lib/cloud/seed/nocloud/
