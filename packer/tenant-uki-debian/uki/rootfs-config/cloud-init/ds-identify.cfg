# cloud-init's ds-identify is a shell script run at first boot that
# scans the system for datasource hints (block devices, kernel
# cmdline, DMI strings, etc.) and writes the result to
# `/run/cloud-init/cloud.cfg`. With `policy: enabled` it ALWAYS runs;
# with `policy: disabled` cloud-init reads `datasource_list` verbatim
# from `/etc/cloud/cloud.cfg.d/`. We disable it because:
#
#   1. We've already pinned `datasource_list: [ NoCloud, None ]` in
#      `90-hippius-nocloud.cfg` — ds-identify would just confirm it.
#   2. ds-identify shells out to `udevadm` + `blkid` + `lsblk` which
#      hit the libvirt-NAT virtio_blk + /dev/vda discovery; that
#      probing serializes vs systemd-udevd and adds ~seconds to
#      first-boot, all to reach the conclusion we already pinned.
#   3. ds-identify writes `/run/cloud-init/cloud.cfg` with a
#      timestamp — disabling it means no per-boot non-deterministic
#      runtime file under /run that downstream tooling might inspect.

policy: disabled
