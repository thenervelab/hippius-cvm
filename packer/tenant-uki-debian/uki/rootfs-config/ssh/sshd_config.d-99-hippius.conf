# /etc/ssh/sshd_config.d/99-hippius.conf — hardened sshd drop-in.
#
# `build-rootfs.sh` ships this file into the verity rootfs at
# `/etc/ssh/sshd_config.d/99-hippius.conf`. The base
# `/etc/ssh/sshd_config` shipped by Debian Trixie's openssh-server
# 9.x already has `Include /etc/ssh/sshd_config.d/*.conf` at the top,
# so this drop-in's settings WIN over the base defaults.
#
# §RUNTIME — interface binding
#
# Production target: bind ONLY to the NetBird wt0 mesh interface so
# tenant SSH is reachable EXCLUSIVELY over the encrypted overlay,
# never via the libvirt-NAT eth0. Listing `ListenAddress wt0` in the
# drop-in would block ssh.service from starting until netbird.service
# brings wt0 up (which can race). The chosen compromise:
#
#   - Drop-in pins `ListenAddress 0.0.0.0` so sshd starts cleanly.
#   - Operator follow-up (separate PR): a systemd dropin under
#     `ssh.service.d/` adds `After=netbird.service` + a `BindsTo=`
#     to bring sshd down if NetBird drops, and a firewall rule
#     restricts the kernel from accepting connections on the non-
#     wt0 interface. Until that lands, the host-side
#     `miner-host-firewall.yml` (#160) already blocks public-net
#     ingress to the tenant CVM; the placeholder posture is safe
#     for Phase 1 acceptance.
#
# §AUTH posture
#
# - Root login: `prohibit-password` — root via SSH key only (no
#   password). Tenants get root via cloud-init's `users:` (separate
#   non-root user) — the operator's `ssh_authorized_keys` user-data
#   field populates `/root/.ssh/authorized_keys` AND any per-user
#   `~/.ssh/authorized_keys`.
# - PasswordAuthentication: no — keys only.
# - AuthorizedKeysCommand: none — purely file-based to avoid
#   external lookup-script attack surface.
# - KbdInteractiveAuthentication: no — disables PAM challenges.
# - StrictHostKeyChecking: not an sshd option (it's an ssh client
#   one); the spec mentioned it but it would be a configuration
#   error here; OMIT to keep sshd from refusing to parse the file.

ListenAddress 0.0.0.0

PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
UsePAM yes

AuthorizedKeysFile .ssh/authorized_keys
AuthorizedKeysCommand none

# Disable forwarding the operator probably doesn't want in a
# baseline tenant CVM; cloud-init runcmd can re-enable per tenant
# if a workload needs it.
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
GatewayPorts no
X11Forwarding no

# Bound login attempts + per-conn time. The defaults are generous;
# tighten for a hands-off serverless posture.
LoginGraceTime 30
MaxAuthTries 3
MaxSessions 4
ClientAliveInterval 60
ClientAliveCountMax 3
