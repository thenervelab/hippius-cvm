# `packer/tenant-uki-debian/uki/inputs.lock` — pinned UKI inputs (Debian
# 13 tenant flavour, EPIC #186 Phase 1).
#
# Every input that affects the assembled tenant-debian UKI bytes is
# pinned here by SHA-256. `scripts/fetch-inputs.sh` downloads each URL
# and refuses to proceed if the digest doesn't match.
#
# Updating any digest is a deliberate PR — the §22 allowlist signer
# will refuse the new measurement until the corresponding allowlist
# epoch is bumped, so out-of-band drift between `inputs.lock` and the
# allowlist is itself fail-closed.
#
# Format (one entry per line):
#   <KEY>_URL    = <url>
#   <KEY>_SHA256 = <hex digest>
#
# KEY values currently consumed by the Makefile:
#   KERNEL          — Linux kernel binary (Debian `.deb` archive from
#                     which `scripts/fetch-inputs.sh` extracts
#                     `/boot/vmlinuz-*`; the SAME `.deb` also ships
#                     the `.ko.xz` modules the initramfs needs +
#                     the modules the post-pivot rootfs's modprobe
#                     resolves at runtime).
#   SYSTEMD_STUB    — UEFI stub PE used by `ukify` as the UKI skeleton.
#   NETBIRD         — NetBird agent static tarball (Linux/amd64) the
#                     tenant rootfs ships at `/usr/local/bin/netbird`.
#                     A pinned SHA is mandatory — bundling the binary
#                     in the dm-verity-protected rootfs makes a NetBird
#                     version change a §22 allowlist-affecting input.
#   DEBIAN_BOOTSTRAP — snapshot.debian.org base URL the chroot apt
#                     repository points at. Pinning to a snapshot
#                     timestamp pins the entire trixie package set
#                     bit-for-bit; `build-rootfs.sh` writes
#                     `/etc/apt/sources.list` from this URL so the
#                     in-chroot `apt install` lands the EXACT same
#                     packages every run.
#
# ## Shared with `packer/tenant-uki/`
#
# `KERNEL`, `SYSTEMD_STUB`, and `NETBIRD` are pinned to the **exact
# same values** as `packer/tenant-uki/uki/inputs.lock` — there is one
# fleet kernel + one fleet NetBird version, and a real Debian rootfs
# diverging on either of those from the placeholder rootfs would
# break the operator's mental model. The OVMF firmware pin is shared
# too (sourced from `../../kbs-uki/ovmf/ovmf.lock`, see the Makefile)
# — one §22 OVMF anchor for the whole fleet.
#
# ## First-prod pin
#
# Kernel + stub snapshot: **2026-04-30T14:42:39Z** on
# snapshot.debian.org (content-addressed forever).
# NetBird: **v0.71.3** — matches
# `deploy/ansible/group_vars/miner_nodes.yml::versions.netbird`.
# Debian bootstrap repository: **same snapshot.debian.org timestamp**
# as the kernel pin — picks the same package set the kernel was built
# against, so the chroot's `linux-image-*` (transitively pulled by
# `linux-image-amd64`) and the in-initramfs vmlinuz are co-built.

KERNEL_URL    = http://snapshot.debian.org/archive/debian/20260430T144239Z/pool/main/l/linux-signed-amd64/linux-image-6.12.63%2bdeb13-amd64_6.12.63-1_amd64.deb
KERNEL_SHA256 = 240f369b20bf2c9ec1e160a42713e6c77a39bef61fcda8ee2fd8d5c27e1059ac

SYSTEMD_STUB_URL    = http://snapshot.debian.org/archive/debian/20260430T144239Z/pool/main/s/systemd/systemd-boot-efi_257.9-1%7edeb13u1_amd64.deb
SYSTEMD_STUB_SHA256 = 602d0524a3ff2cf2f18175b06c2ac725fd9c046373b20947251d6da57e0672c1

NETBIRD_URL    = https://github.com/netbirdio/netbird/releases/download/v0.71.3/netbird_0.71.3_linux_amd64.tar.gz
NETBIRD_SHA256 = 4c65906532781e5a664e376ee0691f57fead6ea6082b0463f3e4ff56ed79cef9

# snapshot.debian.org bootstrap. The path includes both `/debian/`
# (the regular trixie release) and `/debian-security/` (for the
# `trixie-security` archive). `build-rootfs.sh` writes a sources.list
# that references both. The timestamp is identical to the kernel pin
# so the apt repo contents match the kernel build's contemporaneous
# package set — no skew between the modules the kernel `.deb` ships
# and the package versions the chroot apt resolves.
DEBIAN_BOOTSTRAP_URL = http://snapshot.debian.org/archive/debian/20260430T144239Z
DEBIAN_BOOTSTRAP_SECURITY_URL = http://snapshot.debian.org/archive/debian-security/20260430T144239Z
