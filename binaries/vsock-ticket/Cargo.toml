[package]
name = "hippius-vsock-ticket"
version = "0.0.1"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Slim CLI that receives one host-pushed COSE OrderTicket on AF_VSOCK and writes it to --out. Used by the BYO base-OS initramfs keyscript (see scripts/initramfs/hippius-luks-keyscript) when the operator did NOT pre-stage the ticket via hippius.ticket_path=. Wraps agent-initramfs::stages::ticket_vsock::recv_ticket so the wire format stays single-sourced with miner-agent::vsock::ticket_push."

[lints]
workspace = true

[[bin]]
name = "hippius-vsock-ticket"
path = "src/main.rs"

[dependencies]
# `default-features = false`: see hippius-guest-release — static musl
# build for distro-independent initramfs staging.
hippius-agent-initramfs = { path = "../agent-initramfs", default-features = false }
hippius-types = { path = "../../hippius-types" }
clap = { version = "4", features = ["derive"] }
