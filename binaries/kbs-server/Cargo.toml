[package]
name = "hippius-kbs-server"
version = "0.0.1"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Hippius Confidential Compute — Tier-0 KBS production binary entrypoint (§D). Wires the kbs-core release pipeline + the kbs-server axum transport into a runnable process: TOML config (deny_unknown_fields, fail-closed), durable file-backed stores, hash-chained audit sink, §22 signed-allowlist load, graceful shutdown. The SNP verifier is real (kbs_core::snp_real::RealSnpVerifier anchored to the binary-built-in AMD ARK + operator-mounted VEK PEM). One remaining transitional seam is the static-token Vault KV client — replaced by the SNP-attested broker follow-up; production-grade per-CHIP_ID VEK fetch from AMD KDS is the §17 follow-up; see README.md."

[lints]
workspace = true

[[bin]]
name = "hippius-kbs-server"
path = "src/main.rs"

[lib]
name = "hippius_kbs_server"
path = "src/lib.rs"

[dependencies]
kbs-core = { path = "../../kbs-core" }
kbs-transport = { path = "../../kbs-transport" }
# §8 / #102 PR B: the canonical-CBOR broker wire types
# (`hippius_types::vault_broker::{ChallengeRequest, RedeemRequest, …}`)
# spoken by `remote_broker_auth::RemoteBrokerVaultAuth` — the same
# crate the broker binary decodes with, so both sides share one
# fail-closed codec. (Was dev-only for the boot-restart allowlist
# fixtures; now load-bearing at runtime.)
hippius-types = { path = "../../hippius-types" }
# AMD SEV-SNP cert types (`Certificate`, `Chain`, `ca::Chain`) + the
# binary-built-in ARK/ASK roots and `AttestationReport` ABI parser.
# Pinned to the same version + feature set as kbs-core to keep the chain
# verifier API contract in lockstep; `crypto_nossl` keeps the build
# pure-Rust (no system OpenSSL). The `snp` feature also gates
# `sev::firmware::guest::Firmware` — the `/dev/sev-guest` ioctl the §8
# broker self-report (`kbs_self_report::SevGuestSelfReport`) wraps; no
# extra feature is needed (the guest module is Linux-gated internally).
sev = { version = "7.1", default-features = false, features = ["snp", "crypto_nossl"] }
# Async runtime + the axum HTTP server. `signal` drives graceful
# shutdown on SIGTERM (k8s pod stop) / SIGINT.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
axum = { version = "0.7", default-features = false, features = ["http1", "tokio"] }
# Operator config — TOML, `default-features = false` keeps only the
# parser (no date / sptr features), matching `binaries/edge-gateway`.
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
# KBS response-signing key load + Ed25519 public-key parsing. The
# `zeroize` feature makes `SigningKey` wipe its secret material on drop.
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "zeroize"] }
# Secrets (Vault token, signing-key bytes) wiped on drop.
zeroize = "1.8"
hex = "0.4"
# Public-key FINGERPRINTS for the `GET /v1/admin/config` posture readout
# (`wiring::pubkey_fingerprint`). Already in the tree via kbs-core /
# kbs-transport, so this adds no new third-party surface.
sha2 = "0.10"
thiserror = "2"
# MVP static-token Vault KV-v2 client — blocking HTTP (the kbs-core
# `VaultKv::read_exact` seam is synchronous).
ureq = "2"
# rustls (re-exported via ureq) + PEM parse for the Vault CA pin, and —
# since the admin-listener mTLS gate (`admin_tls`) — the TLS 1.3 server
# side of the admin port. `ring` is pinned explicitly and passed to
# every builder rather than relying on the process-default provider (two
# unified-in providers would make the default builders fail at runtime).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
# Async rustls adapter for the admin listener's per-connection
# handshake. `axum::serve` cannot be used there: TLS is terminated
# per-connection so the VERIFIED peer cert can be stamped into each
# request's extensions (`PeerCertInfo`) for admin-audit attribution.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# Serves the axum admin `Router` (a `tower::Service`) over each accepted
# TLS stream. HTTP/1.1 only — vali posts the admin API with stdlib
# `urllib`.
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
tower = { version = "0.5", default-features = false }
# Reads SAN URI / SAN DNS / Subject CN + the serial off the verified
# client leaf, which is what puts a real `peer_san` in the admin audit
# chain instead of `None`.
x509-parser = "0.16"
serde_json = "1"
# PR-V schema lock: tenant release secrets are staged as
# `{"value": "<base64>"}` in KV-v2. `StaticTokenVaultKv::read_exact`
# decodes the base64 before HPKE-wrap, so the bytes the guest unwraps
# are byte-identical to what the operator originally staged (matches
# the kbs-core / hippius-guest in-memory test fixtures' raw-bytes
# contract). STANDARD = RFC 4648 §4 alphabet, no URL-safe, no line
# wraps.
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
# The admin-mTLS test drives a raw HTTP/1.1 exchange over the TLS stream
# (no HTTP client dep needed), which wants tokio's io-util traits.
tokio = { version = "1", default-features = false, features = ["io-util"] }
# Boot-restart integration tests mint an in-memory §22 allowlist
# artifact (canonical-CBOR + COSE_Sign1 EdDSA) to exercise the
# install-vs-revalidate boot logic. Same canonical-CBOR / COSE crates
# as `kbs_core::allowlist` + `binaries/kbs-allowlist-tool`, so the
# test artifact's bytes match what the runtime accepts.
ciborium = "0.2"
coset = "0.3"
# The admin-mTLS integration test mints a throwaway PKI (client CA +
# server cert + an in-CA and an out-of-CA client cert) so the
# "unauthenticated peer is refused BEFORE the handler" claim is proven
# against a real rustls handshake, not a mock. Same pin/features as
# `binaries/edge-gateway`'s mTLS tests.
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
# The admin-mTLS CLIENT-interop test drives the REAL `kbs-admin-client`
# `rustls::ClientConfig` (the binary vali shells out to for every §24
# register-vm) against the REAL admin listener. Interop between the two
# halves of a mutual-TLS gate is precisely what a mock cannot prove, and
# a client that cannot complete the handshake takes every launch down —
# so the two halves are tested TOGETHER, in one process, in CI.
# Test-only, one direction: nothing in kbs-server's shipped code imports
# the client crate.
hippius-kbs-admin-client = { path = "../kbs-admin-client" }
ureq = { version = "2", default-features = false, features = ["tls"] }
