[package]
name = "hippius-kbs-vault-broker"
version = "0.0.1"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "SNP-attestation-bound Vault broker (#102) — verifies the KBS's own SEV-SNP self-attestation (AMD chain + measurement allowlist + TCB/policy + fresh challenge-nonce binding) and mints a per-VM-scoped, short-TTL Vault token. Replaces the KBS's static Vault token: no reusable fleet credential, every capability mint attested + audited. Runs as a confidential kata-snp pod."

[lints]
workspace = true

[dependencies]
kbs-core = { path = "../../kbs-core" }
hippius-types = { path = "../../hippius-types" }
# AMD SEV-SNP cert types + built-in ARK/ASK + the report ABI parser.
# Same version + feature set as kbs-core/kbs-server so the chain
# verifier contract stays in lockstep; crypto_nossl keeps it pure-Rust.
sev = { version = "7.1", default-features = false, features = ["snp", "crypto_nossl"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
axum = { version = "0.7", default-features = false, features = ["http1", "tokio"] }
# RA-KBS-M1 — optional server-TLS on the broker↔KBS hop. `ring` crypto
# provider (matches ureq's rustls; the workspace resolves ring, not
# aws-lc-rs). Off unless the operator sets `listen.tls_{cert,key}_path`.
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
zeroize = "1.8"
hex = "0.4"
thiserror = "2"
# Blocking HTTP for the Vault token-create call. `json` enables
# `send_json` / `into_json` for the Vault API bodies.
ureq = { version = "2", features = ["json"] }
serde_json = "1"
# CSPRNG for challenge nonces.
rand = "0.8"

# `rustls` re-exported via ureq for the dev-insecure TLS verifier + the
# RA-KBS-M1 server-TLS `ring` provider install.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# PEM parse for the operator-mounted Vault CA bundle (prod TLS pin).
rustls-pemfile = "2"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time"] }
# `oneshot` drives the axum router in handler tests.
tower = { version = "0.5", default-features = false, features = ["util"] }
