# Hippius guest components release (docs/design/guest-component-rollout.md).
# scripts/guest/build-guest-release.sh turns this into the release record
# the measured initramfs reads (adding commit= and squashfs_sha256=).
#
# version:        bump on every release.
# security_epoch: bump when the release fixes a security flaw OR changes
#                 something an older release cannot read back (a volume
#                 format). vali never launches a VM below its required
#                 epoch again, so a release that bumps it cannot be rolled
#                 back automatically.
# health_mask:    the health checks the release's keepalive attests
#                 (hippius_types::live_attestation::components_health,
#                 decimal; 15 = mounted + keepalive-from-release + telemetry
#                 active + eol-sign armed). 0 / absent: no health leg. The
#                 KBS must accept the leg (schema v4) before a release that
#                 declares it is built; etc/keepalive.env must then set
#                 HIPPIUS_KEEPALIVE_ATTEST_COMPONENTS=1 (the builder checks).
version=2
security_epoch=1
health_mask=15
# Units the release ships under units/ and links over the base's, with the
# target whose .wants/ enables them. retire=<unit> masks a unit an earlier
# release or the base shipped and this one drops.
enable=hippius-keepalive.service:multi-user.target
enable=hippius-tenant-telemetry.service:multi-user.target
enable=hippius-eol-sign.service:multi-user.target
