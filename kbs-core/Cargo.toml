[package]
name = "kbs-core"
version = "0.0.1"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Hippius Confidential Compute — Tier-0 Key Broker Service core (spec: ARCHITECTURE.md §4/§6/§7/§8/§20/§21/§24)"

[lints]
workspace = true

[dependencies]
hippius-types = { path = "../hippius-types" }
coset = "0.3"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets"] }
hpke = { version = "0.12", default-features = false, features = ["std", "x25519"] }
sha2 = "0.10"
hmac = "0.12"
p384 = { version = "0.13", default-features = false, features = ["ecdsa"] }
subtle = "2.6"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
thiserror = "2"
rand = "0.8"
hex = "0.4"
sev = { version = "7.1", default-features = false, features = ["snp", "crypto_nossl"] }
serde_json = "1"
base64 = "0.22"

[dev-dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
tempfile = "3"
# The raw-bytes report-sig regression test synthesizes a P-384 key,
# signs the SNP report body, and verifies it — needs ECDSA signing +
# SEC1 pubkey export (the non-test path only verifies).
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
